id: css_komponenten
titel: CSS-Komponenten
beschreibung: |
  47 fertige UI-Bauteile zum Nachbauen. Anders als die Atom-Pfade
  (Flexbox/Grid/Grundlagen) kombiniert jede Aufgabe hier mehrere
  Konzepte zu einem realen Stueck UI. Wer Grundlagen, Flexbox und Grid
  sicher beherrscht, kann diesen Pfad als 'Bibliothek nachbauen'
  durcharbeiten.

  Sortiert nach Komponenten-Typ:
    Grundformen      Pill-Button, zentrierte Karte, einfaches Grid
    Flex-Ausrichtung Flex-Zeile, Spalte, Wrap, Beides-Mittig, Auto-Grid
    Kreis            Avatar / Indikator
    Buttons          Outline, Ghost, Icon-only, FAB, Block
    Cards            Basis, Schatten, horizontal, KPI
    Loader           Ring, Drei-Punkte (statisch)
    Navigation       Header, Sidebar, Tabs, Bottom-Bar
    Forms            Input, Textarea, Toggle, Checkbox, Label-Gruppe
    Layouts          Hero, zwei Spalten
    Komponenten      Breadcrumb, Pagination, Tooltip, Chat-Bubble,
                     Search-Box, Skeleton, Rating, Stepper, Drop-Zone,
                     Sticky-Footer, Modal, Empty-State, Quote, Code-Block,
                     Banner
