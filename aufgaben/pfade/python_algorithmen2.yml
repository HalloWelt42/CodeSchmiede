id: python_algorithmen2
titel: Python-Algorithmen 2
beschreibung: |
  Sortier-Algorithmen-Sammlung. Selection-Sort und Insertion-Sort als
  langsame, aber lehrreiche $O(n^2)$-Klassiker. Merge-Sort und
  Quicksort als schnelle Divide-and-Conquer-Verfahren in $O(n \log n)$.
  Wer alle vier durchhat, hat ein gutes Bauchgefuehl fuer Sortier-
  Strategien.
reihenfolge:
