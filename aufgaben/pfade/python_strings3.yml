id: python_strings3
titel: Python-Strings 3
beschreibung: |
  Aufgabentyp aus der Tooling-Welt: snake/camelCase, Substring-Suche
  mit Überlappung, längstes Wort, Hamming-Distanz, Pangram, Isogram,
  Scrabble-Punkte, eindeutige Teilstrings, Anagramm-Finder, und
  Akronym mit gemischten Trennzeichen. Praktische Bausteine für
  Linter, Formatter und Text-Statistik.
