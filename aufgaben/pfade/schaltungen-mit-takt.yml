id: schaltungen-mit-takt
titel: Schaltungen mit Takt
beschreibung: |
  Flipflops merken sich ein Bit bis zum nächsten Takt: ein Bit merken,
  Umschalter, Zähler bis 3 und bis 9, Lauflicht, Ampel als Automat und
  ein Würfel auf der 7-Segment-Anzeige.
