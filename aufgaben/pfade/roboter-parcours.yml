titel: Roboter-Parcours
beschreibung: |
  Einen Roboter mit Python durchs Raster steuern: erst Befehle der Reihe
  nach, dann Schleifen, Bedingungen und eigene Funktionen, am Ende ein
  Labyrinth. Versteckte Welten prüfen, ob das Programm allgemein gilt.
