id: css_grid
titel: CSS-Grid Lernpfad
beschreibung: |
  12 Grid-Aufgaben mit progressivem Aufbau: vom Aktivieren des
  Rasters bis zur responsiven Galerie ohne eine Media-Query.
  Jede Aufgabe lehrt EIN neues Konzept, mit Aha-Notiz und Praxis-Bezug.

  Reihenfolge:
    01     display: grid einschalten
    02-03  Spalten festlegen (Pixel + fr-Verhaeltnis)
    04     gap zwischen Zellen
    05     repeat() fuer Wiederholungen
    06-07  Einzelne Zellen ueber mehrere Spalten ziehen (span / explizit)
    08     grid-template-rows
    09     2D-Positionierung mit grid-row + grid-column
    10     Benannte Bereiche per grid-template-areas
    11     minmax() fuer untere/obere Grenzen
    12     auto-fit + minmax -- das wichtigste Pattern in modernem CSS
reihenfolge:
