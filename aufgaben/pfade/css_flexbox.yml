id: css_flexbox
titel: CSS-Flexbox Lernpfad
beschreibung: |
  15 didaktisch aufgebaute Flexbox-Aufgaben mit klarer Progression
  -- vom Aktivieren von display:flex bis zu align-self-Ausnahmen.
  Jede Aufgabe fuehrt GENAU EINE neue Property ein, mit Aha-Notiz und
  Praxis-Bezug. Inspiriert von Flexbox-Froggy, aber mit echten Lernzielen
  statt Frosch-Lebensraum.

  Reihenfolge:
    01-05  justify-content (Haupt-Achse)
    06-07  align-items (Quer-Achse)
    08-09  flex-direction (Achsen-Drehung)
    10     flex-wrap (mehrzeilig)
    11-13  Item-Eigenschaften: grow / shrink / basis
    14     order (Reihenfolge ohne DOM-Änderung)
    15     align-self (Container-Ausrichtung überschreiben)
reihenfolge:
  - f001-flex-aktivieren
