id: css_grundlagen
titel: CSS-Grundlagen Lernpfad
beschreibung: |
  15 Aufgaben zu den Fundamenten von CSS -- Selektoren, Cascade,
  Box-Modell. Wer Layouts mit Flexbox oder Grid bauen will, muss
  zuerst diese Bausteine sicher kennen.

  Reihenfolge:
    01-08  Selektoren: Element, Klasse, ID, Descendant, Child (>),
            Adjacent (+), :first-child, :nth-child
    09-10  Cascade: Specificity (was gewinnt), Inheritance (was wird
            vererbt)
    11-15  Box-Modell: Padding, Margin, box-sizing (das Aha-Erlebnis),
            Border + Radius, width 100%
reihenfolge:
  - s001-element-selektor
  - s002-klassen-selektor
