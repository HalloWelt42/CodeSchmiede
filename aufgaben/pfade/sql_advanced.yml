id: sql_advanced
titel: "SQL-Advanced: Window-Funktionen und CTEs"
beschreibung: |
  Die mächtigsten SQL-Werkzeuge. Window-Funktionen (ROW_NUMBER, RANK, DENSE_RANK, LAG/LEAD, SUM OVER) erlauben Berechnungen über Gruppen ohne den Datenfluss zu brechen. CTEs (WITH ...) machen komplexe Queries lesbar. Recursive CTEs erzeugen Zahlenfolgen, traversieren Bäume.
