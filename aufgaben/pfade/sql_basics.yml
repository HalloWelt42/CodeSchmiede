id: sql_basics
titel: "SQL-Basics: SELECT, WHERE, ORDER"
beschreibung: |
  Einfache Abfragen ohne JOIN, ohne Aggregate. Hier lernst du, wie man Spalten wählt, Zeilen filtert (WHERE/BETWEEN/IN/LIKE/IS NULL), sortiert (ORDER BY), Treffer begrenzt (LIMIT) und Duplikate entfernt (DISTINCT). Fundament für alle weiteren SQL-Pfade.
