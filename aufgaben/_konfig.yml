# Zentrale Konfiguration der Codeschmiede.
#
# Hier werden Schwierigkeitsstufen, Sprachen und Aufgabentypen definiert.
# Backend liest beim Start, Watcher reagiert bei Änderungen, Frontend
# zieht reaktiv über /api/admin/konfig.
#
# Wer eine neue Schwierigkeit haben möchte (z.B. "kind", "meister"),
# fügt einfach einen Eintrag dazu, ohne Code-Änderung.

schwierigkeiten:
  - id: anfaenger
    titel: Anfänger
    farbe: green
    score_max: 25
  - id: mittel
    titel: Mittel
    farbe: orange
    score_max: 50
  - id: fortgeschritten
    titel: Fortgeschritten
    farbe: red
    score_max: 75
  - id: experte
    titel: Experte
    farbe: red
    score_max: 100

sprachen:
  - id: python
    titel: Python
    editor_lang: python
    endung: py
    runner_type: docker_python
  - id: javascript
    titel: JavaScript
    editor_lang: javascript
    endung: js
    runner_type: docker_javascript
  - id: css
    titel: CSS
    editor_lang: css
    endung: css
    runner_type: iframe_css
  - id: sql
    titel: SQL
    editor_lang: sql
    endung: sql
    runner_type: docker_sqlite
  - id: maschine
    titel: Maschinen
    editor_lang: plaintext
    endung: txt
    runner_type: server

aufgabentypen:
  - id: code_schreiben
    titel: Code schreiben
    view: code_aufgabe
    beschreibung: "Klassisches Programmieren: Editor, Tests, Sandbox-Lauf."
  - id: programm
    titel: Programm
    view: code_aufgabe
    beschreibung: "Ein ganzes Programm schreiben: es bekommt Eingaben und muss die erwartete Ausgabe liefern."
  - id: output_quiz
    titel: Output-Quiz
    view: output_quiz
    beschreibung: "Ein Code-Schnipsel ist gegeben: wähle die richtige Ausgabe."
  - id: bug_finden
    titel: Bug finden
    view: bug_finden
    beschreibung: "Code mit Fehler ist gegeben: finde den Fehler und behebe ihn."
  - id: lueckentext
    titel: Lückentext
    view: lueckentext
    beschreibung: "Code mit Platzhaltern (___1___, ___2___): fülle die Lücken aus."
  - id: css_klon
    titel: CSS-Klon
    view: css_klon
    beschreibung: "Ein Zielbild ist gegeben: schreibe das CSS, das dasselbe Bild erzeugt."
  - id: sql_abfrage
    titel: SQL-Abfrage
    view: sql_abfrage
    beschreibung: "Ein Datensatz ist vorgegeben: schreibe eine SELECT-Abfrage, die das erwartete Ergebnis liefert."
  - id: sql_aenderung
    titel: SQL-Änderung
    view: sql_abfrage
    beschreibung: "Ein Datensatz ist vorgegeben: ändere ihn mit INSERT, UPDATE, DELETE oder CREATE TABLE; eine Kontrollabfrage prüft das Ergebnis."
  - id: sql_krimi
    titel: SQL-Krimi
    view: sql_krimi
    beschreibung: Ein Fall in Kapiteln - die Antwort auf jede Frage steckt in einem Abfrageergebnis.
  - id: roboter
    titel: Roboter-Parcours
    view: roboter
    beschreibung: Ein Roboter im Raster - steuere ihn mit Python ins Ziel, auch in versteckten Welten.
  - id: ausgabe_sprint
    titel: Ausgabe-Sprint
    view: ausgabe_sprint
    beschreibung: Zehn Schnipsel gegen die Uhr - sage voraus, was der Code ausgibt.
  - id: muster_jagd
    titel: Muster-Jagd
    view: muster_jagd
    beschreibung: Treffer und Nieten sind vorgegeben - finde einen regulären Ausdruck, der alle Treffer und keine Niete trifft.
  - id: ampel
    titel: Ampelschule
    view: ampel
    beschreibung: Eine Ampelsteuerung in Python schreiben - Verkehr, Fußgänger und Unfälle zeigen, ob sie stimmt.
  - id: aufzug
    titel: Aufzugsteuerung
    view: aufzug
    beschreibung: Eine Aufzugsteuerung in Python schreiben - Fahrgäste, Türen und Wartezeiten zeigen, ob sie stimmt.
  - id: turing
    titel: Turingmaschine
    view: turing
    beschreibung: Eine Übergangstabelle bauen - Band, Kopf und Zustände zeigen Schritt für Schritt, was sie tut.
  - id: schaltung
    titel: Digitale Schaltung
    view: schaltung
    beschreibung: Gatter verdrahten oder selbst setzen - die ganze Wahrheitstabelle zeigt, ob die Schaltung stimmt.
  - id: codes
    titel: Codes knacken
    view: codes
    beschreibung: Einen Knacker in Python schreiben - geprüft wird mit versteckten Nachrichten und anderen Schlüsseln.
  - id: takt
    titel: Schaltung mit Takt
    view: takt
    beschreibung: Flipflops und Gatter verdrahten - ein Zeitverlauf zeigt jeden Takt mit Soll und Ist.

# Spiele im Spielebereich. Ihre Levels sind Aufgaben des genannten
# Aufgabentyps, die Reihenfolge geben die Pfade vor. Levels zählen in
# Punkte, Serie und Tagesauftrag wie alle Aufgaben (docs/SPIELE.md).
spiele:
  - id: sql-krimi
    titel: SQL-Krimi
    icon: fa-user-secret
    beschreibung: "Ein Fall in Kapiteln. Jede Antwort steckt in einer Abfrage: Filter, Joins, Gruppen, Unterabfragen."
    aufgabentyp: sql_krimi
    pfade: [krimi-pokal]
    level_wort: Kapitel
  - id: roboter-parcours
    titel: Roboter-Parcours
    icon: fa-robot
    beschreibung: "Den Roboter mit Python durch das Raster steuern: Schleifen, Bedingungen und eigene Funktionen sehen."
    aufgabentyp: roboter
    pfade: [roboter-parcours]
  - id: ausgabe-sprint
    titel: Ausgabe-Sprint
    icon: fa-stopwatch
    beschreibung: "Zehn Schnipsel, 90 Sekunden: Ausgabe vorhersagen. Danach jede falsche Antwort mit Erklärung."
    aufgabentyp: ausgabe_sprint
    pfade: [ausgabe-sprint]
    levels_als: auswahl
  - id: muster-jagd
    titel: Muster-Jagd
    icon: fa-crosshairs
    beschreibung: "Reguläre Ausdrücke: alle Treffer fangen, keine Niete. Kürzere Muster bringen mehr Sterne."
    aufgabentyp: muster_jagd
    pfade: [muster-jagd]
  - id: ampelschule
    titel: Ampelschule
    icon: fa-traffic-light
    beschreibung: "Ampeln in Python steuern: vom Überweg bis zur großen Kreuzung. Nur wenn sie richtig schalten, gibt es keine Unfälle."
    aufgabentyp: ampel
    pfade: [ampelschule]
  - id: aufzugsteuerung
    titel: Aufzugsteuerung
    icon: fa-elevator
    beschreibung: "Aufzüge in Python steuern: von zwei Etagen bis zu zwei Kabinen im Bürohaus, mit Lichtschranke, Überlast und Feueralarm."
    aufgabentyp: aufzug
    pfade: [aufzugsteuerung]
  - id: turingmaschine
    titel: Turingmaschine
    icon: fa-tape
    beschreibung: "Rechnen mit Band, Kopf und Tabelle: Bits tauschen, plus eins, Klammern prüfen, Palindrome und Kopieren."
    aufgabentyp: turing
    pfade: [turingmaschine]
  - id: schaltungen
    titel: Digitale Schaltungen
    icon: fa-microchip
    beschreibung: "Mit UND, ODER und NICHT rechnen: vom Halbaddierer über Multiplexer und Dekoder bis zur 7-Segment-Anzeige."
    aufgabentyp: schaltung
    pfade: [schaltungen]
  - id: schaltungen-mit-takt
    titel: Schaltungen mit Takt
    icon: fa-clock
    beschreibung: "Flipflops merken sich ein Bit: vom Umschalter über Zähler und Lauflicht bis zur Ampel und zum Würfel auf der 7-Segment-Anzeige."
    aufgabentyp: takt
    pfade: [schaltungen-mit-takt]
  - id: codes-knacken
    titel: Codes knacken
    icon: fa-key
    beschreibung: "Geheime Nachrichten ohne Schlüssel lesen: Cäsar, Ersetzung, Vigenère, XOR, Schichten aus Base64 und Hex und eine PIN gegen ihren Prüfwert."
    aufgabentyp: codes
    pfade: [codes-knacken]

# Spielmechanik (docs/SPIELE.md). Stufe k gilt ab stufe_basis * k * k
# Punkten, alle titel_alle Stufen kommt der nächste Titel. Die Ränge der
# Meisterschaft sind Anteile der erreichbaren Punkte. Je schild_alle_tage
# Tage Serie gibt es einen Schutzschild, höchstens schilde_max. Ein ganz
# erledigter Tagesauftrag bringt auftrag_bonus Punkte. Ein schnellerer Lauf
# zählt als Bestwert ab bestwert_laufzeit_anteil der alten Laufzeit.
spiel:
  stufe_basis: 25
  titel: [Lehrling, Geselle, Schmied, Meister, Großmeister]
  titel_alle: 5
  raenge: {bronze: 0.25, silber: 0.5, gold: 0.8}
  schild_alle_tage: 7
  schilde_max: 3
  auftrag_bonus: 10
  kurs_abschnitt_punkte: 5
  bestwert_laufzeit_anteil: 0.8
