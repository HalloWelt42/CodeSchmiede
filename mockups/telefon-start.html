<!doctype html>
<html lang="de" data-geraet="telefon" data-bereich="dashboard">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entwurf Telefon: Dashboard</title>
<link rel="stylesheet" href="schriften.css">
<link rel="stylesheet" href="stil.css">
<script src="daten.js"></script>
<script src="hilfen.js"></script>
</head>
<body>
<template id="inhalt">
  <div class="seite">
    <header class="seiten-kopf">
      <div class="titelzeile"><h1>Willkommen zurück</h1></div>
      <span class="lead">Stufe 7, noch 316 Punkte bis Stufe 8</span>
    </header>
    <div class="rollfeld">
      <div class="karte" style="margin-bottom:var(--sp-2)">
        <div class="stufe">
          <div class="stufe-ring" style="--anteil:62;width:60px;height:60px"><b style="font-size:20px">7</b></div>
          <div class="stufe-text"><b>Geselle</b><span><span class="num">1.284</span> / <span class="num">1.600</span> Punkte</span><div class="balken" style="margin-top:4px"><span style="width:62%"></span></div></div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:var(--sp-2);font-size:var(--fs-sm)"><i class="fa-solid fa-fire flamme"></i><span class="num">12</span> Tage Serie<span style="margin-left:auto"><i class="fa-solid fa-shield-halved schild"></i> <i class="fa-solid fa-shield-halved schild"></i> <i class="fa-solid fa-shield-halved schild leer"></i></span></div>
      </div>
      <div class="karte" style="margin-bottom:var(--sp-2)">
        <span class="k-titel"><i class="fa-solid fa-bullseye"></i>Tagesauftrag <span class="num" style="margin-left:auto;color:var(--fg)">2 / 3</span></span>
        <div class="auftrag">
          <div class="auftrag-ziel erledigt"><i class="fa-solid fa-circle-check"></i><span>Eine Wiederholung lösen</span></div>
          <div class="auftrag-ziel erledigt"><i class="fa-solid fa-circle-check"></i><span>Ein Spiel-Level schaffen</span></div>
          <div class="auftrag-ziel"><i class="fa-regular fa-circle"></i><span>Eine Aufgabe ohne Hinweis bestehen</span></div>
        </div>
      </div>
      <div class="t-karten">
        <div class="karte"><i class="fa-solid fa-clock-rotate-left"></i><div style="min-width:0;flex:1"><span class="k-titel">Weitermachen</span><div class="k-wert">Erste n Elemente einer Liste</div><span class="k-unter">In Arbeit, 1 Versuch</span></div><i class="fa-solid fa-chevron-right mute" style="font-size:14px;width:auto"></i></div>
        <div class="karte"><i class="fa-solid fa-stopwatch"></i><div style="min-width:0;flex:1"><span class="k-titel">Schnelle Runde</span><div class="k-wert">Ausgabe-Sprint</div><span class="k-unter">90 Sekunden, Bestwert 9 / 10</span></div><i class="fa-solid fa-chevron-right mute" style="font-size:14px;width:auto"></i></div>
      </div>
      <div class="block">
        <div class="block-kopf"><span>Letzte 12 Wochen</span><span>2 aktive Tage</span></div>
        <div class="heat" id="heat"></div>
      </div>
    </div>
  </div>
</template>
<script>
  document.getElementById('inhalt').content.getElementById('heat').innerHTML =
    Array.from({ length: 12 * 7 }, (_, i) => `<span class="${i === 40 ? 'h2' : ''}"></span>`).join('');
</script>
<script src="gemeinsam.js"></script>
</body>
</html>
