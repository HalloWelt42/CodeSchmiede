<!doctype html>
<html lang="de" data-geraet="rechner" data-bereich="aufgaben">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entwurf Rechner: Aufgabe</title>
<link rel="stylesheet" href="schriften.css">
<link rel="stylesheet" href="stil.css">
<script src="daten.js"></script>
<script src="hilfen.js"></script>
</head>
<body>
<template id="inhalt">
  <div class="seite">
    <header class="a-kopf">
      <button class="ikon"><i class="fa-solid fa-arrow-left"></i></button>
      <span class="zelle-titel"><b>Nur gerade Zahlen behalten</b><span>238-gerade-filter</span></span>
      <div class="meta">
        <span class="badge st-anfaenger">Anfänger</span><span class="badge sprache">Python</span>
        <span><i class="fa-regular fa-clock"></i> 3 min</span>
        <span class="num" style="color:var(--accent)"><i class="fa-solid fa-coins"></i> 4 / 4</span>
      </div>
    </header>
    <div class="spalten">
      <section class="spalte">
        <div class="spalten-kopf">
          <span style="color:var(--accent)"><i class="fa-solid fa-file-lines"></i> Aufgabe</span>
          <span class="mute">|</span><span><i class="fa-solid fa-lightbulb"></i> Musterlösungen (2)</span>
        </div>
        <div class="rollfeld md">
          <p>Schreibe <code>nur_gerade(zahlen)</code>, die alle <b>geraden Zahlen</b> (<code>x % 2 == 0</code>) aus der Liste liefert, in der <b>ursprünglichen Reihenfolge</b>.</p>
          <p>Null zählt als gerade. Negative gerade Zahlen ebenso.</p>
          <h2>Beispiele</h2>
          <table><tr><th>Liste</th><th>Ergebnis</th></tr><tr><td><code>[1, 2, 3, 4, 5]</code></td><td><code>[2, 4]</code></td></tr><tr><td><code>[2, 4, 6]</code></td><td><code>[2, 4, 6]</code></td></tr><tr><td><code>[1, 3, 5]</code></td><td><code>[]</code></td></tr></table>
          <h2>Hints</h2>
          <p class="dim" style="font-family:var(--sans);font-size:var(--fs-sm)"><i class="fa-solid fa-lock-open"></i> Hint 1 (kostenlos) &nbsp; <i class="fa-solid fa-lock"></i> Hint 2 (kostet 2 Punkte)</p>
          <h2>Tests</h2>
          <p style="font-family:var(--sans);font-size:var(--fs-sm)">4 sichtbar, 6 versteckt</p>
        </div>
      </section>
      <div class="trenner"></div>
      <section class="spalte mitte">
        <div class="spalten-kopf"><span>Editor, Python</span><button class="knopf voll"><i class="fa-solid fa-play"></i>Prüfen</button></div>
        <div class="rollfeld" style="padding:0">
          <div class="editor">
            <div><span class="ln">1</span><span><span class="kw">def</span> nur_gerade(zahlen: list[int]) -&gt; list[int]:</span></div>
            <div><span class="ln">2</span><span>    <span class="kw">return</span> [x <span class="kw">for</span> x <span class="kw">in</span> zahlen <span class="kw">if</span> x % 2 == 0]</span></div>
            <div><span class="ln">3</span><span></span></div>
          </div>
        </div>
        <div class="probelauf"><span class="dim">nur_gerade(</span><input value="[1, 2, 3, 4]"><span class="dim">)</span><button class="knopf"><i class="fa-solid fa-play"></i>Lauf</button></div>
      </section>
      <div class="trenner"></div>
      <section class="spalte">
        <div class="spalten-kopf"><span>Ergebnis</span></div>
        <div class="rollfeld">
          <div class="belohnung">
            <div class="belohnung-kopf"><span class="plus">+4</span><span>von 4 Punkten, ohne Hinweis</span></div>
            <div class="zeile"><i class="fa-solid fa-hammer"></i>Stufe 7: <span class="num">1.288</span> / <span class="num">1.600</span></div>
            <div class="balken"><span style="width:62.3%"></span></div>
            <div class="zeile"><i class="fa-solid fa-compress"></i>Neuer Bestwert: <span class="num">62</span> Zeichen, vorher <span class="num">71</span></div>
            <div class="zeile"><span class="medaille silber"><i class="fa-solid fa-flag-checkered"></i></span>Erfolg: Fünfzig gelöst, Silber</div>
            <div class="zeile"><i class="fa-solid fa-bullseye"></i>Tagesauftrag erledigt, +10 Punkte</div>
          </div>
          <div class="ergebnis-kopf"><i class="fa-solid fa-circle-check"></i>Bestanden<span class="num">10 / 10</span></div>
          <div class="test-zeile"><i class="fa-solid fa-check ok"></i>[1, 2, 3, 4, 5] -&gt; [2, 4]</div>
          <div class="test-zeile"><i class="fa-solid fa-check ok"></i>[] -&gt; []</div>
          <div class="test-zeile"><i class="fa-solid fa-check ok"></i>[1, 3, 5] -&gt; []</div>
          <div class="test-zeile"><i class="fa-solid fa-check ok"></i>[2, 4, 6] -&gt; [2, 4, 6]</div>
          <div class="test-zeile"><i class="fa-solid fa-check ok"></i>6 versteckte Tests bestanden</div>
          <p class="dim" style="font-size:var(--fs-sm)">Laufzeit 41 ms, 62 Zeichen, erster Versuch</p>
          <button class="knopf primaer"><i class="fa-solid fa-forward"></i>Nächste Aufgabe</button>
          <div class="gruppe" style="margin-top:var(--sp-4)"><i class="fa-solid fa-chevron-right"></i>Verlauf (3)</div>
        </div>
      </section>
    </div>
  </div>
</template>
<script src="gemeinsam.js"></script>
</body>
</html>
