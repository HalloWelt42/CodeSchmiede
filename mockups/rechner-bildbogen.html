<!doctype html>
<html lang="de" data-geraet="rechner" data-bereich="verwaltung">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entwurf Rechner: Bildbogen</title>
<link rel="stylesheet" href="schriften.css">
<link rel="stylesheet" href="stil.css">
<link rel="stylesheet" href="kurs.css">
<script src="kurs.js"></script>
</head>
<body>
<template id="inhalt">
  <div class="seite">
    <header class="seiten-kopf">
      <div class="titelzeile">
        <h1>Bildbogen</h1>
        <span class="lead">Zeichnungen zur Abnahme: freigeben oder neu erzeugen, erst freigegebene erscheinen im Kurs</span>
        <div class="aktionen"><button class="knopf voll" id="uebernehmen"><i class="fa-solid fa-check-double"></i>Freigaben übernehmen</button></div>
      </div>
      <nav class="reiter">
        <button class="aktiv">Stilprobe <span class="num">12</span></button>
        <button>Python, Kapitel 1 bis 5 <span class="num">31</span></button>
        <button>Python, Kapitel 6 bis 9 <span class="num">26</span></button>
        <button>Bildkarten der Bereiche <span class="num">8</span></button>
      </nav>
      <div class="titelzeile" style="flex-wrap:wrap">
        <div class="kennzahlen">
          <div class="kennzahl"><span class="num" id="z-alle">12</span><small>Bilder</small></div>
          <div class="kennzahl"><span class="num" id="z-frei" style="color:var(--green)">0</span><small>freigegeben</small></div>
          <div class="kennzahl"><span class="num" id="z-neu" style="color:var(--orange)">0</span><small>neu erzeugen</small></div>
          <div class="kennzahl"><span class="num" id="z-offen">0</span><small>offen</small></div>
        </div>
        <div class="dienst-stand" style="margin-left:auto"><span class="lampe-klein"></span>Bildgenerator wartet: in der Leitstelle ist ein großes Modell geladen. Erzeugt wird erst, wenn dort alles entladen ist.</div>
      </div>
    </header>
    <div class="bogen-seite">
      <section class="spalte"><div class="rollfeld"><div class="bogen" id="bogen"></div></div></section>
      <section class="spalte"><div class="rollfeld" id="detail"></div></section>
    </div>
  </div>
</template>
<script src="gemeinsam.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  // Stilprobe: quer durch alle Arten und Sprachen
  const BILDER = [
    { art: 'Sinnbild', sprache: 'python', ort: 'Python 9, Abschnitt 3', motiv: 'Pinguine fahren auf einem Förderband an der Fischausgabe vorbei, der dritte bekommt gerade seinen Fisch', icon: null, stand: 'offen', startwert: 48211 },
    { art: 'Sinnbild', sprache: 'python', ort: 'Python 2, Abschnitt 1', motiv: 'Umzugskartons mit leeren Namensschildern, einer quillt über vor Punkten', icon: 'fa-box', stand: 'offen', startwert: 9135 },
    { art: 'Sinnbild', sprache: 'python', ort: 'Python 13, Abschnitt 1', motiv: 'Ein Schubladenschrank, jede Schublade mit einem Etikett, eine steht offen', icon: 'fa-book', stand: 'offen', startwert: 7720 },
    { art: 'Alltagsbeispiel', sprache: 'python', ort: 'Python 8, Abschnitt 1', motiv: 'Ein Hamster im Laufrad schaut auf einen Wecker, der gleich klingelt', icon: 'fa-rotate', stand: 'offen', startwert: 31008 },
    { art: 'Sinnbild', sprache: 'sql', ort: 'SQL 3, Abschnitt 1', motiv: 'Ein Sieb über einem Karteikasten, nur Karten mit Stern fallen hindurch', icon: 'fa-filter', stand: 'offen', startwert: 1204 },
    { art: 'Alltagsbeispiel', sprache: 'sql', ort: 'SQL 3, Abschnitt 4', motiv: 'Ein Pizzabäcker, der hinten anfängt: erst Teig, dann Belag, das Schild "groß" ganz zuletzt', icon: 'fa-pizza-slice', stand: 'offen', startwert: 66310 },
    { art: 'Sinnbild', sprache: 'javascript', ort: 'JavaScript 2, Abschnitt 2', motiv: 'Zwei Kartons: einer mit offenem Deckel, einer mit Vorhängeschloss', icon: 'fa-lock', stand: 'offen', startwert: 5002 },
    { art: 'Alltagsbeispiel', sprache: 'javascript', ort: 'JavaScript 3, Abschnitt 1', motiv: 'Zwei Waagen nebeneinander, eine streng mit Brille, eine großzügig mit Sonnenhut', icon: 'fa-scale-balanced', stand: 'offen', startwert: 18890 },
    { art: 'Sinnbild', sprache: 'css', ort: 'CSS 5, Abschnitt 2', motiv: 'Ein Foto im Bilderrahmen mit weißem Passepartout, mit Abstand an der Wand', icon: 'fa-image', stand: 'offen', startwert: 22471 },
    { art: 'Sinnbild', sprache: 'css', ort: 'CSS 1, Abschnitt 2', motiv: 'Russische Puppen, ineinander, jede mit einem Namensschild', icon: 'fa-code', stand: 'offen', startwert: 4096 },
    { art: 'Sammelkarte', sprache: 'python', ort: 'Python 7', motiv: 'Eine Weiche, der Zug mit Pinguinen biegt nach links ab', icon: 'fa-code-branch', stand: 'offen', startwert: 777 },
    { art: 'Bildkarte Bereich', sprache: 'sql', ort: 'Bereich Spiele, SQL-Krimi', motiv: 'Ein Detektiv-Pinguin mit Lupe über einem Aktenstapel', icon: 'fa-user-secret', stand: 'offen', startwert: 13 },
  ];
  // Im Entwurf schon ein paar Entscheidungen, damit alle Zustände sichtbar sind
  BILDER[0].stand = 'frei'; BILDER[2].stand = 'frei'; BILDER[4].stand = 'neu'; BILDER[9].stand = 'wartet';
  let gewaehlt = 0;

  const bild = (b, gross) => (b.icon ? `<i class="fa-solid ${b.icon}" style="${gross ? 'font-size:96px' : ''}"></i>` : pinguinBand());
  function zeichne() {
    $('bogen').innerHTML = BILDER.map((b, i) => `
      <div class="bogen-bild ${b.stand === 'frei' ? 'frei' : b.stand === 'neu' ? 'neu-erzeugen' : ''} ${i === gewaehlt ? 'gewaehlt' : ''}" data-sprache="${b.sprache}" onclick="waehle(${i})">
        <div class="bogen-flaeche">${bild(b)}<span class="badge art" style="color:var(--s-a);background:var(--bg)">${b.art}</span>
          ${b.stand === 'wartet' ? '<div class="wartet"><span><i class="fa-solid fa-hourglass-half"></i><br>wird neu erzeugt, sobald die Leitstelle frei ist</span></div>' : ''}</div>
        <div class="bogen-text"><b>${b.ort}</b><small>${b.motiv}</small></div>
        <div class="bogen-knoepfe">
          <button class="frei-k" onclick="event.stopPropagation();setze(${i},'frei')"><i class="fa-solid fa-check"></i>${b.stand === 'frei' ? 'Freigegeben' : 'Freigeben'}</button>
          <button class="neu-k" onclick="event.stopPropagation();setze(${i},'neu')"><i class="fa-solid fa-rotate"></i>Neu</button>
        </div>
      </div>`).join('');
    const z = (s) => BILDER.filter((b) => b.stand === s).length;
    $('z-frei').textContent = z('frei');
    $('z-neu').textContent = z('neu') + z('wartet');
    $('z-offen').textContent = z('offen');
    const b = BILDER[gewaehlt];
    $('detail').innerHTML = `
      <div data-sprache="${b.sprache}">
        <div class="bogen-flaeche" style="border:1px solid var(--border)">${bild(b, true)}</div>
        <div class="block"><div class="block-kopf"><span>Bildauftrag</span><span>${b.art}, ${b.ort}</span></div>
          <textarea class="auftrag-feld" spellcheck="false">${b.motiv}</textarea>
          <div class="werkbank-zeile" style="margin-top:6px"><span class="dim" style="font-size:var(--fs-xs)">Startwert <span class="num">${b.startwert}</span></span>
            <span class="rechts"><button class="knopf" onclick="setze(${gewaehlt},'neu')"><i class="fa-solid fa-rotate"></i>Neuer Startwert</button><button class="knopf voll" onclick="setze(${gewaehlt},'frei')"><i class="fa-solid fa-check"></i>Freigeben</button></span></div>
          <p class="dim" style="font-size:var(--fs-xs);margin:6px 0 0">Ein geänderter Auftrag wird in die Einführung zurückgeschrieben, dort steht er als einzige Wahrheit.</p>
        </div>
        <div class="block"><div class="block-kopf"><span>Stilvorgabe, gilt für jeden Auftrag</span></div>
          <div class="stilvorgabe">flache Zeichnung, klare dunkle Konturen, weiche Schatten,
freundliche runde Formen, leicht humorvoll,
freigestellt auf transparentem Grund,
keine Schrift, keine Zahlen, keine Logos,
Farben aus der Familie der Sprache</div>
        </div>
        <div class="block"><div class="block-kopf"><span>Farbfamilien</span><span>Vorschlag</span></div>
          <div class="farbfamilien">
            <span>Python</span><span class="f" style="background:var(--py-a)"></span><span class="f" style="background:var(--py-b)"></span><span class="f" style="background:var(--py-c)"></span>
            <span>SQL</span><span class="f" style="background:var(--sql-a)"></span><span class="f" style="background:var(--sql-b)"></span><span class="f" style="background:var(--sql-c)"></span>
            <span>JavaScript</span><span class="f" style="background:var(--js-a)"></span><span class="f" style="background:var(--js-b)"></span><span class="f" style="background:var(--js-c)"></span>
            <span>CSS</span><span class="f" style="background:var(--css-a)"></span><span class="f" style="background:var(--css-b)"></span><span class="f" style="background:var(--css-c)"></span>
          </div>
        </div>
        <p class="dim" style="font-size:var(--fs-sm);font-family:var(--quick)">Der Bogen läuft nur am Rechner mit dem Repo. "Freigaben übernehmen" legt die Bilder als WebP neben die Einführungen; danach Commit und Ausrollen. Die Stilprobe gilt erst, wenn alle zwölf freigegeben sind.</p>
      </div>`;
  }
  window.waehle = (i) => { gewaehlt = i; zeichne(); };
  window.setze = (i, s) => { BILDER[i].stand = s; zeichne(); };
  zeichne();
</script>
</body>
</html>
