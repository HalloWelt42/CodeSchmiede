<!doctype html>
<html lang="de" data-geraet="rechner" data-bereich="spiele">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entwurf Rechner: Turingmaschine</title>
<link rel="stylesheet" href="schriften.css">
<link rel="stylesheet" href="stil.css">
<style>
  .welt-spalte { padding: var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-2); }
  .tabelle-ue { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 13px; }
  .tabelle-ue th { text-align: left; font: 500 var(--fs-xs) var(--sans); text-transform: uppercase; letter-spacing: .05em; color: var(--fg-dim); padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .tabelle-ue td { padding: 4px 8px; border-bottom: 1px solid var(--border); }
  .tabelle-ue tr.aktiv td { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .wert { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 24px; padding: 0 6px; border: 1px solid var(--border); background: var(--bg-card-2); }
  .wert.zustand { color: var(--accent); }
  .zeile-dazu { margin: var(--sp-2) var(--sp-3); }
  .band { display: flex; justify-content: center; gap: 3px; padding: 26px 0 8px; position: relative; }
  .zelle-b { width: 34px; height: 40px; display: grid; place-items: center; border: 1px solid var(--border-strong); background: var(--bg-card-2); font: 700 20px var(--mono); transition: background .2s; }
  .zelle-b.leer { color: var(--fg-mute); font-weight: 400; }
  .zelle-b.geschrieben { background: color-mix(in srgb, var(--gold) 22%, var(--bg-card-2)); }
  .kopf-b { position: absolute; top: 0; width: 34px; text-align: center; color: var(--accent); transition: left .25s; }
  .kopf-b span { display: block; font: 600 11px var(--mono); }
  .diagramm { display: block; width: 100%; height: auto; border: 1px solid var(--border); background: var(--bg); }
  .diagramm .knoten { fill: var(--bg-card-2); stroke: var(--border-strong); stroke-width: 1.5; }
  .diagramm .knoten.aktiv { stroke: var(--accent); stroke-width: 3; }
  .diagramm .ende { fill: none; stroke: var(--border-strong); }
  .diagramm text { fill: var(--fg); font: 600 12px var(--mono); }
  .diagramm .kante { fill: none; stroke: var(--fg-mute); stroke-width: 1.4; marker-end: url(#pfeil); }
  .diagramm .kante.aktiv { stroke: var(--accent); stroke-width: 2.2; }
  .diagramm .beschrift { fill: var(--fg-dim); font: 500 11px var(--mono); }
  .spur { font-family: var(--mono); font-size: 12px; max-height: 120px; overflow-y: auto; border: 1px solid var(--border); background: var(--bg); padding: 6px 8px; }
  .spur div.aktiv { color: var(--accent); }
</style>
</head>
<body>
<template id="inhalt">
  <div class="seite">
    <header class="a-kopf">
      <button class="ikon"><i class="fa-solid fa-arrow-left"></i></button>
      <span class="zelle-titel"><b>Turing 1: Plus eins</b><span>Turingmaschine, Übergangstabelle</span></span>
      <div class="meta">
        <span class="badge" style="color:var(--green)">Anfänger</span>
        <span class="sterne gross"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-regular fa-star aus"></i></span>
        <span class="num" style="color:var(--accent)"><i class="fa-solid fa-coins"></i> 14 / 20</span>
      </div>
    </header>
    <div class="steuer-seite">
      <section class="spalte">
        <nav class="reiter-klein"><button class="aktiv">Aufgabe</button><button>Musterlösung</button><button>Verlauf</button></nav>
        <div class="rollfeld md">
          <p>Auf dem Band steht eine Binärzahl, der Kopf steht auf ihrer letzten Ziffer. Die Maschine soll die Zahl um eins erhöhen und dann im Zustand <code>fertig</code> anhalten.</p>
          <div class="modus"><button class="aktiv">Schritt für Schritt</button><button>Alles auf einmal</button></div>
          <h2>Teilschritte</h2>
          <div class="teilschritte">
            <div class="teilschritt erledigt"><i class="fa-solid fa-circle-check"></i><div><b>1. Aus 0 wird 1</b><small>Endet die Zahl auf 0: eine 1 schreiben und anhalten.</small></div></div>
            <div class="teilschritt erledigt"><i class="fa-solid fa-circle-check"></i><div><b>2. Überträge</b><small>Aus 1011 wird 1100: jede 1 am Ende wird 0, die erste 0 davor wird 1.</small></div></div>
            <div class="teilschritt aktuell"><i class="fa-solid fa-crosshairs"></i><div><b>3. Eine Stelle mehr</b><small>Aus 111 wird 1000: links vom Band ist leer (_), dort kommt die neue 1 hin.</small><div class="stand"><i class="fa-solid fa-triangle-exclamation"></i> 111 hält nach 3 Schritten in plus, ohne Regel für _</div></div></div>
            <div class="teilschritt zu"><i class="fa-solid fa-lock"></i><div><b>4. Alle Bänder</b><small>Die versteckten Bänder, auch ein einzelnes 0.</small></div></div>
          </div>
          <h2>Band und Befehle</h2>
          <div class="spickzettel">
            <code>0 1 _</code><span>Zeichen auf dem Band, _ ist leer</span>
            <code>L R N</code><span>Kopf nach links, rechts, bleibt stehen</span>
            <code>plus</code><span>Startzustand</span>
            <code>fertig</code><span>hier hält die Maschine an</span>
          </div>
          <h2>Sterne</h2>
          <div class="spickzettel" style="font-family:var(--sans)">
            <span class="sterne"><i class="fa-solid fa-star"></i></span><span>alle Bänder richtig, in höchstens 200 Schritten</span>
            <span class="sterne"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></span><span>höchstens 2 Zustände (ohne fertig)</span>
            <span class="sterne"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></span><span>dazu höchstens 3 Zeilen</span>
          </div>
        </div>
      </section>

      <section class="spalte mitte">
        <div class="spalten-kopf"><span class="kopf-titel">Übergangstabelle, 2 Zeilen</span><button class="knopf" style="margin-left:auto"><i class="fa-solid fa-play"></i>Ablauf</button><button class="knopf voll"><i class="fa-solid fa-check"></i>Prüfen</button></div>
        <div class="rollfeld" style="padding:0">
          <table class="tabelle-ue">
            <thead><tr><th>Zustand</th><th>liest</th><th>schreibt</th><th>geht</th><th>danach</th><th></th></tr></thead>
            <tbody data-tabelle></tbody>
          </table>
          <button class="knopf-klein zeile-dazu"><i class="fa-solid fa-plus"></i>Zeile</button>
          <div class="gruppe" style="margin:var(--sp-3) var(--sp-3) var(--sp-1)">Zustandsdiagramm</div>
          <div style="padding:0 var(--sp-3) var(--sp-3)"><svg class="diagramm" viewBox="0 0 420 170" role="img" aria-label="Zustandsdiagramm"></svg></div>
        </div>
      </section>

      <section class="spalte" id="welt">
        <div class="spalten-kopf"><span>Band</span><span class="num" data-zaehler style="margin-left:auto;color:var(--fg);text-transform:none;letter-spacing:0">Schritt 0</span></div>
        <div class="rollfeld welt-spalte">
          <div class="ablauf">
            <button class="knopf-klein" data-abspielen><i class="fa-solid fa-play"></i>Abspielen</button>
            <button class="knopf-klein" data-schritt><i class="fa-solid fa-forward-step"></i>Schritt</button>
            <button class="knopf-klein" data-vorn><i class="fa-solid fa-rotate-left"></i>Von vorn</button>
            <select class="wahl" data-band style="height:26px;margin-left:auto"><option value="1011">1011</option><option value="111">111</option><option value="0">0</option></select>
          </div>
          <div class="band" data-bandfeld></div>
          <div class="gruppe" style="margin:0">Spur</div>
          <div class="spur" data-spur></div>
          <div class="welten">
            <span class="chip ok"><i class="fa-solid fa-check"></i>1011 → 1100</span>
            <span class="chip nein"><i class="fa-solid fa-xmark"></i>111 → 1000</span>
            <span class="chip ok"><i class="fa-solid fa-check"></i>0 → 1</span>
            <span class="chip"><i class="fa-solid fa-lock"></i>4 versteckte</span>
          </div>
          <p class="dim" style="margin:0;font-size:var(--fs-sm)">Bei 111 läuft der Kopf über den Anfang der Zahl hinaus und liest _, für das es noch keine Zeile gibt. Die Maschine hält dann in <code>plus</code> statt in <code>fertig</code>.</p>
        </div>
      </section>
    </div>
  </div>
</template>
<script src="gemeinsam.js"></script>
<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const wurzel = document.getElementById('welt');
  // Die Tabelle in der Mitte: (Zustand, liest) -> (schreibt, geht, danach)
  const TABELLE = [
    ['plus', '1', '0', 'L', 'plus'],
    ['plus', '0', '1', 'N', 'fertig'],
  ];
  const tbody = document.querySelector('[data-tabelle]');
  tbody.innerHTML = TABELLE.map((z) => `<tr><td><span class="wert zustand">${z[0]}</span></td><td><span class="wert">${z[1]}</span></td><td><span class="wert">${z[2]}</span></td><td><span class="wert">${z[3]}</span></td><td><span class="wert zustand">${z[4]}</span></td><td><button class="ikon" title="Zeile löschen"><i class="fa-solid fa-xmark"></i></button></td></tr>`).join('');

  function rechne(band) {
    const zellen = new Map([...band].map((c, i) => [i, c]));
    let kopf = band.length - 1, zustand = 'plus';
    const schritte = [{ zellen: new Map(zellen), kopf, zustand, zeile: -1, geschrieben: null }];
    for (let n = 0; n < 50 && zustand !== 'fertig'; n++) {
      const liest = zellen.get(kopf) ?? '_';
      const zeile = TABELLE.findIndex((z) => z[0] === zustand && z[1] === liest);
      if (zeile < 0) break;
      const [, , schreibt, geht, danach] = TABELLE[zeile];
      zellen.set(kopf, schreibt);
      const geschrieben = kopf;
      kopf += geht === 'L' ? -1 : geht === 'R' ? 1 : 0;
      zustand = danach;
      schritte.push({ zellen: new Map(zellen), kopf, zustand, zeile, geschrieben, liest, schreibt, geht });
    }
    return schritte;
  }

  // Zustandsdiagramm: zwei Knoten, Schleife an plus, Pfeil nach fertig
  const svg = document.querySelector('.diagramm');
  const el = (name, attr, eltern = svg) => { const e = document.createElementNS(NS, name); for (const [k, v] of Object.entries(attr)) e.setAttribute(k, v); eltern.appendChild(e); return e; };
  const defs = el('defs', {});
  const m = el('marker', { id: 'pfeil', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, defs);
  el('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: 'currentColor' }, m).style.color = 'var(--fg-mute)';
  const kante = [
    el('path', { class: 'kante', d: 'M 118 70 C 90 10, 160 10, 132 70' }),
    el('path', { class: 'kante', d: 'M 157 95 L 268 95' }),
  ];
  el('text', { class: 'beschrift', x: 82, y: 22 }).textContent = '1 / 0, L';
  el('text', { class: 'beschrift', x: 178, y: 86 }).textContent = '0 / 1, N';
  el('text', { class: 'beschrift', x: 178, y: 116 }).textContent = '_ / ?';
  const knoten = { plus: el('circle', { class: 'knoten', cx: 125, cy: 95, r: 30 }), fertig: el('circle', { class: 'knoten', cx: 300, cy: 95, r: 30 }) };
  el('circle', { class: 'ende', cx: 300, cy: 95, r: 25 });
  el('text', { x: 125, y: 99, 'text-anchor': 'middle' }).textContent = 'plus';
  el('text', { x: 300, y: 99, 'text-anchor': 'middle' }).textContent = 'fertig';
  el('path', { class: 'kante', d: 'M 40 95 L 93 95' });

  let schritte = [], nr = 0, uhr = null;
  const feld = wurzel.querySelector('[data-bandfeld]');
  const spur = wurzel.querySelector('[data-spur]');
  function zeichne() {
    const s = schritte[nr];
    const von = Math.min(-2, ...s.zellen.keys(), s.kopf) , bis = Math.max(...s.zellen.keys(), s.kopf) + 2;
    feld.innerHTML = '';
    for (let i = von; i <= bis; i++) {
      const c = s.zellen.get(i) ?? '_';
      const d = document.createElement('div');
      d.className = `zelle-b${c === '_' ? ' leer' : ''}${i === s.geschrieben ? ' geschrieben' : ''}`;
      d.textContent = c;
      feld.appendChild(d);
    }
    const kopf = document.createElement('div');
    kopf.className = 'kopf-b';
    kopf.innerHTML = `<span>${s.zustand}</span><i class="fa-solid fa-caret-down"></i>`;
    const breite = (bis - von + 1) * 37 - 3;
    kopf.style.left = `calc(50% - ${breite / 2}px + ${(s.kopf - von) * 37}px)`;
    feld.appendChild(kopf);
    Object.entries(knoten).forEach(([k, c]) => c.classList.toggle('aktiv', k === s.zustand));
    kante.forEach((k, i) => k.classList.toggle('aktiv', i === s.zeile));
    tbody.querySelectorAll('tr').forEach((tr, i) => tr.classList.toggle('aktiv', i === s.zeile));
    spur.innerHTML = schritte.slice(1).map((x, i) => `<div class="${i + 1 === nr ? 'aktiv' : ''}">${i + 1}: liest ${x.liest}, schreibt ${x.schreibt}, geht ${x.geht}, jetzt ${x.zustand}</div>`).join('') || '<div class="dim">noch kein Schritt</div>';
    wurzel.querySelector('[data-zaehler]').textContent = `Schritt ${nr} von ${schritte.length - 1}${nr === schritte.length - 1 ? (s.zustand === 'fertig' ? ', fertig' : ', hält in ' + s.zustand) : ''}`;
  }
  function laden() { clearInterval(uhr); schritte = rechne(wurzel.querySelector('[data-band]').value); nr = 0; zeichne(); }
  wurzel.querySelector('[data-schritt]').addEventListener('click', () => { clearInterval(uhr); nr = Math.min(nr + 1, schritte.length - 1); zeichne(); });
  wurzel.querySelector('[data-vorn]').addEventListener('click', () => { clearInterval(uhr); nr = 0; zeichne(); });
  wurzel.querySelector('[data-abspielen]').addEventListener('click', () => { clearInterval(uhr); if (nr >= schritte.length - 1) nr = 0; uhr = setInterval(() => { nr++; zeichne(); if (nr >= schritte.length - 1) clearInterval(uhr); }, 700); });
  wurzel.querySelector('[data-band]').addEventListener('change', laden);
  laden();
})();
</script>
</body>
</html>
