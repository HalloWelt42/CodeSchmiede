<!doctype html>
<html lang="de" data-geraet="rechner" data-bereich="spiele">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entwurf Rechner: Codes knacken</title>
<link rel="stylesheet" href="schriften.css">
<link rel="stylesheet" href="stil.css">
<style>
  .welt-spalte { padding: var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-2); }
  .editor div.aktiv { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .geheim { font: 600 15px var(--mono); letter-spacing: .12em; line-height: 1.7; padding: var(--sp-2) var(--sp-3); border: 1px solid var(--border); background: var(--bg); overflow-wrap: anywhere; }
  .geheim.klar { color: var(--green); }
  .geheim .falsch { color: var(--fg-mute); }
  .regler { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-sm); }
  .regler input { flex: 1; accent-color: var(--accent); }
  .haeufigkeit { display: block; width: 100%; height: auto; }
  .haeufigkeit text { fill: var(--fg-dim); font: 600 9px var(--mono); }
  .haeufigkeit .text-balken { fill: var(--accent); }
  .haeufigkeit .deutsch { fill: none; stroke: var(--gold); stroke-width: 1.6; }
  .legende { display: flex; gap: var(--sp-3); font-size: var(--fs-xs); color: var(--fg-dim); }
  .legende span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }
  .legende .l-text::before { background: var(--accent); }
  .legende .l-deutsch::before { border: 2px solid var(--gold); width: 8px; height: 8px; }
  .stufen { display: flex; flex-wrap: wrap; gap: 4px; }
  .stufen .chip.jetzt { color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
<template id="inhalt">
  <div class="seite">
    <header class="a-kopf">
      <button class="ikon"><i class="fa-solid fa-arrow-left"></i></button>
      <span class="zelle-titel"><b>Code 1: Cäsar knacken</b><span>Codes knacken, Python</span></span>
      <div class="meta">
        <span class="badge" style="color:var(--green)">Anfänger</span>
        <span class="sterne gross"><i class="fa-solid fa-star"></i><i class="fa-regular fa-star aus"></i><i class="fa-regular fa-star aus"></i></span>
        <span class="num" style="color:var(--accent)"><i class="fa-solid fa-coins"></i> 7 / 20</span>
      </div>
    </header>
    <div class="steuer-seite">
      <section class="spalte">
        <nav class="reiter-klein"><button class="aktiv">Aufgabe</button><button>Musterlösung</button><button>Verlauf</button></nav>
        <div class="rollfeld md">
          <p>Julius Cäsar hat jeden Buchstaben seiner Briefe um ein paar Stellen im Alphabet verschoben. Aus A wird bei drei Stellen D, aus Z wird C. Wir haben abgefangene Nachrichten, aber nicht den Schlüssel.</p>
          <p>Schreib eine Funktion <code>knacke(geheim)</code>, die den Klartext zurückgibt. Rate nicht für einen Text: geprüft wird auch mit versteckten Nachrichten und anderen Verschiebungen.</p>
          <div class="modus"><button class="aktiv">Schritt für Schritt</button><button>Alles auf einmal</button></div>
          <h2>Teilschritte</h2>
          <div class="teilschritte">
            <div class="teilschritt erledigt"><i class="fa-solid fa-circle-check"></i><div><b>1. Zurückschieben</b><small>Mit bekanntem Schlüssel 3 entschlüsseln: <code>schiebe(text, -3)</code>.</small></div></div>
            <div class="teilschritt aktuell"><i class="fa-solid fa-crosshairs"></i><div><b>2. Alle 26 probieren</b><small>Jede Verschiebung ausprobieren und die nehmen, die am meisten nach Deutsch aussieht.</small><div class="stand"><i class="fa-solid fa-triangle-exclamation"></i> bei Nachricht 2 gewinnt Verschiebung 4 statt 11: zu wenige E im Vergleich?</div></div></div>
            <div class="teilschritt zu"><i class="fa-solid fa-lock"></i><div><b>3. Alle Nachrichten</b><small>Die versteckten Nachrichten, auch eine ganz kurze.</small></div></div>
          </div>
          <h2>Zur Hand</h2>
          <div class="spickzettel">
            <code>ord("A")</code><span>65: Buchstaben sind Zahlen</span>
            <code>chr(65)</code><span>"A": und zurück</span>
            <code>% 26</code><span>damit es hinter Z wieder bei A weitergeht</span>
            <code>DEUTSCH</code><span>Häufigkeit der Buchstaben im Deutschen, steht bereit</span>
          </div>
          <h2>Sterne</h2>
          <div class="spickzettel" style="font-family:var(--sans)">
            <span class="sterne"><i class="fa-solid fa-star"></i></span><span>alle Nachrichten richtig, auch die versteckten</span>
            <span class="sterne"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></span><span>alle zusammen in höchstens 50 ms</span>
            <span class="sterne"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></span><span>dazu höchstens 300 Zeichen Code</span>
          </div>
        </div>
      </section>

      <section class="spalte mitte">
        <div class="spalten-kopf"><span class="kopf-titel">Programm, 268 Zeichen</span><button class="knopf" style="margin-left:auto"><i class="fa-solid fa-key"></i>Ablauf</button><button class="knopf voll"><i class="fa-solid fa-play"></i>Prüfen</button></div>
        <div class="rollfeld" style="padding:0">
          <div class="editor">
            <div><span class="ln">1</span><span><span class="kw">def</span> schiebe(text, n):</span></div>
            <div><span class="ln">2</span><span>    raus = <span class="str">""</span></span></div>
            <div><span class="ln">3</span><span>    <span class="kw">for</span> c <span class="kw">in</span> text:</span></div>
            <div><span class="ln">4</span><span>        <span class="kw">if</span> c.isalpha():</span></div>
            <div><span class="ln">5</span><span>            c = chr((ord(c) - 65 + n) % 26 + 65)</span></div>
            <div><span class="ln">6</span><span>        raus += c</span></div>
            <div><span class="ln">7</span><span>    <span class="kw">return</span> raus</span></div>
            <div><span class="ln">8</span><span></span></div>
            <div class="aktiv"><span class="ln">9</span><span><span class="kw">def</span> deutsch(text):</span></div>
            <div><span class="ln">10</span><span>    <span class="kom"># passen die Buchstaben zum Deutschen?</span></span></div>
            <div><span class="ln">11</span><span>    <span class="kw">return</span> sum(DEUTSCH.get(c, 0) <span class="kw">for</span> c <span class="kw">in</span> text)</span></div>
            <div><span class="ln">12</span><span></span></div>
            <div><span class="ln">13</span><span><span class="kw">def</span> knacke(geheim):</span></div>
            <div><span class="ln">14</span><span>    versuche = [schiebe(geheim, -n) <span class="kw">for</span> n <span class="kw">in</span> range(26)]</span></div>
            <div><span class="ln">15</span><span>    <span class="kw">return</span> max(versuche, key=deutsch)</span></div>
          </div>
        </div>
      </section>

      <section class="spalte" id="welt">
        <div class="spalten-kopf"><span>Nachrichten</span></div>
        <div class="rollfeld welt-spalte">
          <div class="welten">
            <span class="chip ok gewaehlt"><i class="fa-solid fa-check"></i>Nachricht 1</span>
            <span class="chip nein"><i class="fa-solid fa-xmark"></i>Nachricht 2</span>
            <span class="chip"><i class="fa-solid fa-lock"></i>3 versteckte</span>
          </div>
          <div class="gruppe" style="margin:0">Abgefangen</div>
          <div class="geheim" data-geheim></div>
          <div class="gruppe" style="margin:0">Von Hand probieren</div>
          <div class="regler"><span>Verschiebung</span><input type="range" min="0" max="25" value="0" data-regler><span class="num" data-wert>0</span></div>
          <div class="geheim" data-klar></div>
          <div class="gruppe" style="margin:0">Häufigkeit der Buchstaben</div>
          <svg class="haeufigkeit" viewBox="0 0 470 110" role="img" aria-label="Häufigkeit der Buchstaben"></svg>
          <div class="legende"><span class="l-text">im verschobenen Text</span><span class="l-deutsch">im Deutschen</span></div>
          <p class="dim" style="margin:0;font-size:var(--fs-sm)">Der Regler ist nur zum Verstehen da: Passen die Balken zur goldenen Linie, ist die Verschiebung gefunden. Gewertet wird allein, was <code>knacke</code> zurückgibt.</p>
          <div class="gruppe" style="margin:0">Die Reihe</div>
          <div class="stufen">
            <span class="chip jetzt">1 Cäsar</span><span class="chip">2 Ersetzung und Häufigkeit</span><span class="chip">3 Vigenère</span>
            <span class="chip">4 XOR mit kurzem Schlüssel</span><span class="chip">5 Schichten (Base64, Hex)</span><span class="chip">6 PIN gegen Prüfwert</span>
          </div>
        </div>
      </section>
    </div>
  </div>
</template>
<script src="gemeinsam.js"></script>
<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const KLAR = 'TREFFPUNKT IST DER FISCHWAGEN AM HAFEN, GENAU UM ACHT UHR. BRINGT HERINGE MIT.';
  const SCHLUESSEL = 7;
  // Häufigkeit der Buchstaben in deutschen Texten (Prozent)
  const DEUTSCH = { A: 6.5, B: 1.9, C: 3.1, D: 5.1, E: 17.4, F: 1.7, G: 3.0, H: 4.8, I: 7.6, J: 0.3, K: 1.2, L: 3.4, M: 2.5, N: 9.8, O: 2.5, P: 0.8, Q: 0.02, R: 7.0, S: 7.3, T: 6.2, U: 4.4, V: 0.7, W: 1.9, X: 0.03, Y: 0.04, Z: 1.1 };
  const schiebe = (text, n) => [...text].map((c) => (/[A-Z]/.test(c) ? String.fromCharCode(((c.charCodeAt(0) - 65 + n + 26) % 26) + 65) : c)).join('');
  const geheim = schiebe(KLAR, SCHLUESSEL);
  document.querySelector('[data-geheim]').textContent = geheim;

  const svg = document.querySelector('.haeufigkeit');
  const el = (name, attr, eltern = svg) => { const e = document.createElementNS(NS, name); for (const [k, v] of Object.entries(attr)) e.setAttribute(k, v); eltern.appendChild(e); return e; };
  const BUCHSTABEN = Object.keys(DEUTSCH);
  const x = (i) => 8 + i * 17.6;
  const balken = BUCHSTABEN.map((b, i) => { el('text', { x: x(i) + 4, y: 106 }).textContent = b; return el('rect', { class: 'text-balken', x: x(i), width: 11, y: 96, height: 0 }); });
  el('polyline', { class: 'deutsch', points: BUCHSTABEN.map((b, i) => `${x(i) + 5.5},${96 - DEUTSCH[b] * 4.6}`).join(' ') });

  const klar = document.querySelector('[data-klar]');
  const wert = document.querySelector('[data-wert]');
  function zeige(n) {
    const versuch = schiebe(geheim, -n);
    klar.textContent = versuch;
    klar.classList.toggle('klar', n === SCHLUESSEL);
    wert.textContent = n;
    const zaehler = Object.fromEntries(BUCHSTABEN.map((b) => [b, 0]));
    const buchstaben = [...versuch].filter((c) => /[A-Z]/.test(c));
    buchstaben.forEach((c) => zaehler[c]++);
    BUCHSTABEN.forEach((b, i) => {
      const h = (zaehler[b] / buchstaben.length) * 100 * 4.6;
      balken[i].setAttribute('y', 96 - h);
      balken[i].setAttribute('height', h);
    });
  }
  const regler = document.querySelector('[data-regler]');
  regler.addEventListener('input', () => zeige(+regler.value));
  zeige(0);
})();
</script>
</body>
</html>
