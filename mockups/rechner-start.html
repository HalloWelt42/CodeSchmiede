<!doctype html>
<html lang="de" data-geraet="rechner" data-bereich="dashboard">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entwurf Rechner: Dashboard</title>
<link rel="stylesheet" href="schriften.css">
<link rel="stylesheet" href="stil.css">
<script src="daten.js"></script>
<script src="hilfen.js"></script>
</head>
<body>
<template id="inhalt">
  <div class="seite">
    <header class="seiten-kopf">
      <div class="titelzeile">
        <h1>Willkommen zurück</h1>
        <span class="lead">Stufe 7, noch 316 Punkte bis Stufe 8</span>
        <div class="aktionen">
          <button class="knopf primaer"><i class="fa-solid fa-play"></i>Weitermachen: Erste n Elemente</button>
          <button class="knopf"><i class="fa-solid fa-rotate"></i>2 Wiederholungen fällig</button>
        </div>
      </div>
    </header>
    <div class="rollfeld">
      <div class="karten">
        <div class="karte">
          <span class="k-titel"><i class="fa-solid fa-hammer"></i>Stufe</span>
          <div class="stufe">
            <div class="stufe-ring" style="--anteil:62"><b>7</b><small>Stufe</small></div>
            <div class="stufe-text"><b>Geselle</b><span><span class="num">1.284</span> von <span class="num">1.600</span> Punkten bis Stufe 8</span><div class="balken" style="margin-top:4px"><span style="width:62%"></span></div><span>Stufe 10 macht dich zum Schmied</span></div>
          </div>
        </div>
        <div class="karte">
          <span class="k-titel"><i class="fa-solid fa-fire"></i>Serie</span>
          <span class="k-wert"><span class="num">12</span> Tage</span>
          <span class="k-unter">Bestmarke 19 Tage. Heute schon geübt.</span>
          <span class="k-unter" style="display:flex;align-items:center;gap:6px"><i class="fa-solid fa-shield-halved schild"></i><i class="fa-solid fa-shield-halved schild"></i><i class="fa-solid fa-shield-halved schild leer"></i> 2 Schutzschilde, der dritte in 2 Tagen</span>
        </div>
        <div class="karte">
          <span class="k-titel"><i class="fa-solid fa-bullseye"></i>Tagesauftrag <span class="num" style="margin-left:auto;color:var(--fg)">2 / 3</span></span>
          <div class="auftrag">
            <div class="auftrag-ziel erledigt"><i class="fa-solid fa-circle-check"></i><span>Eine Wiederholung lösen</span></div>
            <div class="auftrag-ziel erledigt"><i class="fa-solid fa-circle-check"></i><span>Ein Spiel-Level schaffen</span></div>
            <div class="auftrag-ziel"><i class="fa-regular fa-circle"></i><span>Eine Aufgabe ohne Hinweis bestehen</span></div>
          </div>
          <span class="k-cta">Alle drei: +10 Punkte <i class="fa-solid fa-arrow-right"></i></span>
        </div>
      </div>

      <div class="zwei">
        <div class="block">
          <div class="block-kopf"><span>Meisterschaft</span><span>Anteil der erreichbaren Punkte</span></div>
          <div class="meister">
            <span class="medaille bronze"><i class="fa-solid fa-medal"></i></span><span>Python</span><span class="balken"><span style="width:31%"></span></span><span class="num">31 %</span>
            <span class="medaille keine"><i class="fa-solid fa-medal"></i></span><span>JavaScript</span><span class="balken"><span style="width:12%"></span></span><span class="num">12 %</span>
            <span class="medaille silber"><i class="fa-solid fa-medal"></i></span><span>SQL</span><span class="balken"><span style="width:54%"></span></span><span class="num">54 %</span>
            <span class="medaille keine"><i class="fa-solid fa-medal"></i></span><span>CSS</span><span class="balken"><span style="width:8%"></span></span><span class="num">8 %</span>
            <span class="medaille bronze"><i class="fa-solid fa-medal"></i></span><span>Spiele</span><span class="balken"><span style="width:28%"></span></span><span class="num">28 %</span>
          </div>
          <p class="dim" style="font-size:var(--fs-xs);margin:var(--sp-2) 0 0">Bronze ab 25 %, Silber ab 50 %, Gold ab 80 %</p>
        </div>
        <div class="block">
          <div class="block-kopf"><span>Erfolge</span><span><span class="num">7 / 24</span> <a href="rechner-erfolge.html" style="margin-left:6px">alle</a></span></div>
          <div class="erfolg da"><span class="medaille silber"><i class="fa-solid fa-flag-checkered"></i></span>Fünfzig gelöst<span class="dim num">Silber</span></div>
          <div class="erfolg da"><span class="medaille gold"><i class="fa-solid fa-database"></i></span>Fall gelöst: Der Wasserturm<span class="dim num">Gold</span></div>
          <div class="erfolg da"><span class="medaille bronze"><i class="fa-solid fa-fire"></i></span>Eine Woche am Stück<span class="dim num">Bronze</span></div>
          <div class="erfolg"><span class="medaille keine"><i class="fa-solid fa-crop-simple"></i></span>Volle Deckung in CSS<span class="dim num">0 / 1</span></div>
          <div class="erfolg"><span class="medaille keine"><i class="fa-solid fa-robot"></i></span>Roboter in drei Zeilen<span class="dim num">0 / 1</span></div>
        </div>
      </div>

      <div class="block">
        <div class="block-kopf"><span>Aktivität 2026</span><span>41 aktive Tage, 96 / 133 bestanden</span></div>
        <div class="heat" id="heat"></div>
      </div>
    </div>
  </div>
</template>
<script>
  const h = document.getElementById('inhalt').content.getElementById('heat');
  h.innerHTML = Array.from({ length: 43 * 7 }, (_, i) => `<span class="${i > 240 && i % 3 ? 'h2' : i > 200 && i % 4 === 0 ? 'h1' : ''}"></span>`).join('');
</script>
<script src="gemeinsam.js"></script>
</body>
</html>
