<!doctype html>
<html lang="de" data-geraet="rechner" data-bereich="dashboard">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entwurf Rechner: Dashboard</title>
<link rel="stylesheet" href="schriften.css">
<link rel="stylesheet" href="stil.css">
<script src="daten.js"></script>
<script src="hilfen.js"></script>
</head>
<body>
<template id="inhalt">
  <div class="seite">
    <header class="seiten-kopf">
      <div class="titelzeile">
        <h1>Willkommen zurück</h1>
        <span class="lead">1 von 3 Submissions bestanden</span>
      </div>
    </header>
    <div class="rollfeld">
      <div class="karten">
        <div class="karte"><span class="k-titel"><i class="fa-solid fa-bullseye"></i>Tagesziel</span><span class="k-wert">1 fällig</span><span class="k-unter">Heute ist 1 Wiederholung fällig: Zwei Werte tauschen</span><span class="k-cta">Wiederholen <i class="fa-solid fa-arrow-right"></i></span></div>
        <div class="karte"><span class="k-titel"><i class="fa-solid fa-clock-rotate-left"></i>Letzte Aufgabe</span><span class="k-wert">Erste n Elemente einer Liste</span><span class="k-unter">In Arbeit, 1 Versuch</span><span class="k-cta">Weitermachen <i class="fa-solid fa-arrow-right"></i></span></div>
        <div class="karte"><span class="k-titel"><i class="fa-solid fa-fire"></i>Streak</span><span class="k-wert">1 Tag</span><span class="k-unter">Persönliche Bestmarke</span><span class="k-cta">Heute weiter <i class="fa-solid fa-arrow-right"></i></span></div>
      </div>
      <div class="block">
        <div class="block-kopf"><span>Gesamtfortschritt</span><span class="num">1 / 644 gelöst</span></div>
        <div class="balken"><span style="width: .4%"></span></div>
        <div class="chips">
          <span class="chip gruen"><i class="fa-solid fa-check"></i>1 gelöst</span>
          <span class="chip orange"><i class="fa-solid fa-pen"></i>1 in Arbeit</span>
          <span class="chip"><i class="fa-regular fa-circle"></i>642 neu</span>
          <span class="chip akz"><i class="fa-solid fa-coins"></i>4 / 9212 Punkte</span>
        </div>
      </div>
      <div class="zwei">
        <div class="block">
          <div class="block-kopf"><span>Aktivität 2026</span><span>2 aktive Tage, 1 / 3 bestanden</span></div>
          <div class="heat" id="heat"></div>
        </div>
        <div class="block">
          <div class="block-kopf"><span>Erfolge</span><span class="num">1 / 10</span></div>
          <div class="erfolg da"><i class="fa-solid fa-flag-checkered"></i>Erste Aufgabe<span class="dim num">1 / 1</span></div>
          <div class="erfolg"><i class="fa-solid fa-fire"></i>Aufgewärmt<span class="dim num">1 / 10</span></div>
          <div class="erfolg"><i class="fa-solid fa-medal"></i>Halbprofi<span class="dim num">1 / 50</span></div>
          <div class="erfolg"><i class="fa-solid fa-bolt"></i>Drei am Stück<span class="dim num">1 / 3</span></div>
          <div class="erfolg"><i class="fa-solid fa-calendar-week"></i>Eine Woche<span class="dim num">1 / 7</span></div>
          <div class="erfolg"><i class="fa-solid fa-trophy"></i>Marathon<span class="dim num">1 / 30</span></div>
        </div>
      </div>
    </div>
  </div>
</template>
<script>
  const h = document.getElementById('inhalt').content.getElementById('heat');
  h.innerHTML = Array.from({ length: 53 * 7 }, (_, i) => `<span class="${i === 160 ? 'h2' : i === 112 ? 'h1' : ''}"></span>`).join('');
</script>
<script src="gemeinsam.js"></script>
</body>
</html>
