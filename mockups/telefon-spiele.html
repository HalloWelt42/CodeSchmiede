<!doctype html>
<html lang="de" data-geraet="telefon" data-bereich="spiele">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entwurf Telefon: Spiele</title>
<link rel="stylesheet" href="schriften.css">
<link rel="stylesheet" href="stil.css">
</head>
<body>
<template id="inhalt">
  <div class="seite">
    <header class="seiten-kopf">
      <div class="titelzeile"><h1>Spiele</h1><span class="treffer" style="margin-left:auto"><span class="sterne"><i class="fa-solid fa-star"></i></span> <span class="num">21 / 96</span></span></div>
    </header>
    <div class="rollfeld t-liste">
      <a class="t-eintrag" href="telefon-sprint.html" style="text-decoration:none">
        <i class="fa-solid fa-stopwatch" style="color:var(--accent);font-size:20px"></i>
        <div style="min-width:0"><b>Ausgabe-Sprint</b><div class="unter"><span>10 Schnipsel, 90 Sekunden</span><span>Bestwert <span class="num">9 / 10</span></span></div></div>
        <i class="fa-solid fa-chevron-right"></i>
      </a>
      <div class="t-eintrag">
        <i class="fa-solid fa-crosshairs" style="color:var(--accent);font-size:20px"></i>
        <div style="min-width:0"><b>Muster-Jagd</b><div class="unter"><span class="num">2 / 12</span><span class="balken" style="flex:1;min-width:60px"><span style="width:16%"></span></span><span class="sterne"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star aus"></i><i class="fa-solid fa-star aus"></i></span></div></div>
        <i class="fa-solid fa-chevron-right"></i>
      </div>
      <div class="t-eintrag">
        <i class="fa-solid fa-user-secret" style="color:var(--accent);font-size:20px"></i>
        <div style="min-width:0"><b>SQL-Krimi</b><div class="unter"><span class="num">3 / 8</span><span class="balken" style="flex:1;min-width:60px"><span style="width:37%"></span></span><span class="sterne"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star aus"></i></span></div></div>
        <i class="fa-solid fa-chevron-right"></i>
      </div>
      <div class="t-eintrag">
        <i class="fa-solid fa-robot" style="color:var(--accent);font-size:20px"></i>
        <div style="min-width:0"><b>Roboter-Parcours</b><div class="unter"><span class="num">4 / 10</span><span class="balken" style="flex:1;min-width:60px"><span style="width:40%"></span></span><span class="sterne"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></span></div></div>
        <i class="fa-solid fa-chevron-right"></i>
      </div>
      <div class="gruppe" style="margin:var(--sp-3) 0 0">Steuerungen</div>
      <a class="t-eintrag" href="telefon-ampel.html" style="text-decoration:none">
        <i class="fa-solid fa-traffic-light" style="color:var(--accent);font-size:20px"></i>
        <div style="min-width:0"><b>Ampelschule</b><div class="unter"><span class="num">1 / 8</span><span class="balken" style="flex:1;min-width:60px"><span style="width:12%"></span></span><span class="sterne"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star aus"></i><i class="fa-solid fa-star aus"></i></span></div></div>
        <i class="fa-solid fa-chevron-right"></i>
      </a>
      <div class="t-eintrag">
        <i class="fa-solid fa-elevator" style="color:var(--accent);font-size:20px"></i>
        <div style="min-width:0"><b>Aufzugsteuerung</b><div class="unter"><span class="num">1 / 7</span><span class="balken" style="flex:1;min-width:60px"><span style="width:14%"></span></span><span class="sterne"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star aus"></i><i class="fa-solid fa-star aus"></i></span></div></div>
        <i class="fa-solid fa-chevron-right"></i>
      </div>
    </div>
  </div>
</template>
<script src="gemeinsam.js"></script>
</body>
</html>
