server {
  listen 8201;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API-Proxy an den Backend-Service (im Compose-Netz "backend")
  location /api/ {
    proxy_pass http://backend:8200/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # SPA-Fallback: alles, was kein File ist, liefert die index.html aus
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Statische Assets aggressiv cachen
  location ~* \.(js|css|woff2?|ttf|otf|svg|png|jpg|gif|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
