# JavaScript-Kurs: Kapitel in Reihenfolge, je Kapitel Einführung, Übungen (verblassend, je Übung eine neue Sache) und
# das Stück des Kapitelprojekts Fischwagen. Ein Kapitel steht hier erst, wenn es fertig ist (Inbetriebnahme
# kapitelweise). Beispiele und Übungen laufen in Node, ohne Webseite; ausgegeben wird in die Konsole.
sprache: javascript
titel: JavaScript
bloecke:
  - titel: Erste Schritte
    kapitel:
      - einfuehrung: js-ausgabe
        uebungen: [j011-hallo-welt, j012-moin, j013-pinguin-sagt, j014-zahlen, j015-drei-namen, j016-schild, j017-auskommentieren]
        projekt: [j019-fischwagen-kopf]
      - einfuehrung: js-variablen
        uebungen: [j021-erster-name, j022-tagesangebot, j023-mittags, j024-schild-repariert, j025-steckbrief-kurz, j026-dreimal, j027-tauschen]
        projekt: [j029-fischwagen-namen]
      - einfuehrung: js-rechnen
        uebungen: [j031-plus, j032-broetchenpreis, j033-durchschnitt, j034-gerecht-teilen, j035-eisscholle, j036-tagesbilanz, j037-kartons]
        projekt: [j039-fischwagen-summe]
      - einfuehrung: js-text
        uebungen: [j041-zusammenkleben, j042-vorlage, j043-wie-lang, j044-erster-letzter, j045-ausschnitt, j046-schreihals, j047-umtaufen]
        projekt: [j049-fischwagen-vorlagen]
      - einfuehrung: js-umwandeln
        uebungen: [j051-begruessung, j052-doppelt, j053-naechstes-jahr, j054-was-ist-das, j055-gewicht, j056-kommapreis, j057-ohne-antwort]
        projekt: [j059-fischwagen-eingabe]
