# JavaScript-Kurs: Kapitel in Reihenfolge, je Kapitel Einführung, Übungen (verblassend, je Übung eine neue Sache) und
# das Stück des Kapitelprojekts Fischwagen. Ein Kapitel steht hier erst, wenn es fertig ist (Inbetriebnahme
# kapitelweise). Beispiele und Übungen laufen in Node, ohne Webseite; ausgegeben wird in die Konsole.
