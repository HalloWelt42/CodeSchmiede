        projekt: [q089-steckbrief-kopfzeile]
      - einfuehrung: sql-gruppen
        uebungen: [q091-je-fisch, q092-je-tag, q093-mahlzeiten, q094-gewicht-je-kolonie, q095-beliebte-fische, q096-schwerste-je-kolonie, q097-stammgaeste]
        projekt: [q099-steckbrief-je-kolonie]
