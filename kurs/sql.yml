# SQL-Kurs: Kapitel in Reihenfolge, je Kapitel Einführung, Übungen (verblassend, je Übung eine neue Sache) und das
# Stück des Kapitelprojekts. Alle Beispiele und Übungen laufen auf dem Datensatz pinguinzoo. Ein Kapitel steht hier erst,
# wenn es fertig ist (Inbetriebnahme kapitelweise).
sprache: sql
titel: SQL
bloecke:
  - titel: Erste Abfragen
    kapitel:
      - einfuehrung: sql-select
        uebungen: [q011-alle-kolonien, q012-namen, q013-geburtsjahre, q014-futterliste, q015-umgedreht, q016-pfleger, q017-vertippt]
        projekt: [q019-steckbrief-start]
      - einfuehrung: sql-rechnen
        uebungen: [q021-in-gramm, q022-umbenennen, q023-wie-alt, q024-fischgewicht, q025-fahrenheit, q026-gerecht-teilen, q027-namensschild]
        projekt: [q029-steckbrief-alter]
      - einfuehrung: sql-where
        uebungen: [q031-suedkolonie, q032-die-juengeren, q033-ostkolonie, q034-eiskalt, q035-grosse-portionen, q036-kein-hering, q037-die-aelteren]
        projekt: [q039-steckbrief-norden]
  - titel: Genauer filtern
    kapitel:
      - einfuehrung: sql-logik
        uebungen: [q041-heringe-im-norden, q042-alt-oder-schwer, q043-hering-am-21, q044-pfleger-nord-ost, q045-mittlere-portionen, q046-sued-und-ost, q047-die-leichten]
        projekt: [q049-steckbrief-nord-ost]
      - einfuehrung: sql-texte
