# Python-Kurs: Kapitel in Reihenfolge, je Kapitel Einführung, Übungen (verblassend, je Übung eine neue Sache) und
# das Stück des Kapitelprojekts. Ein Kapitel steht hier erst, wenn es fertig ist (Inbetriebnahme kapitelweise).
sprache: python
titel: Python
bloecke:
