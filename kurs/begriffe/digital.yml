# Begriffskatalog Digitaltechnik. Jede Einführung nennt unter fuehrt_ein die Begriffe, die sie erklärt. Formeln und
# Schaltpläne werden (noch) nicht auf Vorgriffe untersucht: es gibt keine Erkennung, die Begriffe stehen für
# Lernziele, Merkblatt und Kursübersicht.

sprache: digital
begriffe:
