# Begriffskatalog CSS: woran die Prüfung erkennt, dass CSS oder Markup einen Baustein benutzt.
#
# Jede Einführung nennt unter fuehrt_ein die Begriffe, die sie erklärt. Benutzt Code in einem Kapitel einen Begriff,
# den weder dieses noch ein früheres Kapitel einführt, meldet die Prüfung einen Vorgriff.
# Erkennung im CSS (tinycss2): knoten (Selektorarten typ, klasse, id, universal, attribut, nachfahre, kind, gruppe,
# nachbar, geschwister; Pseudoklassen wie :first-child und Pseudoelemente wie ::before mit Namen; at-Regeln wie
# @media; regel, kommentar, eigene_eigenschaft), eigenschaften (color, margin ...), werte (Schlüsselwörter als
# eigenschaft:wert, etwa display:flex, oder *:wert für jede Eigenschaft, etwa *:inherit), aufrufe (Funktionen wie rgb,
# calc, var), literale (Einheiten px, em, %, dazu hex, zahl und text). Im Markup (beginnt mit <): elemente und
# attribute; Elemente im Selektor zählen auch als elemente.

sprache: css
begriffe:
  # Kapitel 1: HTML lesen und die erste Regel
  - id: html_text
    titel: Überschriften, Absätze und Betonung (h1, h2, p, strong, em)
    erkennung: {elemente: [h1, h2, h3, p, strong, em, br]}
  - id: html_gruppe
    titel: Kästen ohne eigene Bedeutung (div, span)
    erkennung: {elemente: [div, span]}
  - id: html_liste
    titel: Listen (ul, ol, li)
    erkennung: {elemente: [ul, ol, li]}
  - id: regel
    titel: Regel aus Selektor und Angaben
    erkennung: {knoten: [regel]}
  - id: typ_selektor
    titel: Elemente nach ihrem Namen wählen
    erkennung: {knoten: [typ]}
  - id: color
    titel: Schriftfarbe mit color
    erkennung: {eigenschaften: [color]}
  - id: background_color
    titel: Hintergrundfarbe mit background-color
    erkennung: {eigenschaften: [background-color]}
  - id: kommentar
    titel: Kommentare mit /* */ und <!-- -->
    erkennung: {knoten: [kommentar]}
  # Kapitel 2: Klassen und ids
  - id: klasse
    titel: Klassen mit class und dem Punkt
    erkennung: {attribute: [class], knoten: [klasse]}
  - id: id
    titel: Eine id und die Raute
    erkennung: {attribute: [id], knoten: [id]}
  # Kapitel 3: Selektoren kombinieren
  - id: nachfahre
    titel: Nachfahren mit dem Leerzeichen
    erkennung: {knoten: [nachfahre]}
  - id: kind
    titel: Direkte Kinder mit >
    erkennung: {knoten: [kind]}
  - id: gruppe
    titel: Mehrere Selektoren mit Komma
    erkennung: {knoten: [gruppe]}
  - id: universal
    titel: Der Stern trifft alles
    erkennung: {knoten: [universal]}
  # Kapitel 4: Kaskade und Vererbung
  - id: kaskade
    titel: Bei Gleichstand gewinnt die spätere Regel
  - id: spezifitaet
    titel: Die genauere Regel gewinnt (id, Klasse, Element)
  - id: vererbung
    titel: Vererbung und inherit
    erkennung: {werte: ["*:inherit"]}
  # Kapitel 5: Farben
  - id: rgb
    titel: Farben mischen mit rgb
    erkennung: {aufrufe: [rgb]}
  - id: hex
    titel: Farben in Hex-Schreibweise
    erkennung: {literale: [hex]}
  - id: transparenz
    titel: Durchscheinen mit Alphawert und opacity
    erkennung: {eigenschaften: [opacity], aufrufe: [rgba]}
  # Kapitel 6: Text und Schrift
  - id: px
    titel: Pixel als Einheit
    erkennung: {literale: [px]}
  - id: schriftgroesse
    titel: Schriftgröße mit font-size
    erkennung: {eigenschaften: [font-size]}
  - id: schriftschnitt
    titel: Fett und schräg mit font-weight und font-style
    erkennung: {eigenschaften: [font-weight, font-style]}
  - id: schriftart
    titel: Schriftart mit font-family
    erkennung: {eigenschaften: [font-family]}
  - id: textausrichtung
    titel: Text ausrichten mit text-align
    erkennung: {eigenschaften: [text-align]}
  - id: textschmuck
    titel: Großbuchstaben und Linien mit text-transform und text-decoration
    erkennung: {eigenschaften: [text-transform, text-decoration]}
  - id: textabstand
    titel: Zeilenhöhe und Buchstabenabstand
    erkennung: {eigenschaften: [line-height, letter-spacing]}
  # Kapitel 7: Das Kastenmodell
  - id: breite_hoehe
    titel: Breite und Höhe mit width und height
    erkennung: {eigenschaften: [width, height]}
  - id: padding
    titel: Innenabstand mit padding
    erkennung: {eigenschaften: [padding, padding-top, padding-right, padding-bottom, padding-left]}
  - id: border
    titel: Rand mit border
    erkennung: {eigenschaften: [border, border-width, border-style, border-color]}
  - id: margin
    titel: Außenabstand mit margin
    erkennung: {eigenschaften: [margin, margin-top, margin-right, margin-bottom, margin-left]}
  - id: box_sizing
    titel: box-sizing
    erkennung: {eigenschaften: [box-sizing]}
