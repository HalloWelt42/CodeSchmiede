# Begriffskatalog CSS: woran die Prüfung erkennt, dass CSS oder Markup einen Baustein benutzt.
#
# Jede Einführung nennt unter fuehrt_ein die Begriffe, die sie erklärt. Benutzt Code in einem Kapitel einen Begriff,
# den weder dieses noch ein früheres Kapitel einführt, meldet die Prüfung einen Vorgriff.
# Erkennung im CSS (tinycss2): knoten (Selektorarten typ, klasse, id, universal, attribut, nachfahre, kind, gruppe,
# nachbar, geschwister; Pseudoklassen wie :first-child und Pseudoelemente wie ::before mit Namen; at-Regeln wie
# @media; regel, kommentar, eigene_eigenschaft), eigenschaften (color, margin ...), werte (Schlüsselwörter als
# eigenschaft:wert, etwa display:flex, oder *:wert für jede Eigenschaft, etwa *:inherit), aufrufe (Funktionen wie rgb,
# calc, var), literale (Einheiten px, em, %, dazu hex, zahl und text). Im Markup (beginnt mit <): elemente und
# attribute; Elemente im Selektor zählen auch als elemente.

sprache: css
begriffe:
  # Kapitel 1: HTML lesen und die erste Regel
  - id: html_text
    titel: Überschriften, Absätze und Betonung (h1, h2, p, strong, em)
    erkennung: {elemente: [h1, h2, h3, p, strong, em, br]}
  - id: html_gruppe
    titel: Kästen ohne eigene Bedeutung (div, span)
    erkennung: {elemente: [div, span]}
  - id: html_liste
    titel: Listen (ul, ol, li)
    erkennung: {elemente: [ul, ol, li]}
  - id: regel
    titel: Regel aus Selektor und Angaben
    erkennung: {knoten: [regel]}
  - id: typ_selektor
    titel: Elemente nach ihrem Namen wählen
    erkennung: {knoten: [typ]}
  - id: color
    titel: Schriftfarbe mit color
    erkennung: {eigenschaften: [color]}
  - id: background_color
    titel: Hintergrundfarbe mit background-color
    erkennung: {eigenschaften: [background-color]}
  - id: kommentar
    titel: Kommentare mit /* */ und <!-- -->
    erkennung: {knoten: [kommentar]}
  # Kapitel 2: Klassen und ids
  - id: klasse
    titel: Klassen mit class und dem Punkt
    erkennung: {attribute: [class], knoten: [klasse]}
  - id: id
    titel: Eine id und die Raute
    erkennung: {attribute: [id], knoten: [id]}
  # Kapitel 3: Selektoren kombinieren
  - id: nachfahre
    titel: Nachfahren mit dem Leerzeichen
    erkennung: {knoten: [nachfahre]}
  - id: kind
    titel: Direkte Kinder mit >
    erkennung: {knoten: [kind]}
  - id: gruppe
    titel: Mehrere Selektoren mit Komma
    erkennung: {knoten: [gruppe]}
  - id: universal
    titel: Der Stern trifft alles
    erkennung: {knoten: [universal]}
  # Kapitel 4: Kaskade und Vererbung
  - id: kaskade
    titel: Bei Gleichstand gewinnt die spätere Regel
  - id: spezifitaet
    titel: Die genauere Regel gewinnt (id, Klasse, Element)
  - id: vererbung
    titel: Vererbung und inherit
    erkennung: {werte: ["*:inherit"]}
  # Kapitel 5: Farben
  - id: rgb
    titel: Farben mischen mit rgb
    erkennung: {aufrufe: [rgb]}
  - id: hex
    titel: Farben in Hex-Schreibweise
    erkennung: {literale: [hex]}
  - id: transparenz
    titel: Durchscheinen mit Alphawert und opacity
    erkennung: {eigenschaften: [opacity], aufrufe: [rgba]}
  # Kapitel 6: Text und Schrift
  - id: px
    titel: Pixel als Einheit
    erkennung: {literale: [px]}
  - id: schriftgroesse
    titel: Schriftgröße mit font-size
    erkennung: {eigenschaften: [font-size]}
  - id: schriftschnitt
    titel: Fett und schräg mit font-weight und font-style
    erkennung: {eigenschaften: [font-weight, font-style]}
  - id: schriftart
    titel: Schriftart mit font-family
    erkennung: {eigenschaften: [font-family]}
  - id: textausrichtung
    titel: Text ausrichten mit text-align
    erkennung: {eigenschaften: [text-align]}
  - id: textschmuck
    titel: Großbuchstaben und Linien mit text-transform und text-decoration
    erkennung: {eigenschaften: [text-transform, text-decoration]}
  - id: textabstand
    titel: Zeilenhöhe und Buchstabenabstand
    erkennung: {eigenschaften: [line-height, letter-spacing]}
  # Kapitel 7: Das Kastenmodell
  - id: breite_hoehe
    titel: Breite und Höhe mit width und height
    erkennung: {eigenschaften: [width, height]}
  - id: padding
    titel: Innenabstand mit padding
    erkennung: {eigenschaften: [padding, padding-top, padding-right, padding-bottom, padding-left]}
  - id: border
    titel: Rand mit border
    erkennung: {eigenschaften: [border, border-width, border-style, border-color]}
  - id: margin
    titel: Außenabstand mit margin
    erkennung: {eigenschaften: [margin, margin-top, margin-right, margin-bottom, margin-left]}
  - id: box_sizing
    titel: box-sizing
    erkennung: {eigenschaften: [box-sizing]}
  # Kapitel 8: Ränder und Ecken
  - id: rahmenart
    titel: Gestrichelte, gepunktete und doppelte Ränder
    erkennung: {werte: ["*:dashed", "*:dotted", "*:double"]}
  - id: rahmenseite
    titel: Ränder an einzelnen Seiten
    erkennung: {eigenschaften: [border-top, border-right, border-bottom, border-left]}
  - id: ecken
    titel: Runde Ecken mit border-radius
    erkennung: {eigenschaften: [border-radius, border-top-left-radius, border-top-right-radius, border-bottom-right-radius, border-bottom-left-radius]}
  - id: outline
    titel: Umrisse mit outline
    erkennung: {eigenschaften: [outline, outline-offset]}
  # Kapitel 9: Einheiten
  - id: em
    titel: em, relativ zur Schrift
    erkennung: {literale: [em]}
  - id: rem
    titel: rem, relativ zur Schrift der Seite
    erkennung: {literale: [rem]}
  - id: prozent
    titel: Prozent vom Elternelement
    erkennung: {literale: ["%"]}
  - id: vw_vh
    titel: vw und vh, relativ zum Fenster
    erkennung: {literale: [vw, vh]}
  - id: min_max
    titel: Grenzen mit min-width und max-width
    erkennung: {eigenschaften: [min-width, max-width, min-height, max-height]}
  # Kapitel 10: Schatten und Verläufe
  - id: box_shadow
    titel: Schatten mit box-shadow
    erkennung: {eigenschaften: [box-shadow]}
  - id: text_shadow
    titel: Schatten unter Text mit text-shadow
    erkennung: {eigenschaften: [text-shadow]}
  - id: verlauf
    titel: Farbverläufe als Hintergrund
    erkennung: {aufrufe: [linear-gradient, radial-gradient], eigenschaften: [background, background-image]}
  # Kapitel 11: display
  - id: display_block
    titel: display block
    erkennung: {werte: ["display:block"]}
  - id: display_inline
    titel: display inline
    erkennung: {werte: ["display:inline"]}
  - id: display_inline_block
    titel: display inline-block
    erkennung: {werte: ["display:inline-block"]}
  - id: display_none
    titel: display none
    erkennung: {werte: ["display:none"]}
  # Kapitel 12: Flexbox
  - id: flex
    titel: Flex-Behälter mit display flex
    erkennung: {werte: ["display:flex", "display:inline-flex"]}
  - id: flex_richtung
    titel: Richtung mit flex-direction
    erkennung: {eigenschaften: [flex-direction]}
  - id: gap
    titel: Lücken mit gap
    erkennung: {eigenschaften: [gap, row-gap, column-gap]}
  - id: flex_wrap
    titel: Umbrechen mit flex-wrap
    erkennung: {eigenschaften: [flex-wrap, flex-flow]}
  # Kapitel 13: Flexbox ausrichten
  - id: justify_content
    titel: Verteilen mit justify-content
    erkennung: {eigenschaften: [justify-content]}
  - id: align_items
    titel: Ausrichten mit align-items und align-self
    erkennung: {eigenschaften: [align-items, align-self]}
  - id: flex_grow
    titel: Wachsen mit flex-grow
    erkennung: {eigenschaften: [flex-grow, flex, flex-basis, flex-shrink]}
  # Kapitel 14: Grid
  - id: grid
    titel: Raster mit display grid
    erkennung: {werte: ["display:grid", "display:inline-grid"]}
  - id: grid_spuren
    titel: Spalten und Zeilen mit grid-template-columns und grid-template-rows
    erkennung: {eigenschaften: [grid-template-columns, grid-template-rows]}
  - id: fr
    titel: Anteile mit fr
    erkennung: {literale: [fr]}
  - id: repeat
    titel: repeat und minmax
    erkennung: {aufrufe: [repeat, minmax]}
  # Kapitel 15: Grid-Bereiche
  - id: spannen
    titel: Spannen und platzieren mit grid-column und grid-row
    erkennung: {eigenschaften: [grid-column, grid-row, grid-column-start, grid-column-end, grid-row-start, grid-row-end]}
  - id: bereiche
    titel: Bereiche mit grid-template-areas und grid-area
    erkennung: {eigenschaften: [grid-template-areas, grid-area]}
  # Kapitel 16: Positionieren
  - id: position_relative
    titel: position relative
    erkennung: {werte: ["position:relative"]}
  - id: position_absolute
    titel: position absolute
    erkennung: {werte: ["position:absolute", "position:fixed"]}
  - id: versatz
    titel: Lage mit top, right, bottom, left und inset
    erkennung: {eigenschaften: [top, right, bottom, left, inset]}
  - id: z_index
    titel: Stapelreihenfolge mit z-index
    erkennung: {eigenschaften: [z-index]}
  # Kapitel 17: Pseudoklassen
  - id: erstes_letztes
    titel: Das erste und letzte Kind
    erkennung: {knoten: [":first-child", ":last-child", ":first-of-type", ":last-of-type"]}
  - id: nth_child
    titel: Abzählen mit nth-child
    erkennung: {knoten: [":nth-child", ":nth-of-type"]}
  - id: not
    titel: Ausschließen mit not
    erkennung: {knoten: [":not"]}
  - id: zustand
    titel: Zustände wie hover und focus
    erkennung: {knoten: [":hover", ":focus"]}
  # Kapitel 18: Pseudoelemente
  - id: before_after
    titel: Einfügen mit ::before, ::after und content
    erkennung: {knoten: ["::before", "::after"], eigenschaften: [content]}
  - id: first_letter
    titel: Erster Buchstabe und erste Zeile
    erkennung: {knoten: ["::first-letter", "::first-line"]}
  - id: marker
    titel: Listenpunkte mit ::marker
    erkennung: {knoten: ["::marker"]}
  # Kapitel 19: Variablen und calc
  - id: variablen
    titel: Eigene Eigenschaften mit var() und :root
    erkennung: {knoten: [eigene_eigenschaft, ":root"], aufrufe: [var]}
  - id: calc
    titel: Rechnen mit calc
    erkennung: {aufrufe: [calc, min, max, clamp]}
  # Kapitel 20: Verwandeln
  - id: transform
    titel: Verwandeln mit transform, translate, rotate und scale
    erkennung: {eigenschaften: [transform, translate, rotate, scale], aufrufe: [translate, translatex, translatey, rotate, scale, scalex, scaley]}
  - id: grad
    titel: Winkel in Grad (deg)
    erkennung: {literale: [deg, turn]}
  - id: transform_origin
    titel: Der Drehpunkt mit transform-origin
    erkennung: {eigenschaften: [transform-origin]}
  - id: transition
    titel: Sanfte Wechsel mit transition
    erkennung: {eigenschaften: [transition, transition-property, transition-duration, transition-timing-function, transition-delay]}
  # Kapitel 21: Media Queries
  - id: media_query
    titel: Regeln mit Bedingung durch @media
    erkennung: {knoten: ["@media"]}
