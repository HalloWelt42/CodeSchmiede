<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin mit gelbem Bauhelm steht vor einem Bauplan aus farbigen Feldern: ein breites Feld oben, ein hohes links, zwei kleine rechts und eines leer">
