<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin dreht an einem großen Farbrad, und drei Schilder am Fischwagen leuchten alle in derselben Farbe, die das Rad zeigt">
  <ellipse cx="130" cy="170" rx="118" ry="6" fill="rgba(0,0,0,.12)"/>
  <!-- Farbrad -->
  <g transform="translate(170 64)">
    <path d="M0 0 L0 -40 A40 40 0 0 1 34.6 -20 Z" fill="#f87171"/>
    <path d="M0 0 L34.6 -20 A40 40 0 0 1 34.6 20 Z" fill="#fbbf24"/>
    <path d="M0 0 L34.6 20 A40 40 0 0 1 0 40 Z" fill="#4ade80"/>
    <path d="M0 0 L0 40 A40 40 0 0 1 -34.6 20 Z" fill="#38bdf8"/>
    <path d="M0 0 L-34.6 20 A40 40 0 0 1 -34.6 -20 Z" fill="#818cf8"/>
    <path d="M0 0 L-34.6 -20 A40 40 0 0 1 0 -40 Z" fill="#f472b6"/>
    <circle r="40" fill="none" stroke="#2b3442" stroke-width="2"/>
    <circle r="7" fill="#2b3442"/>
    <path d="M0 0 L0 -36" stroke="#2b3442" stroke-width="4" stroke-linecap="round" transform="rotate(200)"/>
  </g>
  <!-- drei Schilder in derselben Farbe -->
  <g stroke="#2b3442" stroke-width="1.6">
    <rect x="16" y="24" width="70" height="26" rx="4" fill="#38bdf8"/>
    <rect x="16" y="62" width="90" height="26" rx="4" fill="#38bdf8"/>
    <rect x="16" y="100" width="56" height="26" rx="4" fill="#38bdf8"/>
  </g>
  <!-- Leitungen vom Rad zu den Schildern -->
  <g fill="none" stroke="#2b3442" stroke-width="1.4" stroke-dasharray="4 3">
    <path d="M130 64 Q110 40 88 37 M130 64 H108 M130 64 Q110 100 74 113"/>
  </g>
  <!-- Pinguin dreht -->
  <g transform="translate(222 132)">
    <ellipse cx="0" cy="10" rx="19" ry="27" fill="#2b3442"/>
    <ellipse cx="0" cy="14" rx="12.5" ry="19" fill="#f4f1ea"/>
    <circle cx="0" cy="-24" r="14" fill="#2b3442"/>
    <circle cx="-5" cy="-26" r="3.4" fill="#fff"/><circle cx="5" cy="-26" r="3.4" fill="#fff"/>
    <circle cx="-6" cy="-25" r="1.7" fill="#111"/><circle cx="4" cy="-25" r="1.7" fill="#111"/>
    <path d="M-12 -20 l-9 3 l9 3 Z" fill="#f2a13b"/>
    <path d="M-8 30 h-7 M8 30 h7" stroke="#f2a13b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-17 -2 q-10 -18 -30 -32" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
