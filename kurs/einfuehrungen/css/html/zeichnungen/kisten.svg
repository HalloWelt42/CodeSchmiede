<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin klebt farbige Etiketten vorn und hinten an ineinandergestellte Holzkisten">
  <ellipse cx="130" cy="170" rx="118" ry="6" fill="rgba(0,0,0,.12)"/>
  <!-- große Kiste, offen nach vorn -->
  <rect x="16" y="40" width="170" height="122" rx="3" fill="#d9a066" stroke="#2b3442" stroke-width="2.2"/>
  <rect x="26" y="50" width="150" height="102" fill="#f3d7a8" stroke="#2b3442" stroke-width="1.4"/>
  <g stroke="#b9824c" stroke-width="1.4"><path d="M26 84 h150 M26 118 h150"/></g>
  <!-- Etiketten der großen Kiste: vorn und hinten -->
  <rect x="6" y="28" width="22" height="16" rx="2" fill="#4fd1a5" stroke="#2b3442" stroke-width="1.6" transform="rotate(-8 17 36)"/>
  <rect x="174" y="28" width="22" height="16" rx="2" fill="#4fd1a5" stroke="#2b3442" stroke-width="1.6" transform="rotate(8 185 36)"/>
  <!-- mittlere Kiste links -->
  <rect x="36" y="88" width="70" height="56" rx="2" fill="#c98c55" stroke="#2b3442" stroke-width="1.8"/>
  <rect x="42" y="94" width="58" height="44" fill="#ecc993" stroke="#2b3442" stroke-width="1.2"/>
  <rect x="30" y="80" width="14" height="11" rx="1.5" fill="#ec6aa8" stroke="#2b3442" stroke-width="1.4"/>
  <rect x="98" y="80" width="14" height="11" rx="1.5" fill="#ec6aa8" stroke="#2b3442" stroke-width="1.4"/>
  <!-- kleine Kiste in der mittleren -->
  <rect x="54" y="110" width="34" height="26" rx="2" fill="#b77a45" stroke="#2b3442" stroke-width="1.6"/>
  <rect x="50" y="104" width="9" height="8" rx="1" fill="#38bdf8" stroke="#2b3442" stroke-width="1.2"/>
  <rect x="83" y="104" width="9" height="8" rx="1" fill="#38bdf8" stroke="#2b3442" stroke-width="1.2"/>
  <!-- Fische in der kleinen Kiste -->
  <g fill="#9fb4c8" stroke="#2b3442" stroke-width="1"><path d="M60 124 q6 -6 14 0 q-8 6 -14 0 Z M74 124 l5 -4 v8 Z"/></g>
  <!-- zweite mittlere Kiste rechts -->
  <rect x="116" y="102" width="52" height="42" rx="2" fill="#c98c55" stroke="#2b3442" stroke-width="1.8"/>
  <rect x="121" y="107" width="42" height="32" fill="#ecc993" stroke="#2b3442" stroke-width="1.2"/>
  <rect x="110" y="94" width="14" height="11" rx="1.5" fill="#f2c94c" stroke="#2b3442" stroke-width="1.4"/>
  <rect x="160" y="94" width="14" height="11" rx="1.5" fill="#f2c94c" stroke="#2b3442" stroke-width="1.4"/>
  <g fill="#e8f2fa" stroke="#2b3442" stroke-width="1"><rect x="128" y="118" width="12" height="12" rx="2"/><rect x="144" y="118" width="12" height="12" rx="2"/></g>
  <!-- Pinsel und Leimtopf -->
  <rect x="196" y="146" width="18" height="16" rx="2" fill="#e8f2fa" stroke="#2b3442" stroke-width="1.6"/>
  <g transform="rotate(-30 206 120)">
    <rect x="203" y="96" width="6" height="34" rx="2" fill="#f2a13b" stroke="#2b3442" stroke-width="1.4"/>
    <path d="M202 94 h8 l-1 -10 h-6 Z" fill="#fbf4e2" stroke="#2b3442" stroke-width="1.4"/>
  </g>
  <!-- Pinguin -->
  <g transform="translate(228 124)">
    <ellipse cx="0" cy="10" rx="19" ry="27" fill="#2b3442"/>
    <ellipse cx="0" cy="14" rx="12.5" ry="19" fill="#f4f1ea"/>
    <circle cx="0" cy="-24" r="14" fill="#2b3442"/>
    <circle cx="-5" cy="-26" r="3.4" fill="#fff"/><circle cx="5" cy="-26" r="3.4" fill="#fff"/>
    <circle cx="-6" cy="-25" r="1.7" fill="#111"/><circle cx="4" cy="-25" r="1.7" fill="#111"/>
    <path d="M-12 -20 l-9 3 l9 3 Z" fill="#f2a13b"/>
    <path d="M-8 37 h-7 M8 37 h7" stroke="#f2a13b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-17 -2 q-8 -10 -18 -12" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
