<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vier kleine Pinguine stehen in einer ordentlichen Reihe mit gleichen Lücken in einem Rahmen, ein großer Pinguin zeigt mit der Flosse darauf">
  <ellipse cx="130" cy="170" rx="118" ry="6" fill="rgba(0,0,0,.12)"/>
  <defs>
    <g id="kueken">
      <ellipse cx="0" cy="6" rx="12" ry="17" fill="#2b3442"/>
      <ellipse cx="0" cy="9" rx="8" ry="12" fill="#f4f1ea"/>
      <circle cx="0" cy="-15" r="9" fill="#2b3442"/>
      <circle cx="-3" cy="-16" r="2.4" fill="#fff"/><circle cx="3" cy="-16" r="2.4" fill="#fff"/>
      <circle cx="-3" cy="-15.5" r="1.2" fill="#111"/><circle cx="3" cy="-15.5" r="1.2" fill="#111"/>
      <path d="M-2.5 -11 l2.5 4 l2.5 -4 Z" fill="#f2a13b"/>
      <path d="M-5 23 h-4 M5 23 h4" stroke="#f2a13b" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </defs>
  <!-- Rahmen als Behälter -->
  <rect x="14" y="70" width="168" height="72" rx="4" fill="#e3f1f8" stroke="#ec6aa8" stroke-width="2.4" stroke-dasharray="6 4"/>
  <!-- Lücken angedeutet -->
  <g fill="#4fd1a5" opacity=".6">
    <rect x="47" y="84" width="10" height="48"/><rect x="89" y="84" width="10" height="48"/><rect x="131" y="84" width="10" height="48"/>
  </g>
  <use href="#kueken" x="34" y="110"/>
  <use href="#kueken" x="76" y="110"/>
  <use href="#kueken" x="118" y="110"/>
  <use href="#kueken" x="160" y="110"/>
  <!-- großer Pinguin zeigt -->
  <g transform="translate(222 124)">
    <ellipse cx="0" cy="10" rx="19" ry="27" fill="#2b3442"/>
    <ellipse cx="0" cy="14" rx="12.5" ry="19" fill="#f4f1ea"/>
    <circle cx="0" cy="-24" r="14" fill="#2b3442"/>
    <circle cx="-5" cy="-26" r="3.4" fill="#fff"/><circle cx="5" cy="-26" r="3.4" fill="#fff"/>
    <circle cx="-6" cy="-25" r="1.7" fill="#111"/><circle cx="4" cy="-25" r="1.7" fill="#111"/>
    <path d="M-12 -20 l-9 3 l9 3 Z" fill="#f2a13b"/>
    <path d="M-8 37 h-7 M8 37 h7" stroke="#f2a13b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-17 -2 q-12 -8 -24 -10" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Pfeil der Reihe -->
  <path d="M30 56 h140" stroke="#2b3442" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M170 50 l10 6 l-10 6 Z" fill="#2b3442"/>
</svg>
