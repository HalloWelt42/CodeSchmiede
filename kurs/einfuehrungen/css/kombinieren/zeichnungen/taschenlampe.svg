<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin leuchtet mit einer Taschenlampe in eine große blaue Kiste, darin eine kleinere Schachtel, und in beiden liegen Heringe">
  <ellipse cx="130" cy="170" rx="118" ry="6" fill="rgba(0,0,0,.12)"/>
  <!-- Lichtkegel -->
  <path d="M196 92 L84 52 L84 160 Z" fill="#fff6c2" opacity=".55"/>
  <!-- blaue Kiste, offen -->
  <rect x="14" y="64" width="138" height="98" rx="3" fill="#38bdf8" stroke="#2b3442" stroke-width="2.2"/>
  <rect x="24" y="74" width="118" height="78" fill="#bfe8fb" stroke="#2b3442" stroke-width="1.4"/>
  <!-- Heringe direkt in der Kiste -->
  <g fill="#9fb4c8" stroke="#2b3442" stroke-width="1.2">
    <path d="M32 140 q12 -10 26 0 q-14 10 -26 0 Z M58 140 l8 -6 v12 Z"/>
    <path d="M36 118 q12 -10 26 0 q-14 10 -26 0 Z M62 118 l8 -6 v12 Z"/>
  </g>
  <!-- kleinere Schachtel in der Kiste -->
  <rect x="84" y="104" width="50" height="42" rx="2" fill="#f2c94c" stroke="#2b3442" stroke-width="1.8"/>
  <rect x="90" y="110" width="38" height="30" fill="#fbe9a8" stroke="#2b3442" stroke-width="1.2"/>
  <!-- Hering in der Schachtel -->
  <g fill="#9fb4c8" stroke="#2b3442" stroke-width="1.2"><path d="M96 126 q10 -8 20 0 q-10 8 -20 0 Z M116 126 l6 -5 v10 Z"/></g>
  <!-- Glitzern auf den Fischen -->
  <g fill="#fff"><circle cx="40" cy="138" r="1.6"/><circle cx="44" cy="116" r="1.6"/><circle cx="102" cy="124" r="1.4"/></g>
  <!-- Pinguin mit Taschenlampe -->
  <g transform="translate(222 124)">
    <ellipse cx="0" cy="10" rx="19" ry="27" fill="#2b3442"/>
    <ellipse cx="0" cy="14" rx="12.5" ry="19" fill="#f4f1ea"/>
    <circle cx="0" cy="-24" r="14" fill="#2b3442"/>
    <circle cx="-5" cy="-26" r="3.4" fill="#fff"/><circle cx="5" cy="-26" r="3.4" fill="#fff"/>
    <circle cx="-6" cy="-25" r="1.7" fill="#111"/><circle cx="4" cy="-25" r="1.7" fill="#111"/>
    <path d="M-12 -20 l-9 3 l9 3 Z" fill="#f2a13b"/>
    <path d="M-8 37 h-7 M8 37 h7" stroke="#f2a13b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-17 -2 q-6 -18 -14 -28" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Taschenlampe -->
  <g transform="rotate(-20 196 92)">
    <rect x="190" y="86" width="24" height="12" rx="3" fill="#e2574c" stroke="#2b3442" stroke-width="1.6"/>
    <path d="M190 84 l-8 -3 v18 l8 -3 Z" fill="#a7afba" stroke="#2b3442" stroke-width="1.4"/>
  </g>
</svg>
