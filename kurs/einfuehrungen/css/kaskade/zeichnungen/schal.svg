<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein großer Pinguin legt einem Küken einen gestreiften Schal um, der gleiche Schal hängt auch um seinen eigenen Hals">
  <ellipse cx="130" cy="170" rx="118" ry="6" fill="rgba(0,0,0,.12)"/>
  <!-- großer Pinguin -->
  <g transform="translate(92 104)">
    <ellipse cx="0" cy="18" rx="30" ry="44" fill="#2b3442"/>
    <ellipse cx="0" cy="24" rx="20" ry="31" fill="#f4f1ea"/>
    <circle cx="0" cy="-34" r="21" fill="#2b3442"/>
    <circle cx="-7" cy="-37" r="4.6" fill="#fff"/><circle cx="7" cy="-37" r="4.6" fill="#fff"/>
    <circle cx="-6" cy="-36" r="2.3" fill="#111"/><circle cx="8" cy="-36" r="2.3" fill="#111"/>
    <path d="M-5 -27 l5 9 l5 -9 Z" fill="#f2a13b"/>
    <path d="M-12 62 h-9 M12 62 h9" stroke="#f2a13b" stroke-width="4.5" stroke-linecap="round"/>
    <!-- eigener Schal -->
    <path d="M-20 -16 q20 10 40 0 l0 9 q-20 10 -40 0 Z" fill="#ec6aa8" stroke="#2b3442" stroke-width="1.6"/>
    <g stroke="#fbcfe8" stroke-width="3"><path d="M-12 -12 v8 M-2 -10 v8 M8 -11 v8"/></g>
    <!-- Flügel reicht zum Küken -->
    <path d="M28 4 q22 -6 40 6" fill="none" stroke="#2b3442" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- Küken -->
  <g transform="translate(184 128)">
    <ellipse cx="0" cy="10" rx="17" ry="22" fill="#9aa3ae"/>
    <ellipse cx="0" cy="14" rx="11" ry="15" fill="#e9edf1"/>
    <circle cx="0" cy="-17" r="13" fill="#9aa3ae"/>
    <circle cx="-4.5" cy="-19" r="3.4" fill="#fff"/><circle cx="4.5" cy="-19" r="3.4" fill="#fff"/>
    <circle cx="-4" cy="-18" r="1.8" fill="#111"/><circle cx="5" cy="-18" r="1.8" fill="#111"/>
    <path d="M-3 -12 l3 6 l3 -6 Z" fill="#f2a13b"/>
    <path d="M-6 32 h-6 M6 32 h6" stroke="#f2a13b" stroke-width="3" stroke-linecap="round"/>
    <!-- geerbter Schal mit langem Ende -->
    <path d="M-13 -5 q13 8 26 0 l0 8 q-13 8 -26 0 Z" fill="#ec6aa8" stroke="#2b3442" stroke-width="1.5"/>
    <path d="M7 2 l6 20 l-8 2 l-4 -18 Z" fill="#ec6aa8" stroke="#2b3442" stroke-width="1.5"/>
    <g stroke="#fbcfe8" stroke-width="2.6"><path d="M-7 -2 v7 M1 -1 v7 M8 12 l-6 1.5"/></g>
  </g>
  <!-- kleine Herzen -->
  <g fill="#ec6aa8" opacity=".75">
    <path d="M150 52 c-3 -5 -10 -2 -7 4 l7 7 l7 -7 c3 -6 -4 -9 -7 -4 Z"/>
    <path d="M206 72 c-2 -3.5 -7 -1.5 -5 3 l5 5 l5 -5 c2 -4.5 -3 -6.5 -5 -3 Z"/>
  </g>
</svg>
