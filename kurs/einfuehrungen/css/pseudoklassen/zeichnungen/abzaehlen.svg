<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin zählt eine Reihe von sechs Fischen ab und tippt mit einem Pinsel jeden zweiten an, der dadurch golden wird">
  <ellipse cx="130" cy="170" rx="118" ry="6" fill="rgba(0,0,0,.12)"/>
  <!-- Tresen -->
  <rect x="8" y="112" width="190" height="10" rx="2" fill="#c98c55" stroke="#2b3442" stroke-width="1.6"/>
  <!-- sechs Fische, jeder zweite golden -->
  <g stroke="#2b3442" stroke-width="1.2">
    <path d="M14 100 q12 -10 24 0 q-12 10 -24 0 Z M38 100 l6 -5 v10 Z" fill="#9fb4c8"/>
    <path d="M44 100 q12 -10 24 0 q-12 10 -24 0 Z M68 100 l6 -5 v10 Z" fill="#f2c94c"/>
    <path d="M74 100 q12 -10 24 0 q-12 10 -24 0 Z M98 100 l6 -5 v10 Z" fill="#9fb4c8"/>
    <path d="M104 100 q12 -10 24 0 q-12 10 -24 0 Z M128 100 l6 -5 v10 Z" fill="#f2c94c"/>
    <path d="M134 100 q12 -10 24 0 q-12 10 -24 0 Z M158 100 l6 -5 v10 Z" fill="#9fb4c8"/>
    <path d="M164 100 q12 -10 24 0 q-12 10 -24 0 Z M188 100 l6 -5 v10 Z" fill="#9fb4c8"/>
  </g>
  <!-- Zählpunkte über den Fischen -->
  <g fill="#2b3442"><circle cx="26" cy="80" r="2.5"/><circle cx="86" cy="80" r="2.5"/><circle cx="146" cy="80" r="2.5"/></g>
  <g fill="#f2c94c" stroke="#2b3442" stroke-width="1"><circle cx="56" cy="80" r="4"/><circle cx="116" cy="80" r="4"/></g>
  <!-- Pinsel -->
  <g transform="rotate(30 186 70)">
    <rect x="183" y="40" width="6" height="34" rx="2" fill="#c98c55" stroke="#2b3442" stroke-width="1.2"/>
    <path d="M182 74 h8 l-2 10 h-4 Z" fill="#f2c94c" stroke="#2b3442" stroke-width="1.2"/>
  </g>
  <!-- Pinguin -->
  <g transform="translate(226 124)">
    <ellipse cx="0" cy="10" rx="19" ry="27" fill="#2b3442"/>
    <ellipse cx="0" cy="14" rx="12.5" ry="19" fill="#f4f1ea"/>
    <circle cx="0" cy="-24" r="14" fill="#2b3442"/>
    <circle cx="-5" cy="-26" r="3.4" fill="#fff"/><circle cx="5" cy="-26" r="3.4" fill="#fff"/>
    <circle cx="-6" cy="-25" r="1.7" fill="#111"/><circle cx="4" cy="-25" r="1.7" fill="#111"/>
    <path d="M-12 -20 l-9 3 l9 3 Z" fill="#f2a13b"/>
    <path d="M-8 37 h-7 M8 37 h7" stroke="#f2a13b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-17 -2 q-10 -20 -24 -42" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
