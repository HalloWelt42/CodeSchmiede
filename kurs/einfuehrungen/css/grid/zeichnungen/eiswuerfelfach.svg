<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin legt kleine Fische der Reihe nach in die Fächer eines blauen Eiswürfelfachs mit drei Reihen und vier Spalten">
