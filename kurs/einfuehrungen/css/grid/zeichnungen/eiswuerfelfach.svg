  <rect x="14" y="40" width="176" height="128" rx="10" fill="#38bdf8" stroke="#2b3442" stroke-width="2"/>
  <g fill="#e3f1f8" stroke="#2b3442" stroke-width="1.2">
    <rect x="22" y="48" width="36" height="34" rx="5"/><rect x="64" y="48" width="36" height="34" rx="5"/><rect x="106" y="48" width="36" height="34" rx="5"/><rect x="148" y="48" width="36" height="34" rx="5"/>
    <rect x="22" y="88" width="36" height="34" rx="5"/><rect x="64" y="88" width="36" height="34" rx="5"/><rect x="106" y="88" width="36" height="34" rx="5"/><rect x="148" y="88" width="36" height="34" rx="5"/>
    <rect x="22" y="128" width="36" height="34" rx="5"/><rect x="64" y="128" width="36" height="34" rx="5"/><rect x="106" y="128" width="36" height="34" rx="5"/><rect x="148" y="128" width="36" height="34" rx="5"/>
