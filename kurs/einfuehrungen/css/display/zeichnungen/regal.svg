<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin räumt ein Regal ein: oben steht eine große Kiste allein auf ihrem Brett, darunter stehen kleine Dosen nebeneinander">
  <ellipse cx="130" cy="170" rx="118" ry="6" fill="rgba(0,0,0,.12)"/>
  <!-- Regal -->
  <rect x="14" y="12" width="168" height="152" rx="3" fill="#c98c55" stroke="#2b3442" stroke-width="2"/>
  <rect x="20" y="18" width="156" height="140" fill="#f3d7a8"/>
  <g fill="#b77a45" stroke="#2b3442" stroke-width="1.4">
    <rect x="20" y="62" width="156" height="6"/>
    <rect x="20" y="108" width="156" height="6"/>
  </g>
  <!-- großes Brett: eine Kiste über die ganze Breite -->
  <rect x="26" y="26" width="144" height="36" rx="2" fill="#4fd1a5" stroke="#2b3442" stroke-width="1.6"/>
  <!-- mittleres Brett: Dosen nebeneinander -->
  <g stroke="#2b3442" stroke-width="1.4">
    <rect x="28" y="80" width="22" height="28" rx="3" fill="#38bdf8"/>
    <rect x="54" y="84" width="22" height="24" rx="3" fill="#ec6aa8"/>
    <rect x="80" y="78" width="22" height="30" rx="3" fill="#f2c94c"/>
    <rect x="106" y="82" width="22" height="26" rx="3" fill="#38bdf8"/>
  </g>
  <!-- unteres Brett: Kacheln mit fester Größe, die nächste Reihe beginnt -->
  <g stroke="#2b3442" stroke-width="1.4" fill="#e3f1f8">
    <rect x="28" y="124" width="44" height="30" rx="2"/>
    <rect x="78" y="124" width="44" height="30" rx="2"/>
    <rect x="128" y="124" width="44" height="30" rx="2"/>
  </g>
  <!-- Pinguin hält eine Dose -->
  <g transform="translate(222 124)">
    <ellipse cx="0" cy="10" rx="19" ry="27" fill="#2b3442"/>
    <ellipse cx="0" cy="14" rx="12.5" ry="19" fill="#f4f1ea"/>
    <circle cx="0" cy="-24" r="14" fill="#2b3442"/>
    <circle cx="-5" cy="-26" r="3.4" fill="#fff"/><circle cx="5" cy="-26" r="3.4" fill="#fff"/>
    <circle cx="-6" cy="-25" r="1.7" fill="#111"/><circle cx="4" cy="-25" r="1.7" fill="#111"/>
    <path d="M-12 -20 l-9 3 l9 3 Z" fill="#f2a13b"/>
    <path d="M-8 37 h-7 M8 37 h7" stroke="#f2a13b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-17 -2 q-10 -10 -22 -12" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
  </g>
  <rect x="180" y="96" width="18" height="24" rx="3" fill="#ec6aa8" stroke="#2b3442" stroke-width="1.4"/>
</svg>
