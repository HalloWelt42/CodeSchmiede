<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin schiebt drei Fischkisten auf einer langen Bank so, dass die Lücken zwischen ihnen und zum Rand gleich groß sind">
  <ellipse cx="130" cy="170" rx="118" ry="6" fill="rgba(0,0,0,.12)"/>
  <!-- Bank -->
  <rect x="10" y="110" width="186" height="10" rx="2" fill="#c98c55" stroke="#2b3442" stroke-width="1.8"/>
  <rect x="20" y="120" width="8" height="40" fill="#b77a45" stroke="#2b3442" stroke-width="1.4"/>
  <rect x="178" y="120" width="8" height="40" fill="#b77a45" stroke="#2b3442" stroke-width="1.4"/>
  <!-- Kisten mit gleichen Lücken -->
  <g stroke="#2b3442" stroke-width="1.8">
    <rect x="30" y="80" width="36" height="30" rx="2" fill="#4fd1a5"/>
    <rect x="86" y="80" width="36" height="30" rx="2" fill="#ec6aa8"/>
    <rect x="142" y="80" width="36" height="30" rx="2" fill="#38bdf8"/>
  </g>
  <!-- Fische schauen heraus -->
  <g fill="#9fb4c8" stroke="#2b3442" stroke-width="1"><path d="M38 80 q8 -8 16 0 Z M94 80 q8 -8 16 0 Z M150 80 q8 -8 16 0 Z"/></g>
  <!-- gleiche Lücken angedeutet -->
  <g stroke="#f59e0b" stroke-width="2" stroke-linecap="round">
    <path d="M12 70 h16 M68 70 h16 M124 70 h16 M180 70 h14"/>
  </g>
  <g fill="#f59e0b"><circle cx="20" cy="70" r="2.5"/><circle cx="76" cy="70" r="2.5"/><circle cx="132" cy="70" r="2.5"/><circle cx="187" cy="70" r="2.5"/></g>
  <!-- Pinguin schiebt -->
  <g transform="translate(224 124)">
    <ellipse cx="0" cy="10" rx="19" ry="27" fill="#2b3442"/>
    <ellipse cx="0" cy="14" rx="12.5" ry="19" fill="#f4f1ea"/>
    <circle cx="0" cy="-24" r="14" fill="#2b3442"/>
    <circle cx="-5" cy="-26" r="3.4" fill="#fff"/><circle cx="5" cy="-26" r="3.4" fill="#fff"/>
    <circle cx="-6" cy="-25" r="1.7" fill="#111"/><circle cx="4" cy="-25" r="1.7" fill="#111"/>
    <path d="M-12 -20 l-9 3 l9 3 Z" fill="#f2a13b"/>
    <path d="M-8 37 h-7 M8 37 h7" stroke="#f2a13b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-17 -2 q-12 -14 -26 -26" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
