<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin klebt einen runden roten Aufkleber schräg über die obere rechte Ecke einer Speisekarte an einer Pinnwand">
  <ellipse cx="130" cy="170" rx="118" ry="6" fill="rgba(0,0,0,.12)"/>
  <!-- Pinnwand -->
  <rect x="8" y="10" width="186" height="150" rx="4" fill="#c98c55" stroke="#2b3442" stroke-width="2"/>
  <g fill="#b77a45"><circle cx="30" cy="140" r="2"/><circle cx="160" cy="30" r="2"/><circle cx="60" cy="25" r="1.6"/><circle cx="175" cy="140" r="1.6"/></g>
  <!-- Karte -->
  <rect x="34" y="34" width="120" height="110" rx="3" fill="#fbf4e2" stroke="#2b3442" stroke-width="1.8"/>
  <rect x="44" y="46" width="80" height="10" rx="2" fill="#ffd166"/>
  <g fill="#a7afba"><rect x="44" y="66" width="90" height="5" rx="2"/><rect x="44" y="78" width="70" height="5" rx="2"/><rect x="44" y="90" width="84" height="5" rx="2"/><rect x="44" y="110" width="60" height="5" rx="2"/></g>
  <!-- Pinnnadel -->
  <circle cx="94" cy="38" r="4" fill="#e2574c" stroke="#2b3442" stroke-width="1.2"/>
  <!-- Aufkleber über der Ecke -->
  <g transform="rotate(-14 152 36)">
    <ellipse cx="152" cy="36" rx="24" ry="16" fill="#e63946" stroke="#2b3442" stroke-width="1.8"/>
    <path d="M140 36 h24 M144 30 h16 M144 42 h16" stroke="#fbcfe8" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <!-- Pinguin -->
  <g transform="translate(224 124)">
    <ellipse cx="0" cy="10" rx="19" ry="27" fill="#2b3442"/>
    <ellipse cx="0" cy="14" rx="12.5" ry="19" fill="#f4f1ea"/>
    <circle cx="0" cy="-24" r="14" fill="#2b3442"/>
    <circle cx="-5" cy="-26" r="3.4" fill="#fff"/><circle cx="5" cy="-26" r="3.4" fill="#fff"/>
    <circle cx="-6" cy="-25" r="1.7" fill="#111"/><circle cx="4" cy="-25" r="1.7" fill="#111"/>
    <path d="M-12 -20 l-9 3 l9 3 Z" fill="#f2a13b"/>
    <path d="M-8 37 h-7 M8 37 h7" stroke="#f2a13b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-17 -2 q-24 -30 -40 -76" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
