<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin schwebt an einem Schirm über einer Eisscholle und wirft einen weichen Schatten, dahinter ein Himmel mit Farbverlauf von Orange zu Blau">
  <defs>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset=".5" stop-color="#ff5e62"/>
      <stop offset="1" stop-color="#2b4a8a"/>
    </linearGradient>
    <radialGradient id="schatten">
      <stop offset="0" stop-color="#2b3442" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2b3442" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="6" y="6" width="248" height="168" rx="6" fill="url(#himmel)"/>
  <!-- Eisscholle -->
  <path d="M30 150 q100 -14 200 0 l-10 14 h-180 Z" fill="#e3f1f8" stroke="#2b3442" stroke-width="2"/>
  <!-- weicher Schatten -->
  <ellipse cx="130" cy="150" rx="38" ry="8" fill="url(#schatten)"/>
  <!-- Schirm -->
  <path d="M86 46 q44 -40 88 0 Z" fill="#ec6aa8" stroke="#2b3442" stroke-width="2"/>
  <path d="M86 46 q11 -8 22 0 q11 -8 22 0 q11 -8 22 0 q11 -8 22 0" fill="none" stroke="#2b3442" stroke-width="1.6"/>
  <path d="M130 46 v40" stroke="#2b3442" stroke-width="2"/>
  <!-- schwebender Pinguin -->
  <g transform="translate(130 108)">
    <ellipse cx="0" cy="10" rx="19" ry="27" fill="#2b3442"/>
    <ellipse cx="0" cy="14" rx="12.5" ry="19" fill="#f4f1ea"/>
    <circle cx="0" cy="-24" r="14" fill="#2b3442"/>
    <circle cx="-5" cy="-26" r="3.4" fill="#fff"/><circle cx="5" cy="-26" r="3.4" fill="#fff"/>
    <circle cx="-5" cy="-25" r="1.7" fill="#111"/><circle cx="5" cy="-25" r="1.7" fill="#111"/>
    <path d="M-4 -18 l4 7 l4 -7 Z" fill="#f2a13b"/>
    <path d="M-8 36 l-5 6 M8 36 l5 6" stroke="#f2a13b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M17 -4 q6 -14 -15 -22" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
    <path d="M-17 -2 q-10 10 -14 20" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Sonne -->
  <circle cx="214" cy="40" r="16" fill="#fff6c2" opacity=".9"/>
</svg>
