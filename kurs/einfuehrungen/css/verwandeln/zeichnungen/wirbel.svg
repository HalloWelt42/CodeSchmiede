<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin wirft eine Fischkiste hoch, die sich in drei Stufen in der Luft dreht und dabei größer wird">
  <ellipse cx="130" cy="170" rx="118" ry="6" fill="rgba(0,0,0,.12)"/>
  <!-- Flugbahn -->
  <path d="M190 120 Q120 10 30 70" fill="none" stroke="#2b3442" stroke-width="1.6" stroke-dasharray="5 4"/>
  <!-- Kiste in drei Stufen: klein und gerade, mittel und gedreht, groß und stark gedreht -->
  <g stroke="#2b3442" stroke-width="1.6">
    <rect x="170" y="92" width="20" height="16" rx="2" fill="#c98c55"/>
    <rect x="104" y="38" width="30" height="24" rx="2" fill="#c98c55" transform="rotate(-25 119 50)"/>
    <rect x="22" y="56" width="44" height="34" rx="3" fill="#c98c55" transform="rotate(-55 44 73)"/>
  </g>
  <!-- Fischschwänze schauen heraus -->
  <g fill="#9fb4c8" stroke="#2b3442" stroke-width="1">
    <path d="M176 92 l3 -6 l3 6 Z"/>
    <path d="M114 36 l4 -8 l4 8 Z" transform="rotate(-25 119 50)"/>
    <path d="M38 54 l6 -10 l6 10 Z" transform="rotate(-55 44 73)"/>
  </g>
  <!-- Drehpfeile -->
  <g fill="none" stroke="#ec6aa8" stroke-width="2" stroke-linecap="round">
    <path d="M140 30 a14 14 0 0 1 8 16"/>
    <path d="M70 46 a20 20 0 0 1 8 22"/>
  </g>
  <!-- Pinguin wirft -->
  <g transform="translate(212 128)">
    <ellipse cx="0" cy="10" rx="19" ry="27" fill="#2b3442"/>
    <ellipse cx="0" cy="14" rx="12.5" ry="19" fill="#f4f1ea"/>
    <circle cx="0" cy="-24" r="14" fill="#2b3442"/>
    <circle cx="-5" cy="-27" r="3.4" fill="#fff"/><circle cx="5" cy="-27" r="3.4" fill="#fff"/>
    <circle cx="-6" cy="-28" r="1.7" fill="#111"/><circle cx="4" cy="-28" r="1.7" fill="#111"/>
    <path d="M-12 -20 l-9 3 l9 3 Z" fill="#f2a13b"/>
    <path d="M-8 37 h-7 M8 37 h7" stroke="#f2a13b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-17 -2 q-8 -14 -14 -28" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
