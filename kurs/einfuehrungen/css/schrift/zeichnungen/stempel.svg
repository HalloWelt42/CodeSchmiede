<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin druckt mit einem Holzstempel Balken auf ein Plakat, oben ein großer dicker Balken, darunter mittlere und kleine, einer davon schräg">
  <ellipse cx="130" cy="170" rx="118" ry="6" fill="rgba(0,0,0,.12)"/>
  <!-- Plakat -->
  <rect x="18" y="14" width="140" height="150" rx="3" fill="#fbf4e2" stroke="#2b3442" stroke-width="2.2"/>
  <!-- großer Name: dicker Balken -->
  <rect x="32" y="30" width="112" height="22" rx="3" fill="#ec6aa8"/>
  <!-- mittlere Zeilen -->
  <g fill="#2b3442"><rect x="40" y="66" width="96" height="9" rx="2"/><rect x="40" y="82" width="80" height="9" rx="2"/></g>
  <!-- schräge Zeile -->
  <path d="M46 112 h82 l-4 9 h-82 Z" fill="#4fd1a5"/>
  <!-- kleine Zeilen rechtsbündig -->
  <g fill="#a7afba"><rect x="92" y="138" width="52" height="4" rx="1.5"/><rect x="108" y="146" width="36" height="4" rx="1.5"/></g>
  <!-- Stempel in der Hand -->
  <g transform="rotate(-12 196 70)">
    <rect x="180" y="72" width="34" height="14" rx="2" fill="#4fd1a5" stroke="#2b3442" stroke-width="1.6"/>
    <rect x="186" y="58" width="22" height="14" rx="2" fill="#c98c55" stroke="#2b3442" stroke-width="1.6"/>
    <rect x="192" y="40" width="10" height="18" rx="3" fill="#c98c55" stroke="#2b3442" stroke-width="1.6"/>
  </g>
  <!-- Pinguin -->
  <g transform="translate(222 128)">
    <ellipse cx="0" cy="10" rx="19" ry="27" fill="#2b3442"/>
    <ellipse cx="0" cy="14" rx="12.5" ry="19" fill="#f4f1ea"/>
    <circle cx="0" cy="-24" r="14" fill="#2b3442"/>
    <circle cx="-5" cy="-26" r="3.4" fill="#fff"/><circle cx="5" cy="-26" r="3.4" fill="#fff"/>
    <circle cx="-6" cy="-25" r="1.7" fill="#111"/><circle cx="4" cy="-25" r="1.7" fill="#111"/>
    <path d="M-12 -20 l-9 3 l9 3 Z" fill="#f2a13b"/>
    <path d="M-8 37 h-7 M8 37 h7" stroke="#f2a13b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-17 -2 q-10 -20 -18 -40" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
