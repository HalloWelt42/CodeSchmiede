<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin steckt einen zusammengerollten Zettel in eine Flaschenpost, am Ufer gegenüber zieht ein zweiter Pinguin eine Flasche aus dem Wasser">
  <defs>
    <g id="pingu-f">
      <ellipse cx="0" cy="10" rx="15" ry="22" fill="#2b3442"/>
      <ellipse cx="0" cy="13" rx="10" ry="15" fill="#f4f1ea"/>
      <circle cx="0" cy="-18" r="11" fill="#2b3442"/>
      <circle cx="-4" cy="-20" r="2.6" fill="#fff"/><circle cx="3" cy="-20" r="2.6" fill="#fff"/>
      <circle cx="-4.6" cy="-19.5" r="1.3" fill="#111"/><circle cx="2.4" cy="-19.5" r="1.3" fill="#111"/>
      <path d="M-9 -15 l-7 2.5 l7 2.5 Z" fill="#f2a13b"/>
    </g>
    <g id="flasche">
      <path d="M-18 -7 h26 q8 0 10 4 h8 v6 h-8 q-2 4 -10 4 h-26 q-4 0 -4 -7 q0 -7 4 -7 Z" fill="#a9d6c4" fill-opacity=".85" stroke="#2b3442" stroke-width="1.6"/>
      <rect x="26" y="-3" width="5" height="6" fill="#a8733f" stroke="#2b3442" stroke-width="1"/>
    </g>
  </defs>
  <!-- Wasser -->
  <path d="M0 132 q16 -6 32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 t32 0 v48 h-260 Z" fill="#5b9bd5" stroke="#2b3442" stroke-width="2"/>
  <!-- linkes Ufer -->
  <path d="M0 110 h70 l12 24 h-82 Z" fill="#e8f2fa" stroke="#2b3442" stroke-width="2"/>
  <!-- rechtes Ufer -->
  <path d="M260 112 h-62 l-10 22 h72 Z" fill="#e8f2fa" stroke="#2b3442" stroke-width="2"/>
  <!-- Pinguin links mit Zettel und Flasche -->
  <use href="#pingu-f" transform="translate(30 88)"/>
  <g transform="translate(58 96)">
    <use href="#flasche"/>
    <rect x="-14" y="-4" width="20" height="8" rx="4" fill="#fffaf0" stroke="#2b3442" stroke-width="1"/>
  </g>
  <!-- schwimmende Flasche -->
  <use href="#flasche" transform="translate(132 132) rotate(-12)"/>
  <!-- Pinguin rechts, zieht eine Flasche heraus -->
  <use href="#pingu-f" transform="translate(228 90)"/>
  <use href="#flasche" transform="translate(196 116) rotate(28)"/>
</svg>
