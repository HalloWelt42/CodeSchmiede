<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin heftet einen Zettel an eine Anzeigetafel, darüber hängen schon drei Zettel untereinander">
  <ellipse cx="130" cy="170" rx="112" ry="6" fill="rgba(0,0,0,.12)"/>
  <!-- Pfosten und Tafel -->
  <rect x="38" y="120" width="8" height="48" fill="#a8733f" stroke="#2b3442" stroke-width="2"/>
  <rect x="132" y="120" width="8" height="48" fill="#a8733f" stroke="#2b3442" stroke-width="2"/>
  <rect x="20" y="14" width="138" height="112" rx="5" fill="#d9a774" stroke="#2b3442" stroke-width="2.6"/>
  <rect x="28" y="22" width="122" height="96" rx="3" fill="#c38a55" stroke="#2b3442" stroke-width="1.6"/>
  <!-- Zettel untereinander -->
  <g stroke="#2b3442" stroke-width="1.8">
    <rect x="38" y="30" width="96" height="18" rx="2" fill="#fffaf0"/>
    <rect x="38" y="54" width="96" height="18" rx="2" fill="#fbf4e2"/>
    <rect x="38" y="78" width="96" height="18" rx="2" fill="#fffaf0"/>
  </g>
  <g stroke="#a7afba" stroke-width="2.2" stroke-linecap="round">
    <path d="M46 39 h58 M46 63 h40 M46 87 h66"/>
  </g>
  <g fill="#e2574c" stroke="#2b3442" stroke-width="1.2">
    <circle cx="86" cy="31" r="3"/><circle cx="86" cy="55" r="3"/><circle cx="86" cy="79" r="3"/>
  </g>
  <!-- leerer Platz für den nächsten Zettel -->
  <rect x="38" y="102" width="96" height="12" rx="2" fill="none" stroke="#fffaf0" stroke-width="1.6" stroke-dasharray="4 4" opacity=".8"/>
  <!-- neuer Zettel in der Flosse -->
  <g transform="rotate(-10 176 98)">
    <rect x="150" y="88" width="52" height="20" rx="2" fill="#fffaf0" stroke="#2b3442" stroke-width="1.8"/>
    <path d="M157 98 h36" stroke="#5b9bd5" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="176" cy="89" r="3" fill="#e2574c" stroke="#2b3442" stroke-width="1.2"/>
  </g>
  <!-- Pinguin -->
  <g transform="translate(220 124)">
    <ellipse cx="0" cy="10" rx="19" ry="27" fill="#2b3442"/>
    <ellipse cx="0" cy="14" rx="12.5" ry="19" fill="#f4f1ea"/>
    <circle cx="0" cy="-24" r="14" fill="#2b3442"/>
    <circle cx="-5" cy="-26" r="3.4" fill="#fff"/><circle cx="5" cy="-26" r="3.4" fill="#fff"/>
    <circle cx="-6" cy="-25" r="1.7" fill="#111"/><circle cx="4" cy="-25" r="1.7" fill="#111"/>
    <path d="M-12 -20 l-9 3 l9 3 Z" fill="#f2a13b"/>
    <path d="M-8 37 h-7 M8 37 h7" stroke="#f2a13b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-17 0 q-12 -10 -24 -24" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
