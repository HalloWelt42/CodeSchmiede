<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin legt Fische auf eine Balkenwaage, die sich deutlich zur linken Seite neigt">
  <ellipse cx="130" cy="170" rx="112" ry="6" fill="rgba(0,0,0,.12)"/>
  <!-- Fuß und Säule -->
  <path d="M70 166 h60 l-8 -10 h-44 Z" fill="#a8733f" stroke="#2b3442" stroke-width="2.2" stroke-linejoin="round"/>
  <rect x="96" y="58" width="8" height="98" fill="#c38a55" stroke="#2b3442" stroke-width="2"/>
  <!-- Balken, links tiefer -->
  <g transform="rotate(-14 100 58)">
    <rect x="30" y="54" width="140" height="8" rx="3" fill="#e0b54a" stroke="#2b3442" stroke-width="2"/>
  </g>
  <circle cx="100" cy="58" r="6" fill="#f4f1ea" stroke="#2b3442" stroke-width="2"/>
  <!-- linke Schale tiefer -->
  <g stroke="#2b3442" stroke-width="1.6"><path d="M33 75 l-14 34 M33 75 l14 34"/><path d="M167 41 l-14 34 M167 41 l14 34"/></g>
  <path d="M10 109 h46 q-4 14 -23 14 q-19 0 -23 -14 Z" fill="#a7afba" stroke="#2b3442" stroke-width="2"/>
  <path d="M144 75 h46 q-4 14 -23 14 q-19 0 -23 -14 Z" fill="#a7afba" stroke="#2b3442" stroke-width="2"/>
  <!-- großer Fisch links -->
  <g transform="translate(33 102)">
    <path d="M-18 0 q18 -13 34 0 q-16 13 -34 0 Z" fill="#5b9bd5" stroke="#2b3442" stroke-width="1.6"/>
    <path d="M16 0 l9 -8 v16 Z" fill="#5b9bd5" stroke="#2b3442" stroke-width="1.6"/>
    <circle cx="-11" cy="-1" r="1.6" fill="#2b3442"/>
  </g>
  <!-- kleiner Fisch rechts -->
  <g transform="translate(167 70)">
    <path d="M-10 0 q10 -7 19 0 q-9 7 -19 0 Z" fill="#a7afba" stroke="#2b3442" stroke-width="1.4"/>
    <path d="M9 0 l6 -5 v10 Z" fill="#a7afba" stroke="#2b3442" stroke-width="1.4"/>
    <circle cx="-6" cy="-1" r="1.2" fill="#2b3442"/>
  </g>
  <!-- Pinguin -->
  <g transform="translate(222 124)">
    <ellipse cx="0" cy="10" rx="19" ry="27" fill="#2b3442"/>
    <ellipse cx="0" cy="14" rx="12.5" ry="19" fill="#f4f1ea"/>
    <circle cx="0" cy="-24" r="14" fill="#2b3442"/>
    <circle cx="-5" cy="-26" r="3.4" fill="#fff"/><circle cx="5" cy="-26" r="3.4" fill="#fff"/>
    <circle cx="-6" cy="-25" r="1.7" fill="#111"/><circle cx="4" cy="-25" r="1.7" fill="#111"/>
    <path d="M-12 -20 l-9 3 l9 3 Z" fill="#f2a13b"/>
    <path d="M-8 37 h-7 M8 37 h7" stroke="#f2a13b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-17 0 q-10 -8 -16 -30" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
