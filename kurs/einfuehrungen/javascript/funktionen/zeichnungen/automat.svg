<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin wirft Zutaten oben in einen kleinen Automaten, unten kommt ein fertiges Fischbrötchen heraus">
  <ellipse cx="130" cy="170" rx="118" ry="6" fill="rgba(0,0,0,.12)"/>
  <!-- Automat -->
  <rect x="40" y="40" width="100" height="112" rx="8" fill="#7fc8a9" stroke="#2b3442" stroke-width="2.4"/>
  <path d="M62 40 l8 -16 h40 l8 16 Z" fill="#f2c94c" stroke="#2b3442" stroke-width="2.2" stroke-linejoin="round"/>
  <rect x="58" y="58" width="64" height="30" rx="4" fill="#2b3442"/>
  <g fill="#f2c94c"><circle cx="72" cy="73" r="5"/><circle cx="90" cy="73" r="5" fill="#e2574c"/><circle cx="108" cy="73" r="5" fill="#5b9bd5"/></g>
  <circle cx="122" cy="104" r="7" fill="#e2574c" stroke="#2b3442" stroke-width="2"/>
  <rect x="56" y="118" width="68" height="24" rx="4" fill="#e8f2fa" stroke="#2b3442" stroke-width="2"/>
  <!-- Fischbrötchen in der Ausgabe -->
  <g transform="translate(90 132)">
    <path d="M-24 0 q24 -14 48 0 Z" fill="#d9a774" stroke="#2b3442" stroke-width="1.6"/>
    <path d="M-20 0 q20 6 40 0" fill="#a7afba" stroke="#2b3442" stroke-width="1.4"/>
    <path d="M-24 0 q24 10 48 0" fill="none" stroke="#2b3442" stroke-width="1.6"/>
  </g>
  <!-- Zutaten fliegen in den Trichter -->
  <g stroke="#2b3442" stroke-width="1.4">
    <g transform="translate(150 22) rotate(-30)"><path d="M-10 0 q10 -7 19 0 q-9 7 -19 0 Z" fill="#a7afba"/><path d="M9 0 l6 -5 v10 Z" fill="#a7afba"/></g>
    <ellipse cx="176" cy="44" rx="12" ry="7" fill="#d9a774"/>
  </g>
  <g stroke="#2b3442" stroke-width="1.6" stroke-linecap="round" opacity=".5"><path d="M130 14 l-8 4 M136 30 l-8 2"/></g>
  <!-- Pinguin -->
  <g transform="translate(220 124)">
    <ellipse cx="0" cy="10" rx="19" ry="27" fill="#2b3442"/>
    <ellipse cx="0" cy="14" rx="12.5" ry="19" fill="#f4f1ea"/>
    <circle cx="0" cy="-24" r="14" fill="#2b3442"/>
    <circle cx="-5" cy="-26" r="3.4" fill="#fff"/><circle cx="5" cy="-26" r="3.4" fill="#fff"/>
    <circle cx="-6" cy="-25" r="1.7" fill="#111"/><circle cx="4" cy="-25" r="1.7" fill="#111"/>
    <path d="M-12 -20 l-9 3 l9 3 Z" fill="#f2a13b"/>
    <path d="M-8 37 h-7 M8 37 h7" stroke="#f2a13b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-17 -2 q-14 -20 -26 -60" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
