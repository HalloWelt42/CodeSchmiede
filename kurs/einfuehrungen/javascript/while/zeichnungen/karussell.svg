<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin fährt auf einem kleinen Eiskarussell im Kreis, daneben zählt ein Zählwerk die Runden">
  <ellipse cx="130" cy="170" rx="118" ry="6" fill="rgba(0,0,0,.12)"/>
  <!-- Dach -->
  <path d="M40 46 l66 -30 l66 30 Z" fill="#e2574c" stroke="#2b3442" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M40 46 q11 10 22 0 q11 10 22 0 q11 10 22 0 q11 10 22 0 q11 10 22 0 q11 10 22 0" fill="#fffaf0" stroke="#2b3442" stroke-width="2"/>
  <circle cx="106" cy="14" r="4" fill="#f2c94c" stroke="#2b3442" stroke-width="1.6"/>
  <!-- Mittelstange -->
  <rect x="102" y="52" width="8" height="96" fill="#a7afba" stroke="#2b3442" stroke-width="2"/>
  <!-- Plattform -->
  <ellipse cx="106" cy="150" rx="74" ry="14" fill="#e8f2fa" stroke="#2b3442" stroke-width="2.4"/>
  <ellipse cx="106" cy="146" rx="74" ry="14" fill="#fffaf0" stroke="#2b3442" stroke-width="2"/>
  <!-- Kreispfeil -->
  <path d="M52 132 q54 -22 108 0" fill="none" stroke="#5b9bd5" stroke-width="3" stroke-dasharray="5 5"/>
  <path d="M160 132 l-9 -1 l5 -7 Z" fill="#5b9bd5"/>
  <!-- Stangen mit Fischfiguren -->
  <g stroke="#2b3442" stroke-width="2"><path d="M60 52 v86 M152 52 v86"/></g>
  <g transform="translate(152 104)">
    <path d="M-14 0 q14 -10 26 0 q-12 10 -26 0 Z" fill="#7fc8a9" stroke="#2b3442" stroke-width="1.6"/>
    <path d="M12 0 l8 -6 v12 Z" fill="#7fc8a9" stroke="#2b3442" stroke-width="1.6"/>
  </g>
  <!-- Pinguin reitet links -->
  <g transform="translate(60 106) scale(0.7)">
    <ellipse cx="0" cy="10" rx="19" ry="27" fill="#2b3442"/>
    <ellipse cx="0" cy="14" rx="12.5" ry="19" fill="#f4f1ea"/>
    <circle cx="0" cy="-24" r="14" fill="#2b3442"/>
    <circle cx="-5" cy="-26" r="3.4" fill="#fff"/><circle cx="5" cy="-26" r="3.4" fill="#fff"/>
    <circle cx="-6" cy="-25" r="1.7" fill="#111"/><circle cx="4" cy="-25" r="1.7" fill="#111"/>
    <path d="M-12 -20 l-9 3 l9 3 Z" fill="#f2a13b"/>
    <path d="M17 -2 l8 -14" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Zählwerk rechts -->
  <rect x="198" y="96" width="50" height="34" rx="4" fill="#2b3442"/>
  <g fill="#7fc8a9" stroke="#1d2530" stroke-width="1.2">
    <rect x="204" y="104" width="11" height="18" rx="2"/><rect x="218" y="104" width="11" height="18" rx="2"/><rect x="232" y="104" width="11" height="18" rx="2"/>
  </g>
  <g stroke="#2b3442" stroke-width="2.4" stroke-linecap="round"><path d="M209.5 108 v10 M223.5 108 v10 M237.5 108 v10"/></g>
  <rect x="219" y="130" width="8" height="38" fill="#a7afba" stroke="#2b3442" stroke-width="2"/>
</svg>
