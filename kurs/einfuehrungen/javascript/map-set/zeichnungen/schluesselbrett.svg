<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin hängt Schlüssel mit Anhängern an ein Schlüsselbrett, daneben steht eine Schale mit lauter verschiedenen Muscheln">
  <ellipse cx="130" cy="170" rx="118" ry="6" fill="rgba(0,0,0,.12)"/>
  <!-- Brett -->
  <rect x="14" y="20" width="132" height="34" rx="5" fill="#c38a55" stroke="#2b3442" stroke-width="2.2"/>
  <g fill="#a7afba" stroke="#2b3442" stroke-width="1.4"><circle cx="38" cy="44" r="3"/><circle cx="68" cy="44" r="3"/><circle cx="98" cy="44" r="3"/><circle cx="128" cy="44" r="3"/></g>
  <!-- Anhänger mit Schlüsseln an drei Haken, der vierte leer -->
  <g stroke="#2b3442" stroke-width="1.6">
    <path d="M38 47 v14 M68 47 v14 M98 47 v14" fill="none"/>
    <rect x="28" y="61" width="20" height="14" rx="3" fill="#e2574c"/>
    <rect x="58" y="61" width="20" height="14" rx="3" fill="#f2c94c"/>
    <rect x="88" y="61" width="20" height="14" rx="3" fill="#7fc8a9"/>
    <path d="M38 75 v6 M68 75 v6 M98 75 v6" fill="none"/>
  </g>
  <g fill="#e0b54a" stroke="#2b3442" stroke-width="1.4">
    <circle cx="38" cy="86" r="5"/><path d="M36 91 h4 v16 h3 v3 h-3 v3 h-4 Z"/>
    <circle cx="68" cy="86" r="5"/><path d="M66 91 h4 v14 h3 v3 h-7 Z"/>
    <circle cx="98" cy="86" r="5"/><path d="M96 91 h4 v18 h4 v3 h-8 Z"/>
  </g>
  <!-- Schale mit Muscheln, jede Form einmal -->
  <path d="M30 140 h104 q-6 24 -52 24 q-46 0 -52 -24 Z" fill="#5b9bd5" stroke="#2b3442" stroke-width="2.2"/>
  <g stroke="#2b3442" stroke-width="1.4">
    <path d="M48 140 a10 10 0 0 1 20 0 Z" fill="#fbf4e2"/>
    <circle cx="82" cy="134" r="7" fill="#f2c94c"/>
    <path d="M96 140 l8 -14 l8 14 Z" fill="#e2574c"/>
    <path d="M116 140 q6 -16 14 0 Z" fill="#7fc8a9"/>
  </g>
  <!-- Pinguin mit Schlüssel in der Flosse -->
  <g transform="translate(206 124)">
    <ellipse cx="0" cy="10" rx="19" ry="27" fill="#2b3442"/>
    <ellipse cx="0" cy="14" rx="12.5" ry="19" fill="#f4f1ea"/>
    <circle cx="0" cy="-24" r="14" fill="#2b3442"/>
    <circle cx="-5" cy="-26" r="3.4" fill="#fff"/><circle cx="5" cy="-26" r="3.4" fill="#fff"/>
    <circle cx="-6" cy="-25" r="1.7" fill="#111"/><circle cx="4" cy="-25" r="1.7" fill="#111"/>
    <path d="M-12 -20 l-9 3 l9 3 Z" fill="#f2a13b"/>
    <path d="M-8 37 h-7 M8 37 h7" stroke="#f2a13b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-17 -2 q-24 -22 -40 -62" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
    <rect x="-90" y="-82" width="20" height="14" rx="3" fill="#5b9bd5" stroke="#2b3442" stroke-width="1.6"/>
  </g>
</svg>
