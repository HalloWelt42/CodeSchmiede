<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin wirft einen Zettel in eine bunte Verwandlungsmaschine, unten purzeln Münzen heraus">
  <ellipse cx="130" cy="170" rx="112" ry="6" fill="rgba(0,0,0,.12)"/>
  <!-- Trichter -->
  <path d="M52 22 h76 l-22 30 h-32 Z" fill="#f2c94c" stroke="#2b3442" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Gehäuse -->
  <rect x="44" y="52" width="92" height="76" rx="8" fill="#5b9bd5" stroke="#2b3442" stroke-width="2.6"/>
  <circle cx="72" cy="80" r="12" fill="#fffaf0" stroke="#2b3442" stroke-width="2"/>
  <path d="M72 80 l7 -6" stroke="#e2574c" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="72" cy="80" r="2" fill="#2b3442"/>
  <g stroke="#2b3442" stroke-width="1.6">
    <rect x="96" y="70" width="28" height="8" rx="2" fill="#7fc8a9"/>
    <rect x="96" y="84" width="28" height="8" rx="2" fill="#e2574c"/>
  </g>
  <g fill="#f4f1ea" stroke="#2b3442" stroke-width="1.2"><circle cx="58" cy="112" r="4"/><circle cx="70" cy="112" r="4"/><circle cx="82" cy="112" r="4"/></g>
  <!-- Ausgabe unten -->
  <path d="M100 128 v14 h22" fill="none" stroke="#2b3442" stroke-width="10" stroke-linejoin="round"/>
  <path d="M100 128 v14 h22" fill="none" stroke="#8b939e" stroke-width="6" stroke-linejoin="round"/>
  <!-- Münzen -->
  <g fill="#e0b54a" stroke="#2b3442" stroke-width="1.6">
    <ellipse cx="134" cy="152" rx="8" ry="6"/>
    <ellipse cx="150" cy="160" rx="8" ry="6"/>
    <ellipse cx="128" cy="164" rx="8" ry="6"/>
  </g>
  <g stroke="#b8892a" stroke-width="1.4" stroke-linecap="round"><path d="M131 152 h6 M147 160 h6 M125 164 h6"/></g>
  <!-- fliegender Zettel über dem Trichter -->
  <g transform="rotate(-18 150 30)">
    <rect x="136" y="18" width="34" height="24" rx="2" fill="#fffaf0" stroke="#2b3442" stroke-width="1.8"/>
    <path d="M142 26 h22 M142 33 h14" stroke="#a7afba" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g stroke="#2b3442" stroke-width="1.6" stroke-linecap="round" opacity=".5"><path d="M176 52 l6 4 M172 60 l7 1"/></g>
  <!-- Pinguin -->
  <g transform="translate(214 124)">
    <ellipse cx="0" cy="10" rx="19" ry="27" fill="#2b3442"/>
    <ellipse cx="0" cy="14" rx="12.5" ry="19" fill="#f4f1ea"/>
    <circle cx="0" cy="-24" r="14" fill="#2b3442"/>
    <circle cx="-5" cy="-26" r="3.4" fill="#fff"/><circle cx="5" cy="-26" r="3.4" fill="#fff"/>
    <circle cx="-6" cy="-25" r="1.7" fill="#111"/><circle cx="4" cy="-25" r="1.7" fill="#111"/>
    <path d="M-12 -20 l-9 3 l9 3 Z" fill="#f2a13b"/>
    <path d="M-8 37 h-7 M8 37 h7" stroke="#f2a13b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-17 -2 q-14 -20 -26 -56" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
