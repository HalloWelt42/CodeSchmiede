<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Eine große Schneekugel enthält eine kleinere Schneekugel, in beiden sitzt ein Pinguin, der kleine schaut nach draußen">
  <defs>
    <g id="pingu-k">
      <ellipse cx="0" cy="10" rx="13" ry="19" fill="#2b3442"/>
      <ellipse cx="0" cy="13" rx="8.5" ry="13" fill="#f4f1ea"/>
      <circle cx="0" cy="-14" r="10" fill="#2b3442"/>
      <circle cx="-4" cy="-15" r="2.4" fill="#fff"/><circle cx="2" cy="-15" r="2.4" fill="#fff"/>
      <circle cx="-4.6" cy="-14.6" r="1.2" fill="#111"/><circle cx="1.4" cy="-14.6" r="1.2" fill="#111"/>
      <path d="M-9 -11 l-6 2 l6 2 Z" fill="#f2a13b"/>
    </g>
  </defs>
  <ellipse cx="130" cy="170" rx="100" ry="6" fill="rgba(0,0,0,.12)"/>
  <!-- Sockel -->
  <path d="M60 150 h140 l-10 18 h-120 Z" fill="#a8733f" stroke="#2b3442" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- große Kugel -->
  <circle cx="130" cy="84" r="74" fill="#e8f2fa" fill-opacity=".85" stroke="#2b3442" stroke-width="2.6"/>
  <path d="M84 40 q16 -18 40 -22" fill="none" stroke="#fffaf0" stroke-width="5" stroke-linecap="round" opacity=".9"/>
  <!-- Schneeflocken -->
  <g fill="#fffaf0" stroke="#a7afba" stroke-width=".8">
    <circle cx="96" cy="60" r="2.5"/><circle cx="170" cy="46" r="2"/><circle cx="182" cy="96" r="2.5"/><circle cx="80" cy="112" r="2"/><circle cx="150" cy="30" r="2"/>
  </g>
  <!-- großer Pinguin innen links -->
  <use href="#pingu-k" transform="translate(88 124)"/>
  <!-- kleine Kugel rechts -->
  <path d="M144 146 h52 l-4 6 h-44 Z" fill="#c38a55" stroke="#2b3442" stroke-width="1.8"/>
  <circle cx="170" cy="118" r="30" fill="#cfe5f5" stroke="#2b3442" stroke-width="2.2"/>
  <path d="M152 100 q8 -8 18 -10" fill="none" stroke="#fffaf0" stroke-width="3" stroke-linecap="round"/>
  <use href="#pingu-k" transform="translate(172 124) scale(0.75)"/>
  <!-- Blickstrich nach außen -->
  <path d="M160 108 l-40 -10" stroke="#5b9bd5" stroke-width="2" stroke-dasharray="4 4"/>
</svg>
