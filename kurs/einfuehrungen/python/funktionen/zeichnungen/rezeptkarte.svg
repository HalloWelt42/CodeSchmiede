<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin mit Kochmütze hält eine Rezeptkarte, daneben ein dampfender Topf">
  <ellipse cx="130" cy="170" rx="100" ry="7" fill="rgba(0,0,0,.15)"/>
  <!-- Topf -->
  <g stroke="#2b3442" stroke-width="2.5" stroke-linejoin="round">
    <path d="M150 112 h76 v40 q0 14 -14 14 h-48 q-14 0 -14 -14 Z" fill="#8a93a0"/>
    <rect x="144" y="104" width="88" height="10" rx="4" fill="#a7afba"/>
    <path d="M144 122 h-8 M232 122 h8" fill="none"/>
  </g>
  <g fill="none" stroke="#8a93a0" stroke-width="2.5" stroke-linecap="round">
    <path d="M172 96 q-6 -10 0 -20 q6 -10 0 -20"/><path d="M190 96 q-6 -10 0 -20 q6 -10 0 -20"/><path d="M208 96 q-6 -10 0 -20 q6 -10 0 -20"/>
  </g>
  <!-- Pinguin -->
  <g transform="translate(78 112)">
    <ellipse cx="0" cy="18" rx="26" ry="34" fill="#2b3442"/>
    <ellipse cx="0" cy="24" rx="17" ry="25" fill="#f4f1ea"/>
    <circle cx="0" cy="-22" r="19" fill="#2b3442"/>
    <circle cx="-6.5" cy="-25" r="4.5" fill="#fff"/><circle cx="6.5" cy="-25" r="4.5" fill="#fff"/>
    <circle cx="-5.5" cy="-24.5" r="2.2" fill="#111"/><circle cx="7.5" cy="-24.5" r="2.2" fill="#111"/>
    <path d="M-7 -15 h14 l-7 8 Z" fill="#f2a13b"/>
    <path d="M-8 52 h-8 M8 52 h8" stroke="#f2a13b" stroke-width="4" stroke-linecap="round"/>
    <!-- Kochmütze -->
    <g fill="#ffffff" stroke="#2b3442" stroke-width="2.2">
      <rect x="-14" y="-46" width="28" height="10" rx="2"/>
      <path d="M-14 -46 q-14 -4 -8 -18 q6 -10 16 -4 q4 -12 16 -6 q12 6 4 20 q4 4 0 8 Z"/>
    </g>
    <!-- Flügel mit Karte -->
    <path d="M22 4 q16 2 22 -10" fill="none" stroke="#2b3442" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- Rezeptkarte -->
  <g transform="rotate(-8 128 74)">
    <rect x="106" y="50" width="48" height="58" rx="3" fill="#fde7b0" stroke="#2b3442" stroke-width="2.2"/>
    <g stroke="#c38a55" stroke-width="2.2" stroke-linecap="round">
      <path d="M114 62 h32"/><path d="M114 72 h26"/><path d="M114 82 h30"/><path d="M114 92 h20"/>
    </g>
    <circle cx="146" cy="98" r="4" fill="#e2574c"/>
  </g>
</svg>
