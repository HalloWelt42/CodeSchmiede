<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Abreißkalender an der Wand, ein Pinguin zupft gerade ein Blatt ab">
  <ellipse cx="130" cy="168" rx="104" ry="7" fill="rgba(0,0,0,.12)"/>
  <!-- Nagel und Kalender -->
  <circle cx="150" cy="16" r="3.5" fill="#8a93a0" stroke="#2b3442" stroke-width="1.6"/>
  <g stroke="#2b3442" stroke-width="2.5" stroke-linejoin="round">
    <rect x="104" y="22" width="92" height="22" rx="4" fill="#e2574c"/>
    <rect x="108" y="44" width="84" height="96" fill="#fbf4e2"/>
  </g>
  <g fill="#fbf4e2" stroke="#2b3442" stroke-width="1.4">
    <rect x="108" y="140" width="84" height="4"/><rect x="108" y="144" width="84" height="3"/>
  </g>
  <!-- Blattinhalt: große Zahl als Balken, ohne Schrift -->
  <g fill="#2b3442">
    <rect x="128" y="62" width="10" height="44" rx="2"/>
    <path d="M146 62 h20 v10 h-10 v8 h10 v26 h-20 v-10 h10 v-6 h-10 Z"/>
  </g>
  <rect x="122" y="116" width="56" height="7" rx="3" fill="#c9443a"/>
  <!-- abgerissenes Blatt fliegt -->
  <g transform="rotate(-24 70 66)">
    <rect x="44" y="48" width="56" height="46" fill="#fbf4e2" stroke="#2b3442" stroke-width="2"/>
    <rect x="58" y="58" width="6" height="24" rx="2" fill="#2b3442"/><rect x="70" y="58" width="16" height="24" rx="2" fill="#2b3442" opacity=".85"/>
  </g>
  <!-- Pinguin -->
  <g transform="translate(212 124)">
    <ellipse cx="0" cy="10" rx="20" ry="28" fill="#2b3442"/>
    <ellipse cx="0" cy="15" rx="13" ry="20" fill="#f4f1ea"/>
    <circle cx="0" cy="-24" r="15" fill="#2b3442"/>
    <circle cx="-5" cy="-27" r="3.8" fill="#fff"/><circle cx="5" cy="-27" r="3.8" fill="#fff"/>
    <circle cx="-6.4" cy="-27" r="1.9" fill="#111"/><circle cx="3.6" cy="-27" r="1.9" fill="#111"/>
    <path d="M-6 -18 h12 l-6 7 Z" fill="#f2a13b"/>
    <path d="M-8 38 h-7 M8 38 h7" stroke="#f2a13b" stroke-width="4" stroke-linecap="round"/>
    <path d="M-17 -2 q-14 -6 -20 -18" fill="none" stroke="#2b3442" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
