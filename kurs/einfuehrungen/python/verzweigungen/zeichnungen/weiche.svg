<svg viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein kleiner Zug mit Pinguinen fährt auf eine Weiche zu, ein Gleis führt nach oben, eines geradeaus">
  <!-- Gleise: Schwellen -->
  <g stroke="#8a5a3c" stroke-width="5" stroke-linecap="round">
    <path d="M14 128 v14 M34 128 v14 M54 128 v14 M74 128 v14 M94 128 v14 M114 128 v14 M134 128 v14 M154 128 v14 M174 128 v14 M194 128 v14 M214 128 v14 M234 128 v14 M254 128 v14 M274 128 v14"/>
    <path d="M168 120 l10 12 M188 106 l10 12 M208 92 l10 12 M228 78 l10 12 M248 64 l10 12 M268 50 l10 12"/>
  </g>
  <!-- Schienen -->
  <g fill="none" stroke="#5e6774" stroke-width="3.5" stroke-linecap="round">
    <path d="M6 130 H294 M6 140 H294"/>
    <path d="M150 130 Q200 128 290 52 M150 140 Q206 136 296 60"/>
  </g>
  <!-- Weichenhebel mit Pfeil nach oben -->
  <g transform="translate(150 152)">
    <rect x="-10" y="-6" width="20" height="10" rx="2" fill="#4f8fd6" stroke="#2b3442" stroke-width="2"/>
    <path d="M0 -6 L10 -24" stroke="#2b3442" stroke-width="3" stroke-linecap="round"/>
    <circle cx="10" cy="-26" r="4" fill="#e5484d" stroke="#2b3442" stroke-width="1.6"/>
  </g>
  <path d="M232 40 l14 -10 l-2 14 Z" fill="#3fbf6f" stroke="#2b3442" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M206 64 Q218 54 238 40" fill="none" stroke="#3fbf6f" stroke-width="3" stroke-dasharray="5 4" stroke-linecap="round"/>
  <!-- Zug -->
  <g transform="translate(40 96)">
    <!-- Lok -->
    <rect x="58" y="0" width="44" height="30" rx="5" fill="#f2b84b" stroke="#2b3442" stroke-width="2.4"/>
    <rect x="86" y="-14" width="16" height="16" rx="2" fill="#e5484d" stroke="#2b3442" stroke-width="2.2"/>
    <rect x="64" y="6" width="14" height="10" rx="2" fill="#cfe9fb" stroke="#2b3442" stroke-width="1.8"/>
    <circle cx="70" cy="34" r="7" fill="#2b3442"/><circle cx="92" cy="34" r="7" fill="#2b3442"/>
    <!-- Wagen -->
    <rect x="0" y="6" width="50" height="24" rx="4" fill="#4f8fd6" stroke="#2b3442" stroke-width="2.4"/>
    <circle cx="12" cy="34" r="7" fill="#2b3442"/><circle cx="38" cy="34" r="7" fill="#2b3442"/>
    <path d="M50 18 h8" stroke="#2b3442" stroke-width="3"/>
    <!-- Pinguinköpfe im Wagen -->
    <g>
      <circle cx="13" cy="2" r="8" fill="#2b3442"/><ellipse cx="13" cy="4" rx="5" ry="5" fill="#f4f1ea"/>
      <circle cx="10.5" cy="1" r="1.3" fill="#111"/><circle cx="15.5" cy="1" r="1.3" fill="#111"/><path d="M11 4 h4 l-2 3 Z" fill="#f2a13b"/>
      <circle cx="35" cy="2" r="8" fill="#2b3442"/><ellipse cx="35" cy="4" rx="5" ry="5" fill="#f4f1ea"/>
      <circle cx="32.5" cy="1" r="1.3" fill="#111"/><circle cx="37.5" cy="1" r="1.3" fill="#111"/><path d="M33 4 h4 l-2 3 Z" fill="#f2a13b"/>
      <!-- Lokführer -->
      <circle cx="80" cy="-6" r="7" fill="#2b3442"/><ellipse cx="80" cy="-4" rx="4.4" ry="4.4" fill="#f4f1ea"/>
      <circle cx="78" cy="-7" r="1.2" fill="#111"/><circle cx="82" cy="-7" r="1.2" fill="#111"/><path d="M78.2 -4.5 h3.6 l-1.8 2.6 Z" fill="#f2a13b"/>
      <path d="M73 -12 h14 v-3 h-14 Z" fill="#4f8fd6" stroke="#2b3442" stroke-width="1.4"/>
    </g>
    <!-- Dampf -->
    <circle cx="96" cy="-24" r="6" fill="#e9edf2" opacity=".9"/><circle cx="106" cy="-34" r="8" fill="#e9edf2" opacity=".7"/><circle cx="120" cy="-40" r="10" fill="#e9edf2" opacity=".5"/>
  </g>
</svg>
