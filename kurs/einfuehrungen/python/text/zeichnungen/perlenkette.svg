<svg viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fünf Buchstabenperlen an einer Schnur mit den Platznummern 0 bis 4, eine Ente zählt sie ab">
  <!-- Schnur -->
  <path d="M14 70 Q150 92 286 70" fill="none" stroke="#8a5a3c" stroke-width="3" stroke-linecap="round"/>
  <!-- Perlen -->
  <g font-family="Barlow, system-ui, sans-serif" font-weight="700" text-anchor="middle">
    <g transform="translate(46 76)"><circle r="20" fill="#f2b84b" stroke="#2b3442" stroke-width="2.5"/><circle cx="-7" cy="-8" r="5" fill="#fff" opacity=".45"/><text y="8" font-size="22" fill="#2b3442">P</text></g>
    <g transform="translate(96 82)"><circle r="20" fill="#4f8fd6" stroke="#2b3442" stroke-width="2.5"/><circle cx="-7" cy="-8" r="5" fill="#fff" opacity=".45"/><text y="8" font-size="22" fill="#fff">i</text></g>
    <g transform="translate(146 84)"><circle r="20" fill="#3fbf6f" stroke="#2b3442" stroke-width="2.5"/><circle cx="-7" cy="-8" r="5" fill="#fff" opacity=".45"/><text y="8" font-size="22" fill="#fff">n</text></g>
    <g transform="translate(196 82)"><circle r="20" fill="#e5484d" stroke="#2b3442" stroke-width="2.5"/><circle cx="-7" cy="-8" r="5" fill="#fff" opacity=".45"/><text y="8" font-size="22" fill="#fff">g</text></g>
    <g transform="translate(246 76)"><circle r="20" fill="#9b7cf6" stroke="#2b3442" stroke-width="2.5"/><circle cx="-7" cy="-8" r="5" fill="#fff" opacity=".45"/><text y="8" font-size="22" fill="#fff">u</text></g>
    <!-- Platznummern -->
    <g font-family="'Chakra Petch', Barlow, monospace" font-size="15" fill="#8a93a0">
      <text x="46" y="118">0</text><text x="96" y="124">1</text><text x="146" y="126">2</text><text x="196" y="124">3</text><text x="246" y="118">4</text>
    </g>
  </g>
  <!-- Ente, die mit dem Schnabel auf die erste Perle zeigt -->
  <g transform="translate(40 140)">
    <ellipse cx="0" cy="14" rx="22" ry="4" fill="rgba(0,0,0,.15)"/>
    <ellipse cx="0" cy="2" rx="20" ry="12" fill="#fde047" stroke="#2b3442" stroke-width="2.2"/>
    <circle cx="14" cy="-12" r="9" fill="#fde047" stroke="#2b3442" stroke-width="2.2"/>
    <path d="M21 -14 L32 -20 L23 -8 Z" fill="#f2a13b" stroke="#2b3442" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="16" cy="-14" r="2" fill="#2b3442"/>
    <path d="M-10 -2 Q-2 6 8 0" fill="none" stroke="#2b3442" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <path d="M74 132 Q66 118 52 110" fill="none" stroke="#8a93a0" stroke-width="1.6" stroke-dasharray="3 4"/>
</svg>
