<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Drei Holzpuppen in Pinguingestalt, die große ist geöffnet, aus der mittleren schaut die kleinste heraus">
  <ellipse cx="130" cy="168" rx="112" ry="7" fill="rgba(0,0,0,.12)"/>
  <defs>
    <g id="matroschka-puppe">
      <path d="M0 -100 q24 0 26 26 q2 10 -6 18 q26 14 26 44 q0 12 -10 12 h-72 q-10 0 -10 -12 q0 -30 26 -44 q-8 -8 -6 -18 q2 -26 26 -26 Z"
            fill="#2b3442" stroke="#2b3442" stroke-width="2"/>
      <ellipse cx="0" cy="-30" rx="24" ry="26" fill="#f4f1ea"/>
      <circle cx="-8" cy="-78" r="5" fill="#fff"/><circle cx="8" cy="-78" r="5" fill="#fff"/>
      <circle cx="-6.6" cy="-77" r="2.4" fill="#111"/><circle cx="9.4" cy="-77" r="2.4" fill="#111"/>
      <path d="M-7 -68 h14 l-7 8 Z" fill="#f2a13b"/>
      <circle cx="-12" cy="-30" r="5" fill="#e2574c"/><circle cx="0" cy="-20" r="5" fill="#f2c14e"/><circle cx="12" cy="-30" r="5" fill="#5bb36a"/>
      <path d="M-14 -44 q14 8 28 0" fill="none" stroke="#e2574c" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>
  <!-- große Puppe, geöffnet: Unterteil und abgenommenes Oberteil -->
  <g transform="translate(56 160) scale(.9)">
    <use href="#matroschka-puppe"/>
  </g>
  <path d="M24 108 h64" stroke="#c38a55" stroke-width="3" stroke-dasharray="6 4"/>
  <!-- mittlere Puppe -->
  <g transform="translate(144 160) scale(.62)">
    <use href="#matroschka-puppe"/>
  </g>
  <!-- kleinste schaut oben heraus -->
  <g transform="translate(144 104) scale(.32)">
    <use href="#matroschka-puppe"/>
  </g>
  <!-- noch kleinere daneben -->
  <g transform="translate(214 160) scale(.36)">
    <use href="#matroschka-puppe"/>
  </g>
  <g transform="translate(240 160) scale(.2)">
    <use href="#matroschka-puppe"/>
  </g>
</svg>
