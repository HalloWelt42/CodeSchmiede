<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fünf Pinguine stehen der Größe nach in einer Reihe, einer wird gerade an seinen Platz geschoben">
  <ellipse cx="130" cy="166" rx="118" ry="7" fill="rgba(0,0,0,.12)"/>
  <defs>
    <g id="reihe-pinguin">
      <ellipse cx="0" cy="-26" rx="16" ry="22" fill="#2b3442"/>
      <ellipse cx="0" cy="-22" rx="10.5" ry="16" fill="#f4f1ea"/>
      <circle cx="0" cy="-54" r="12" fill="#2b3442"/>
      <circle cx="-4" cy="-56" r="3" fill="#fff"/><circle cx="4" cy="-56" r="3" fill="#fff"/>
      <circle cx="-3" cy="-55.5" r="1.5" fill="#111"/><circle cx="5" cy="-55.5" r="1.5" fill="#111"/>
      <path d="M-5 -50 h10 l-5 6 Z" fill="#f2a13b"/>
      <path d="M-6 -3 h-5 M6 -3 h5" stroke="#f2a13b" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>
  <!-- sortierte Reihe -->
  <use href="#reihe-pinguin" transform="translate(30 162) scale(.62)"/>
  <use href="#reihe-pinguin" transform="translate(64 162) scale(.76)"/>
  <use href="#reihe-pinguin" transform="translate(104 162) scale(.9)"/>
  <use href="#reihe-pinguin" transform="translate(206 162) scale(1.18)"/>
  <!-- Lücke und geschobener Pinguin -->
  <rect x="134" y="156" width="40" height="4" rx="2" fill="#7aa6c2" opacity=".6"/>
  <use href="#reihe-pinguin" transform="translate(160 132) rotate(-8) scale(1.04)"/>
  <path d="M190 108 q-14 -14 -30 -10" fill="none" stroke="#2b3442" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
  <path d="M160 98 l7 -3 l-2 7" fill="none" stroke="#2b3442" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Größenleiste -->
  <path d="M14 20 h230" stroke="#b8cad6" stroke-width="2"/>
  <g fill="#b8cad6"><circle cx="30" cy="20" r="3"/><circle cx="64" cy="20" r="4"/><circle cx="104" cy="20" r="5"/><circle cx="154" cy="20" r="6"/><circle cx="206" cy="20" r="7"/></g>
</svg>
