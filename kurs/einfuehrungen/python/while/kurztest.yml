# Kurztest zu Kapitel 8: eigene Fragen und eine Übung, die alles aus dem Kapitel braucht.
fragen:
  - frageart: auswahl
    id: kt-letzter-wert
    text: Was gibt das Programm aus?
    code: |
      x = 1
      while x < 20:
          x *= 3
      print(x)
    optionen:
      - text: '27'
        richtig: true
        erklaerung: Richtig. 1, 3, 9, 27; bei 27 ist x < 20 falsch, und 27 wird ausgegeben.
      - text: '9'
        erklaerung: Bei 9 ist x < 20 noch wahr, also wird noch einmal verdreifacht.
      - text: '20'
        erklaerung: x wächst in Dreierschritten mal 3, die 20 wird nie genau getroffen.
    als_code: true
  - frageart: luecke
    id: kt-continue
    text: Ergänze das Wort, das den Rest dieses Durchlaufs überspringt.
    code: |
      while n < 5:
          n += 1
          if n == 3:
              ___
          print(n)
    antworten: [["continue"]]
    erklaerung: Richtig, continue springt zur nächsten Runde.
    hinweis: Das englische Wort für "weitermachen".
  - frageart: fehlerstelle
    id: kt-falscher-start
    text: Die Summe von 1 bis 3 soll 6 ergeben, heraus kommt 5. Welche Zeile?
    code: |
      summe = 0
      i = 2
      while i <= 3:
          summe += i
          i += 1
      print(summe)
    zeile: 2
    erklaerung: Genau, der Zähler beginnt bei 2 statt bei 1; die 1 fehlt in der Summe.
    hinweis: Welche Zahl wird nie zur Summe gezählt?
  - frageart: auswahl
    id: kt-break
    text: Was macht `break` in einer Schleife?
    optionen:
      - text: Es verlässt die Schleife sofort.
        richtig: true
        erklaerung: Richtig, danach geht es hinter der Schleife weiter.
      - text: Es überspringt nur den Rest dieses Durchlaufs.
        erklaerung: Das macht continue.
      - text: Es beendet das ganze Programm.
        erklaerung: Nur die Schleife endet; der Code dahinter läuft weiter.
uebung: k088-ziffernsumme
