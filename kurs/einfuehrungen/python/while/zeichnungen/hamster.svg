<svg viewBox="0 0 280 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Hamster rennt im Laufrad und schielt auf einen Wecker, der gleich klingelt">
  <ellipse cx="120" cy="170" rx="96" ry="7" fill="rgba(0,0,0,.15)"/>
  <!-- Ständer -->
  <path d="M120 88 L84 166 M120 88 L156 166" stroke="#8a93a0" stroke-width="6" stroke-linecap="round"/>
  <!-- Laufrad -->
  <circle cx="120" cy="88" r="72" fill="none" stroke="#4f8fd6" stroke-width="7"/>
  <circle cx="120" cy="88" r="62" fill="none" stroke="#4f8fd6" stroke-width="3"/>
  <g stroke="#4f8fd6" stroke-width="2.5">
    <path d="M120 16 V26 M120 150 V160 M48 88 H58 M182 88 H192 M69 37 L76 44 M164 132 L171 139 M69 139 L76 132 M164 44 L171 37"/>
  </g>
  <circle cx="120" cy="88" r="7" fill="#2b3442"/>
  <!-- Bewegungsstriche -->
  <g stroke="#cfd6de" stroke-width="3" stroke-linecap="round"><path d="M70 120 h-14 M74 132 h-18 M80 144 h-12"/></g>
  <!-- Hamster -->
  <g transform="translate(122 128)">
    <ellipse cx="0" cy="0" rx="30" ry="20" fill="#e8a96a" stroke="#2b3442" stroke-width="2.5"/>
    <ellipse cx="4" cy="6" rx="18" ry="11" fill="#fbe3c4"/>
    <circle cx="26" cy="-10" r="15" fill="#e8a96a" stroke="#2b3442" stroke-width="2.5"/>
    <circle cx="20" cy="-24" r="6" fill="#e8a96a" stroke="#2b3442" stroke-width="2.2"/>
    <circle cx="20" cy="-24" r="3" fill="#ff9aa2"/>
    <circle cx="33" cy="-14" r="3.2" fill="#2b3442"/><circle cx="34.2" cy="-15.2" r="1.1" fill="#fff"/>
    <circle cx="41" cy="-8" r="2.6" fill="#e5484d"/>
    <ellipse cx="30" cy="-4" rx="4" ry="2.6" fill="#ff9aa2" opacity=".7"/>
    <path d="M-12 18 l-6 6 M4 18 l6 6 M-26 4 q-8 4 -10 -2" stroke="#2b3442" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Wecker -->
  <g transform="translate(232 70)">
    <path d="M-20 -20 l-8 -8 M20 -20 l8 -8" stroke="#2b3442" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-16" cy="-24" r="8" fill="#f2b84b" stroke="#2b3442" stroke-width="2.2"/>
    <circle cx="16" cy="-24" r="8" fill="#f2b84b" stroke="#2b3442" stroke-width="2.2"/>
    <circle r="24" fill="#e5484d" stroke="#2b3442" stroke-width="2.5"/>
    <circle r="18" fill="#fffaf0" stroke="#2b3442" stroke-width="2"/>
    <path d="M0 0 V-12 M0 0 L9 5" stroke="#2b3442" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-12 22 l-6 8 M12 22 l6 8" stroke="#2b3442" stroke-width="3" stroke-linecap="round"/>
    <g stroke="#f2b84b" stroke-width="2.5" stroke-linecap="round"><path d="M-34 -6 l-8 -2 M34 -6 l8 -2 M-32 10 l-8 3 M32 10 l8 3"/></g>
  </g>
</svg>
