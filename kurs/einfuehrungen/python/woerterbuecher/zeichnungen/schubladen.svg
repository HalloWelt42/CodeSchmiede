<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Schubladenschrank mit Etiketten, eine Schublade steht offen, darin sitzt ein kleiner Pinguin">
  <ellipse cx="130" cy="170" rx="96" ry="7" fill="rgba(0,0,0,.15)"/>
  <!-- Schrank -->
  <rect x="50" y="20" width="160" height="146" rx="8" fill="#c38a55" stroke="#2b3442" stroke-width="2.5"/>
  <rect x="58" y="28" width="144" height="130" rx="4" fill="#a8743f"/>
  <!-- Schubladen -->
  <g stroke="#2b3442" stroke-width="2">
    <rect x="64" y="34" width="132" height="34" rx="4" fill="#d9a066"/>
    <rect x="64" y="118" width="132" height="34" rx="4" fill="#d9a066"/>
  </g>
  <!-- offene Schublade -->
  <g>
    <rect x="64" y="76" width="132" height="34" rx="4" fill="#5e3f22" stroke="#2b3442" stroke-width="2"/>
    <path d="M58 78 L36 92 L36 122 L204 122 L224 108 L224 92 Z" fill="#d9a066" stroke="#2b3442" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M36 92 L204 92 L224 78" fill="none" stroke="#2b3442" stroke-width="2"/>
    <rect x="36" y="92" width="168" height="30" fill="#e8b67c" stroke="#2b3442" stroke-width="2.2"/>
  </g>
  <!-- Pinguin in der Schublade -->
  <g transform="translate(120 76)">
    <ellipse cx="0" cy="8" rx="11" ry="14" fill="#2b3442"/><ellipse cx="0" cy="11" rx="7" ry="9.5" fill="#f4f1ea"/>
    <circle cx="0" cy="-9" r="8.5" fill="#2b3442"/>
    <circle cx="-2.9" cy="-10.5" r="2" fill="#fff"/><circle cx="2.9" cy="-10.5" r="2" fill="#fff"/>
    <circle cx="-2.5" cy="-10.2" r="1" fill="#111"/><circle cx="3.3" cy="-10.2" r="1" fill="#111"/>
    <path d="M-3.2 -6 h6.4 l-3.2 4 Z" fill="#f2a13b"/>
    <path d="M-11 4 q-8 -2 -10 -10" stroke="#2b3442" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Etikettenrahmen und Griffe -->
  <g stroke="#2b3442" stroke-width="2">
    <rect x="104" y="40" width="52" height="14" rx="2" fill="#fde7b0"/>
    <rect x="104" y="124" width="52" height="14" rx="2" fill="#fde7b0"/>
    <rect x="94" y="100" width="72" height="14" rx="2" fill="#fde7b0"/>
  </g>
  <g fill="#8a93a0" stroke="#2b3442" stroke-width="1.6">
    <rect x="118" y="58" width="24" height="5" rx="2"/><rect x="118" y="142" width="24" height="5" rx="2"/>
  </g>
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#2b3442" text-anchor="middle">
    <text x="130" y="51">"Pit"</text><text x="130" y="111">"Pia"</text><text x="130" y="135">"Paul"</text>
  </g>
</svg>
