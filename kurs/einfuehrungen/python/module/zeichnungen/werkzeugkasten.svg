<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin öffnet einen großen Werkzeugkasten mit vielen Fächern und hält einen Schraubenschlüssel hoch">
  <ellipse cx="130" cy="168" rx="104" ry="7" fill="rgba(0,0,0,.15)"/>
  <!-- Kasten -->
  <g stroke="#2b3442" stroke-width="2.5" stroke-linejoin="round">
    <path d="M92 104 h140 v54 q0 6 -6 6 h-128 q-6 0 -6 -6 Z" fill="#e2574c"/>
    <path d="M92 104 l14 -18 h112 l14 18 Z" fill="#c9443a"/>
    <!-- aufgeklappte Fächer -->
    <path d="M104 86 l-12 -30 h56 l8 30" fill="#f08b80"/>
    <path d="M168 86 l8 -30 h56 l-12 30" fill="#f08b80"/>
  </g>
  <rect x="146" y="92" width="32" height="8" rx="3" fill="#8a93a0" stroke="#2b3442" stroke-width="2"/>
  <!-- Werkzeuge in den Fächern -->
  <g stroke="#2b3442" stroke-width="2" stroke-linecap="round">
    <path d="M110 74 l26 -10" stroke="#8a93a0" stroke-width="5"/>
    <circle cx="200" cy="68" r="6" fill="#f2c14e"/><circle cx="214" cy="70" r="5" fill="#5bb36a"/>
    <path d="M186 74 l6 -12" stroke="#c38a55" stroke-width="5"/>
  </g>
  <path d="M100 130 h124" stroke="#2b3442" stroke-width="2" opacity=".35"/>
  <!-- Pinguin -->
  <g transform="translate(52 118)">
    <ellipse cx="0" cy="12" rx="22" ry="30" fill="#2b3442"/>
    <ellipse cx="0" cy="17" rx="14" ry="22" fill="#f4f1ea"/>
    <circle cx="0" cy="-24" r="16" fill="#2b3442"/>
    <circle cx="-5.5" cy="-27" r="4" fill="#fff"/><circle cx="5.5" cy="-27" r="4" fill="#fff"/>
    <circle cx="-4.4" cy="-27" r="2" fill="#111"/><circle cx="6.6" cy="-27" r="2" fill="#111"/>
    <path d="M-6 -18 h12 l-6 7 Z" fill="#f2a13b"/>
    <path d="M-8 42 h-7 M8 42 h7" stroke="#f2a13b" stroke-width="4" stroke-linecap="round"/>
    <path d="M18 0 q14 -14 14 -34" fill="none" stroke="#2b3442" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- Schraubenschlüssel -->
  <g transform="rotate(-20 86 60)" stroke="#2b3442" stroke-width="2">
    <rect x="82" y="56" width="8" height="34" rx="3" fill="#a7afba"/>
    <path d="M76 56 q10 -16 20 0 l-5 2 q-5 -8 -10 0 Z" fill="#a7afba"/>
  </g>
</svg>
