<svg viewBox="0 0 280 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Eine Verwandlungsmaschine: oben fällt ein Zettel hinein, unten kommt ein Holzklotz heraus">
  <ellipse cx="140" cy="168" rx="110" ry="7" fill="rgba(0,0,0,.15)"/>
  <!-- Zettel, der hineinfällt -->
  <g transform="translate(62 18) rotate(-12)">
    <rect x="-22" y="-14" width="44" height="30" rx="2" fill="#fbf7ea" stroke="#2b3442" stroke-width="2"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Chakra Petch', Barlow, monospace" font-weight="700" font-size="17" fill="#4f8fd6">"42"</text>
  </g>
  <path d="M84 30 Q100 36 108 48" fill="none" stroke="#8a93a0" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round"/>
  <!-- Trichter -->
  <path d="M100 46 L148 46 L134 66 L114 66 Z" fill="#9b7cf6" stroke="#2b3442" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Gehäuse -->
  <rect x="84" y="64" width="112" height="78" rx="12" fill="#f2b84b" stroke="#2b3442" stroke-width="2.5"/>
  <rect x="96" y="76" width="54" height="32" rx="5" fill="#2b3442"/>
  <path d="M102 98 l10 -12 l10 8 l10 -14 l10 10" fill="none" stroke="#3fbf6f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="170" cy="84" r="9" fill="#e5484d" stroke="#2b3442" stroke-width="2"/>
  <circle cx="170" cy="84" r="3.5" fill="#ffb3b5"/>
  <rect x="160" y="100" width="22" height="8" rx="4" fill="#4f8fd6" stroke="#2b3442" stroke-width="2"/>
  <!-- Zahnräder -->
  <g transform="translate(206 70)">
    <circle r="15" fill="#8a93a0" stroke="#2b3442" stroke-width="2.2"/>
    <g stroke="#2b3442" stroke-width="5" stroke-linecap="round">
      <path d="M0 -20 V-15 M0 15 V20 M-20 0 H-15 M15 0 H20 M-14 -14 L-11 -11 M11 11 L14 14 M-14 14 L-11 11 M11 -11 L14 -14"/>
    </g>
    <circle r="5" fill="#2b3442"/>
  </g>
  <!-- Ausgabeschacht -->
  <rect x="104" y="140" width="40" height="10" rx="3" fill="#2b3442"/>
  <!-- Holzklotz mit 42 Kerben angedeutet -->
  <g transform="translate(192 146)">
    <path d="M-30 -8 L22 -8 L30 -16 L-22 -16 Z" fill="#e8b67c" stroke="#2b3442" stroke-width="2" stroke-linejoin="round"/>
    <rect x="-30" y="-8" width="52" height="24" fill="#d9a066" stroke="#2b3442" stroke-width="2"/>
    <path d="M22 -8 L30 -16 L30 8 L22 16 Z" fill="#c38a55" stroke="#2b3442" stroke-width="2" stroke-linejoin="round"/>
    <text x="-4" y="10" text-anchor="middle" font-family="'Chakra Petch', Barlow, monospace" font-weight="700" font-size="16" fill="#2b3442">42</text>
  </g>
  <path d="M146 148 Q156 150 160 148" fill="none" stroke="#8a93a0" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round"/>
  <!-- Funken -->
  <g stroke="#f2b84b" stroke-width="2.5" stroke-linecap="round">
    <path d="M80 70 l-10 -4 M78 82 l-11 2 M80 94 l-9 6"/>
  </g>
</svg>
