    <path d="M120 72 v12"/><path d="M134 66 v14"/><path d="M148 72 v12"/>
  </g>
  <!-- Pinguin im Fall -->
  <g transform="translate(134 112) rotate(14)">
    <ellipse cx="0" cy="6" rx="15" ry="19" fill="#2b3442"/>
    <ellipse cx="0" cy="9" rx="10" ry="14" fill="#f4f1ea"/>
    <circle cx="0" cy="-17" r="11" fill="#2b3442"/>
    <path d="M-6 -20 q2 -3 4 0 M2 -20 q2 -3 4 0" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M-4 -12 h8 l-4 5 Z" fill="#f2a13b"/>
    <path d="M-14 -2 q-14 -10 -12 -24 M14 -2 q14 -10 12 -24" stroke="#2b3442" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M-6 25 h-6 M6 25 h6" stroke="#f2a13b" stroke-width="3.5" stroke-linecap="round"/>
  </g>
