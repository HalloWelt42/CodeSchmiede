<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin fällt vom Trapez in ein gespanntes Sicherheitsnetz und lacht">
  <!-- Pfosten -->
  <g stroke="#2b3442" stroke-width="2.5">
    <path d="M24 170 V20" /><path d="M236 170 V20"/>
    <path d="M24 20 h212" stroke-width="2"/>
  </g>
  <!-- Trapez -->
  <g stroke="#2b3442" stroke-width="2" fill="none">
    <path d="M70 20 L82 64 M110 20 L98 64"/>
  </g>
  <rect x="78" y="62" width="24" height="5" rx="2" fill="#c38a55" stroke="#2b3442" stroke-width="1.8"/>
  <!-- Netz -->
  <path d="M24 128 Q130 170 236 128" fill="none" stroke="#2b3442" stroke-width="2.5"/>
  <g stroke="#7a8794" stroke-width="1.4" fill="none">
    <path d="M24 128 Q130 150 236 128"/>
    <path d="M50 134 l14 -10 M80 140 l14 -12 M110 144 l14 -12 M140 144 l14 -12 M170 140 l14 -10 M200 134 l14 -8"/>
    <path d="M50 124 l14 12 M80 126 l14 14 M110 128 l14 16 M140 128 l14 16 M170 126 l14 14 M200 124 l14 10"/>
  </g>
