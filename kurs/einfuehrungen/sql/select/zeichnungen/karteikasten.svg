<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Karteikasten aus Holz, ein Pinguin zieht eine Karteikarte heraus">
  <ellipse cx="130" cy="168" rx="108" ry="7" fill="rgba(0,0,0,.12)"/>
  <!-- Karten im Kasten -->
  <g stroke="#2b3442" stroke-width="1.6">
    <rect x="96" y="66" width="104" height="44" rx="3" fill="#fbf4e2"/>
    <rect x="100" y="76" width="104" height="40" rx="3" fill="#fbf4e2"/>
    <rect x="104" y="86" width="104" height="36" rx="3" fill="#fbf4e2"/>
  </g>
  <g stroke="#c9b48a" stroke-width="1.6"><path d="M108 74 h40"/><path d="M112 84 h52"/><path d="M116 94 h34"/></g>
  <!-- Kasten -->
  <g stroke="#2b3442" stroke-width="2.5" stroke-linejoin="round">
    <path d="M84 100 h136 l-8 60 h-120 Z" fill="#c38a55"/>
    <path d="M84 100 h136" fill="none"/>
  </g>
  <rect x="140" y="124" width="24" height="10" rx="3" fill="#8a93a0" stroke="#2b3442" stroke-width="1.8"/>
  <!-- herausgezogene Karte mit Pinguin-Bildchen -->
  <g transform="rotate(-12 70 64)">
    <rect x="34" y="40" width="76" height="50" rx="4" fill="#ffffff" stroke="#2b3442" stroke-width="2"/>
    <ellipse cx="50" cy="70" rx="7" ry="10" fill="#2b3442"/><ellipse cx="50" cy="72" rx="4.5" ry="7" fill="#f4f1ea"/>
    <circle cx="50" cy="57" r="5" fill="#2b3442"/><path d="M48 58 h4 l-2 3 Z" fill="#f2a13b"/>
    <g stroke="#7aa6c2" stroke-width="2" stroke-linecap="round"><path d="M64 54 h36"/><path d="M64 64 h30"/><path d="M64 74 h36"/><path d="M64 84 h20"/></g>
  </g>
  <!-- Pinguin -->
  <g transform="translate(232 126)">
    <ellipse cx="0" cy="10" rx="18" ry="26" fill="#2b3442"/>
    <ellipse cx="0" cy="15" rx="12" ry="19" fill="#f4f1ea"/>
    <circle cx="0" cy="-22" r="14" fill="#2b3442"/>
    <circle cx="-4.6" cy="-25" r="3.6" fill="#fff"/><circle cx="4.6" cy="-25" r="3.6" fill="#fff"/>
    <circle cx="-6" cy="-25" r="1.8" fill="#111"/><circle cx="3.2" cy="-25" r="1.8" fill="#111"/>
    <path d="M-6 -17 h12 l-6 7 Z" fill="#f2a13b"/>
    <path d="M-8 36 h-7 M8 36 h7" stroke="#f2a13b" stroke-width="4" stroke-linecap="round"/>
    <path d="M-16 -4 q-12 -6 -20 -20" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
