<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin hält eine Schablone mit Löchern über eine Reihe Namensschilder">
  <ellipse cx="130" cy="170" rx="110" ry="6" fill="rgba(0,0,0,.12)"/>
  <!-- Namensschilder -->
  <g stroke="#2b3442" stroke-width="1.8" font-family="sans-serif" font-size="13" font-weight="700" fill="#2b3442">
    <rect x="18" y="126" width="56" height="26" rx="3" fill="#fbf4e2"/>
    <rect x="80" y="126" width="56" height="26" rx="3" fill="#fbf4e2"/>
    <rect x="142" y="126" width="56" height="26" rx="3" fill="#fbf4e2"/>
  </g>
  <g font-family="sans-serif" font-size="13" font-weight="700" fill="#2b3442" stroke="none" text-anchor="middle">
    <text x="46" y="144">Paul</text>
    <text x="108" y="144">Pia</text>
    <text x="170" y="144">Pablo</text>
  </g>
  <g fill="#3f9b5a"><circle cx="46" cy="118" r="4"/><circle cx="170" cy="118" r="4"/></g>
  <path d="M104 114 l8 8 M112 114 l-8 8" stroke="#e2574c" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Schablone -->
  <g transform="rotate(-6 96 64)">
    <rect x="52" y="44" width="92" height="40" rx="4" fill="#7aa6c2" stroke="#2b3442" stroke-width="2.4"/>
    <text x="72" y="70" font-family="sans-serif" font-size="17" font-weight="700" fill="#2b3442" text-anchor="middle">Pa</text>
    <rect x="88" y="52" width="48" height="24" rx="2" fill="#eef3f7" stroke="#2b3442" stroke-width="1.8" stroke-dasharray="4 3"/>
    <text x="112" y="70" font-family="sans-serif" font-size="17" font-weight="700" fill="#2b3442" text-anchor="middle">%</text>
  </g>
  <!-- Pinguin -->
  <g transform="translate(222 120)">
    <ellipse cx="0" cy="12" rx="18" ry="25" fill="#2b3442"/>
    <ellipse cx="0" cy="16" rx="12" ry="18" fill="#f4f1ea"/>
    <circle cx="0" cy="-20" r="13" fill="#2b3442"/>
    <circle cx="-5" cy="-22" r="3.2" fill="#fff"/><circle cx="4" cy="-22" r="3.2" fill="#fff"/>
    <circle cx="-6" cy="-22" r="1.6" fill="#111"/><circle cx="3" cy="-22" r="1.6" fill="#111"/>
    <path d="M-12 -16 l-8 3 l8 3 Z" fill="#f2a13b"/>
    <path d="M-7 37 h-7 M7 37 h7" stroke="#f2a13b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-16 0 q-30 -20 -64 -46" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
