<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Sieb, durch das nur passende Karteikarten fallen, darunter ein Pinguin mit Korb">
  <ellipse cx="130" cy="170" rx="104" ry="6" fill="rgba(0,0,0,.12)"/>
  <!-- Karten oben, eine bleibt liegen -->
  <g stroke="#2b3442" stroke-width="1.8">
    <rect x="70" y="18" width="34" height="24" rx="2" fill="#fbf4e2" transform="rotate(-10 87 30)"/>
    <rect x="150" y="14" width="34" height="24" rx="2" fill="#fbf4e2" transform="rotate(8 167 26)"/>
  </g>
  <g fill="#7aa6c2"><rect x="76" y="24" width="10" height="6" rx="1" transform="rotate(-10 87 30)"/></g>
  <g fill="#e2574c"><rect x="156" y="20" width="10" height="6" rx="1" transform="rotate(8 167 26)"/></g>
  <!-- Sieb -->
  <path d="M50 56 h160 q-10 40 -80 44 q-70 -4 -80 -44 Z" fill="#a7afba" stroke="#2b3442" stroke-width="2.5" stroke-linejoin="round"/>
  <g stroke="#2b3442" stroke-width="1" opacity=".5">
    <path d="M70 62 l20 34 M90 60 l20 38 M110 60 l20 40 M130 60 l20 40 M150 60 l20 36 M170 60 l16 26"/>
    <path d="M190 62 l-20 34 M170 60 l-20 38 M150 60 l-20 40 M130 60 l-20 40 M110 60 l-20 36 M90 60 l-16 26"/>
  </g>
  <path d="M210 60 h30" stroke="#2b3442" stroke-width="5" stroke-linecap="round"/>
  <!-- rote Karte bleibt im Sieb -->
  <rect x="146" y="64" width="30" height="20" rx="2" fill="#fbf4e2" stroke="#2b3442" stroke-width="1.6" transform="rotate(14 161 74)"/>
  <rect x="151" y="69" width="9" height="5" rx="1" fill="#e2574c" transform="rotate(14 161 74)"/>
  <!-- blaue Karte fällt -->
  <rect x="104" y="108" width="30" height="20" rx="2" fill="#fbf4e2" stroke="#2b3442" stroke-width="1.6" transform="rotate(-6 119 118)"/>
  <rect x="109" y="113" width="9" height="5" rx="1" fill="#7aa6c2" transform="rotate(-6 119 118)"/>
  <g stroke="#2b3442" stroke-width="1.6" stroke-linecap="round" opacity=".6"><path d="M108 104 v-6 M120 102 v-6 M132 104 v-6"/></g>
  <!-- Korb und Pinguin -->
  <path d="M96 140 h50 l-6 26 h-38 Z" fill="#c38a55" stroke="#2b3442" stroke-width="2.2" stroke-linejoin="round"/>
  <g transform="translate(188 138)">
    <ellipse cx="0" cy="8" rx="16" ry="22" fill="#2b3442"/>
    <ellipse cx="0" cy="12" rx="10.5" ry="16" fill="#f4f1ea"/>
    <circle cx="0" cy="-20" r="12" fill="#2b3442"/>
    <circle cx="-4" cy="-22" r="3" fill="#fff"/><circle cx="4" cy="-22" r="3" fill="#fff"/>
    <circle cx="-5" cy="-23" r="1.5" fill="#111"/><circle cx="3" cy="-23" r="1.5" fill="#111"/>
    <path d="M-5 -16 h10 l-5 6 Z" fill="#f2a13b"/>
    <path d="M-7 30 h-6 M7 30 h6" stroke="#f2a13b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-14 0 q-14 2 -22 8" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
