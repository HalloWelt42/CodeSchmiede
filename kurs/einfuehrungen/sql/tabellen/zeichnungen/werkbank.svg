<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin mit Hammer baut einen neuen Karteikasten, daneben liegen leere Karten mit vorgedruckten Feldern">
  <ellipse cx="130" cy="170" rx="112" ry="6" fill="rgba(0,0,0,.12)"/>
  <!-- Kasten im Bau: Boden und zwei Wände -->
  <path d="M30 150 h100 l-6 16 h-88 Z" fill="#c38a55" stroke="#2b3442" stroke-width="2.2" stroke-linejoin="round"/>
  <rect x="30" y="112" width="10" height="38" fill="#d9a774" stroke="#2b3442" stroke-width="2"/>
  <rect x="120" y="120" width="10" height="30" fill="#d9a774" stroke="#2b3442" stroke-width="2" transform="rotate(8 125 135)"/>
  <g fill="#2b3442"><circle cx="35" cy="146" r="1.6"/><circle cx="125" cy="146" r="1.6"/></g>
  <!-- leere Karten mit vorgedruckten Feldern -->
  <g transform="rotate(-8 74 70)">
    <rect x="40" y="46" width="70" height="46" rx="3" fill="#fffaf0" stroke="#2b3442" stroke-width="2"/>
    <path d="M40 58 h70" stroke="#e2574c" stroke-width="1.4"/>
    <g stroke="#a7afba" stroke-width="1.6" stroke-dasharray="3 3"><path d="M48 70 h54 M48 82 h40"/></g>
  </g>
  <g transform="rotate(6 98 60)">
    <rect x="74" y="36" width="56" height="36" rx="3" fill="#fbf4e2" stroke="#2b3442" stroke-width="1.8"/>
    <g stroke="#a7afba" stroke-width="1.6" stroke-dasharray="3 3"><path d="M80 50 h42 M80 60 h30"/></g>
  </g>
  <!-- Nägel -->
  <g stroke="#2b3442" stroke-width="2" stroke-linecap="round"><path d="M150 160 l6 -2 M156 164 l5 -4"/></g>
  <!-- Pinguin mit Hammer -->
  <g transform="translate(206 124)">
    <ellipse cx="0" cy="10" rx="19" ry="27" fill="#2b3442"/>
    <ellipse cx="0" cy="14" rx="12.5" ry="19" fill="#f4f1ea"/>
    <circle cx="0" cy="-24" r="14" fill="#2b3442"/>
    <circle cx="-5" cy="-26" r="3.4" fill="#fff"/><circle cx="5" cy="-26" r="3.4" fill="#fff"/>
    <circle cx="-6" cy="-25" r="1.7" fill="#111"/><circle cx="4" cy="-25" r="1.7" fill="#111"/>
    <path d="M-12 -20 l-9 3 l9 3 Z" fill="#f2a13b"/>
    <path d="M-8 37 h-7 M8 37 h7" stroke="#f2a13b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-17 -2 q-14 -14 -22 -30" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
    <g transform="rotate(-30 -40 -36)">
      <rect x="-42" y="-62" width="5" height="30" rx="1.5" fill="#a8733f" stroke="#2b3442" stroke-width="1.4"/>
      <rect x="-50" y="-68" width="22" height="9" rx="2" fill="#a7afba" stroke="#2b3442" stroke-width="1.6"/>
    </g>
  </g>
</svg>
