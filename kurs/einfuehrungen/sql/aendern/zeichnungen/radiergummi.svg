<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin mit Radiergummi und Bleistift korrigiert ein Feld auf einer Karteikarte">
  <ellipse cx="130" cy="170" rx="110" ry="6" fill="rgba(0,0,0,.12)"/>
  <!-- Karteikarte -->
  <g transform="rotate(-3 90 100)">
    <rect x="20" y="52" width="132" height="94" rx="4" fill="#fbf4e2" stroke="#2b3442" stroke-width="2.4"/>
    <path d="M20 70 h132" stroke="#e2574c" stroke-width="1.6"/>
    <circle cx="40" cy="96" r="10" fill="#2b3442"/><circle cx="40" cy="98" r="6.5" fill="#f4f1ea"/>
    <g fill="#a7afba"><rect x="58" y="82" width="70" height="7" rx="2"/><rect x="58" y="98" width="50" height="7" rx="2"/></g>
    <!-- radiertes Feld mit neuem Eintrag -->
    <rect x="56" y="112" width="80" height="16" rx="2" fill="#fff" stroke="#f2a13b" stroke-width="1.8" stroke-dasharray="4 3"/>
    <path d="M62 120 q6 -6 12 0 t12 0 t12 0" fill="none" stroke="#7aa6c2" stroke-width="2.6" stroke-linecap="round"/>
    <!-- Krümel -->
    <g fill="#e8a0a0"><circle cx="142" cy="134" r="1.6"/><circle cx="146" cy="128" r="1.2"/><circle cx="138" cy="139" r="1.3"/></g>
  </g>
  <!-- Radiergummi -->
  <g transform="rotate(20 160 46)">
    <rect x="144" y="36" width="34" height="18" rx="3" fill="#e8a0a0" stroke="#2b3442" stroke-width="2"/>
    <rect x="144" y="36" width="12" height="18" rx="2" fill="#7aa6c2" stroke="#2b3442" stroke-width="2"/>
  </g>
  <!-- Pinguin mit Bleistift -->
  <g transform="translate(206 126)">
    <ellipse cx="0" cy="10" rx="19" ry="27" fill="#2b3442"/>
    <ellipse cx="0" cy="14" rx="12.5" ry="19" fill="#f4f1ea"/>
    <circle cx="0" cy="-24" r="14" fill="#2b3442"/>
    <circle cx="-5" cy="-26" r="3.4" fill="#fff"/><circle cx="5" cy="-26" r="3.4" fill="#fff"/>
    <circle cx="-6" cy="-25" r="1.7" fill="#111"/><circle cx="4" cy="-25" r="1.7" fill="#111"/>
    <path d="M-12 -20 l-9 3 l9 3 Z" fill="#f2a13b"/>
    <path d="M-8 37 h-7 M8 37 h7" stroke="#f2a13b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-17 0 q-26 6 -48 2" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
    <g transform="rotate(-25 -70 2)">
      <rect x="-96" y="-2" width="30" height="7" fill="#f2c94c" stroke="#2b3442" stroke-width="1.6"/>
      <path d="M-96 -2 l-8 3.5 l8 3.5 Z" fill="#fbf4e2" stroke="#2b3442" stroke-width="1.4"/>
    </g>
  </g>
</svg>
