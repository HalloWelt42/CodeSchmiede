  <!-- Iglu -->
  <path d="M30 166 v-50 a58 58 0 0 1 116 0 v50 Z" fill="#eef3f7" stroke="#2b3442" stroke-width="2.5" stroke-linejoin="round"/>
  <g stroke="#2b3442" stroke-width="1.2" opacity=".45" fill="none">
    <path d="M36 92 h104 M31 116 h114 M30 140 h116"/>
    <path d="M62 66 v26 M100 60 v32 M48 92 v24 M86 92 v24 M124 92 v24 M66 116 v24 M108 116 v24"/>
  </g>
  <path d="M68 166 v-26 a20 20 0 0 1 40 0 v26 Z" fill="#2b3442"/>
  <!-- Pinguin mit Klemmbrett -->
  <g transform="translate(190 128)">
    <ellipse cx="0" cy="10" rx="20" ry="28" fill="#2b3442"/>
    <ellipse cx="0" cy="14" rx="13" ry="20" fill="#f4f1ea"/>
    <circle cx="0" cy="-26" r="15" fill="#2b3442"/>
    <circle cx="-5" cy="-28" r="3.6" fill="#fff"/><circle cx="5" cy="-28" r="3.6" fill="#fff"/>
    <circle cx="-4.6" cy="-28" r="1.8" fill="#111"/><circle cx="5.4" cy="-28" r="1.8" fill="#111"/>
    <path d="M-10 -36 l8 3 M10 -36 l-8 3" stroke="#111" stroke-width="2" stroke-linecap="round"/>
    <path d="M-6 -21 h12 l-6 7 Z" fill="#f2a13b"/>
    <path d="M-8 38 h-8 M8 38 h8" stroke="#f2a13b" stroke-width="4" stroke-linecap="round"/>
    <!-- Klemmbrett -->
    <g transform="rotate(-8 -24 6)">
      <rect x="-44" y="-12" width="30" height="38" rx="2.5" fill="#c38a55" stroke="#2b3442" stroke-width="2"/>
      <rect x="-40" y="-6" width="22" height="28" fill="#fbf4e2" stroke="#2b3442" stroke-width="1.2"/>
      <rect x="-34" y="-15" width="10" height="6" rx="1.5" fill="#a7afba" stroke="#2b3442" stroke-width="1.2"/>
      <path d="M-37 1 l3 3 l5 -6 M-37 13 l3 3 l5 -6" fill="none" stroke="#3f9b5a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-27 2 h7 M-27 14 h7" stroke="#2b3442" stroke-width="1.2" stroke-linecap="round"/>
    </g>
    <path d="M-17 2 q-10 4 -14 10" fill="none" stroke="#2b3442" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- Absperrband -->
  <g stroke="#2b3442" stroke-width="2">
    <rect x="152" y="132" width="6" height="34" rx="2" fill="#c9a227"/>
    <circle cx="155" cy="130" r="5" fill="#c9a227"/>
  </g>
  <path d="M108 140 q22 10 44 -6" fill="none" stroke="#e2574c" stroke-width="3.5" stroke-linecap="round"/>
</svg>
