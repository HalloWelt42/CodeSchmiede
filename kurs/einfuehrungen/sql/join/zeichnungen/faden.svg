<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein Pinguin verbindet mit einem roten Faden eine Pinguin-Karteikarte mit einer Kolonie-Karteikarte">
  <ellipse cx="130" cy="170" rx="112" ry="6" fill="rgba(0,0,0,.12)"/>
  <!-- linke Karte: Pinguin -->
  <g transform="rotate(-6 56 62)">
    <rect x="14" y="30" width="86" height="62" rx="4" fill="#fbf4e2" stroke="#2b3442" stroke-width="2.2"/>
    <path d="M14 44 h86" stroke="#e2574c" stroke-width="1.4"/>
    <circle cx="30" cy="62" r="9" fill="#2b3442"/><circle cx="30" cy="64" r="5.5" fill="#f4f1ea"/>
    <g fill="#a7afba"><rect x="46" y="54" width="44" height="6" rx="2"/><rect x="46" y="66" width="30" height="6" rx="2"/></g>
    <rect x="44" y="76" width="34" height="9" rx="2" fill="#7aa6c2"/>
  </g>
  <!-- rechte Karte: Kolonie -->
  <g transform="rotate(5 196 66)">
    <rect x="152" y="32" width="88" height="62" rx="4" fill="#fbf4e2" stroke="#2b3442" stroke-width="2.2"/>
    <path d="M152 46 h88" stroke="#e2574c" stroke-width="1.4"/>
    <rect x="162" y="54" width="34" height="9" rx="2" fill="#7aa6c2"/>
    <g fill="#a7afba"><rect x="162" y="68" width="66" height="6" rx="2"/><rect x="162" y="80" width="46" height="6" rx="2"/></g>
    <path d="M206 58 l10 -10 l10 10 Z" fill="#eef3f7" stroke="#2b3442" stroke-width="1.4"/>
  </g>
  <!-- Faden von Feld zu Feld -->
  <path d="M78 84 C104 128 136 40 166 60" fill="none" stroke="#e2574c" stroke-width="3" stroke-linecap="round"/>
  <circle cx="78" cy="84" r="3.2" fill="#e2574c"/><circle cx="166" cy="60" r="3.2" fill="#e2574c"/>
  <!-- Pinguin hält den Faden -->
  <g transform="translate(124 132)">
    <ellipse cx="0" cy="10" rx="17" ry="24" fill="#2b3442"/>
    <ellipse cx="0" cy="14" rx="11" ry="17" fill="#f4f1ea"/>
    <circle cx="0" cy="-20" r="12.5" fill="#2b3442"/>
    <circle cx="-4.5" cy="-22" r="3.1" fill="#fff"/><circle cx="4.5" cy="-22" r="3.1" fill="#fff"/>
    <circle cx="-4" cy="-23" r="1.6" fill="#111"/><circle cx="5" cy="-23" r="1.6" fill="#111"/>
    <path d="M-5 -16 h10 l-5 6 Z" fill="#f2a13b"/>
    <path d="M-7 34 h-6 M7 34 h6" stroke="#f2a13b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-14 -2 q-10 -14 -4 -38" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
    <path d="M14 -2 q10 -14 2 -34" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
