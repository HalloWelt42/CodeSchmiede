<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pinguine stehen der Größe nach in einer Reihe, der größte auf einem kleinen Siegertreppchen">
  <defs>
    <g id="aufstellung-pinguin">
      <ellipse cx="0" cy="0" rx="10" ry="14" fill="#2b3442"/>
      <ellipse cx="0" cy="2.5" rx="6.6" ry="10" fill="#f4f1ea"/>
      <circle cx="0" cy="-19" r="7.5" fill="#2b3442"/>
      <circle cx="-2.6" cy="-20" r="1.9" fill="#fff"/><circle cx="2.6" cy="-20" r="1.9" fill="#fff"/>
      <circle cx="-2.6" cy="-20" r="1" fill="#111"/><circle cx="2.6" cy="-20" r="1" fill="#111"/>
      <path d="M-3 -16 h6 l-3 3.5 Z" fill="#f2a13b"/>
      <path d="M-4 14 h-4 M4 14 h4" stroke="#f2a13b" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </defs>
  <ellipse cx="130" cy="170" rx="116" ry="6" fill="rgba(0,0,0,.12)"/>
  <!-- Treppchen -->
  <rect x="196" y="140" width="46" height="28" rx="2" fill="#c9a227" stroke="#2b3442" stroke-width="2.2"/>
  <path d="M212 148 l7 -3 v16" fill="none" stroke="#2b3442" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Reihe vom kleinsten zum größten -->
  <use href="#aufstellung-pinguin" transform="translate(30 154) scale(.72)"/>
  <use href="#aufstellung-pinguin" transform="translate(62 151) scale(.84)"/>
  <use href="#aufstellung-pinguin" transform="translate(98 148) scale(.96)"/>
  <use href="#aufstellung-pinguin" transform="translate(138 145) scale(1.08)"/>
  <use href="#aufstellung-pinguin" transform="translate(178 142) scale(1.2)"/>
  <use href="#aufstellung-pinguin" transform="translate(219 117) scale(1.34)"/>
  <!-- Pfeil -->
  <path d="M24 58 Q120 30 214 58" fill="none" stroke="#7aa6c2" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M206 50 l9 8 l-11 4" fill="none" stroke="#7aa6c2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Waage -->
  <g transform="translate(26 92)">
    <rect x="-14" y="0" width="28" height="8" rx="2" fill="#a7afba" stroke="#2b3442" stroke-width="1.8"/>
    <circle cx="0" cy="-8" r="8" fill="#fbf4e2" stroke="#2b3442" stroke-width="1.8"/>
    <path d="M0 -8 l4 -4" stroke="#e2574c" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
