    <circle cx="-5" cy="-24" r="3.1" fill="#fff"/><circle cx="4" cy="-24" r="3.1" fill="#fff"/>
    <circle cx="-6" cy="-25" r="1.6" fill="#111"/><circle cx="3" cy="-25" r="1.6" fill="#111"/>
    <path d="M-11 -19 l-8 3 l8 3 Z" fill="#f2a13b"/>
    <path d="M-7 32 h-6 M7 32 h6" stroke="#f2a13b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-15 -4 q-8 10 -6 22" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
    <path d="M15 -4 q10 -10 8 -26" fill="none" stroke="#2b3442" stroke-width="6" stroke-linecap="round"/>
    <path d="M18 -42 q4 -8 10 -4 q4 4 -2 8 q-3 2 -3 6" fill="none" stroke="#2b3442" stroke-width="2.2" stroke-linecap="round"/>
