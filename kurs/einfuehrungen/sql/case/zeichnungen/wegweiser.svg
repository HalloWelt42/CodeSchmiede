  <!-- Pfosten -->
  <rect x="104" y="40" width="10" height="128" rx="2" fill="#a8733f" stroke="#2b3442" stroke-width="2.2"/>
  <!-- drei Arme -->
  <path d="M100 46 h-68 l-14 12 l14 12 h68 Z" fill="#7aa6c2" stroke="#2b3442" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M118 74 h66 l14 12 l-14 12 h-66 Z" fill="#f2a13b" stroke="#2b3442" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M100 104 h-56 l-12 11 l12 11 h56 Z" fill="#e2574c" stroke="#2b3442" stroke-width="2.2" stroke-linejoin="round"/>
  <g stroke="#f4f1ea" stroke-width="3" stroke-linecap="round" opacity=".85">
