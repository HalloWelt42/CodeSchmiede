<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ein dunkles Treppenhaus mit einer leuchtenden Lampe und einem Taster, draußen am Fenster einmal Regen und einmal kein Regen">
  <ellipse cx="130" cy="170" rx="118" ry="6" fill="rgba(0,0,0,.12)"/>
  <rect x="6" y="6" width="248" height="150" rx="4" fill="#2f3a4d"/>
  <!-- Treppe -->
  <path d="M 20 150 H 70 V 130 H 110 V 110 H 150 V 90 H 190 V 70 H 240 V 150 Z" fill="#4a5568" stroke="#1f2733" stroke-width="2"/>
  <!-- Lampe mit Lichtkegel -->
  <path d="M 130 22 L 90 98 H 170 Z" fill="rgba(251,191,36,.22)"/>
  <line x1="130" y1="6" x2="130" y2="18" stroke="#1f2733" stroke-width="2"/>
  <circle cx="130" cy="24" r="9" fill="#fbbf24" stroke="#1f2733" stroke-width="2"/>
  <!-- Taster -->
  <rect x="36" y="96" width="18" height="24" rx="3" fill="#e5e7eb" stroke="#1f2733" stroke-width="2"/>
  <circle cx="45" cy="108" r="4" fill="#f59e0b"/>
  <!-- zwei Fenster: Regen und kein Regen -->
  <rect x="196" y="18" width="44" height="34" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <g stroke="#38bdf8" stroke-width="2"><line x1="204" y1="24" x2="200" y2="34"/><line x1="216" y1="26" x2="212" y2="36"/><line x1="228" y1="24" x2="224" y2="34"/><line x1="210" y1="38" x2="206" y2="48"/><line x1="224" y1="38" x2="220" y2="48"/></g>
  <rect x="16" y="18" width="44" height="34" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="44" cy="30" r="5" fill="#e5e7eb"/>
</svg>
