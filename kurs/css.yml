# CSS-Kurs: Kapitel in Reihenfolge, je Kapitel Einführung, Übungen (verblassend, je Übung eine neue Sache) und das
# Stück des Kapitelprojekts Speisekarte. Ein Kapitel steht hier erst, wenn es fertig ist (Inbetriebnahme
# kapitelweise). Beispiele und Übungen laufen auf der Bühne im Browser; geübt wird als CSS-Nachbau mit vorgegebenem HTML.
sprache: css
titel: CSS
bloecke:
  - titel: Erste Schritte
    kapitel:
      - einfuehrung: css-html
        uebungen: [w011-erste-farbe, w012-ueberschrift-gold, w013-schild, w014-buehne-faerben, w015-liste, w016-markieren, w017-abschalten]
        projekt: [w019-speisekarte-farben]
      - einfuehrung: css-klassen
        uebungen: [w021-punkt, w022-zwei-klassen, w023-gleiche-klasse, w024-id, w025-mehrere-klassen, w026-nur-listeneintraege, w027-ausnahme]
        projekt: [w029-speisekarte-klassen]
      - einfuehrung: css-kombinieren
        uebungen: [w031-nur-in-der-karte, w032-tief-drin, w033-direkt-in-der-kiste, w034-alle-ueberschriften, w035-alles-in-der-karte, w036-gruppe-mit-tiefe, w037-ein-leerzeichen]
        projekt: [w039-speisekarte-bereiche]
      - einfuehrung: css-kaskade
        uebungen: [w041-reihenfolge, w042-genauer-werden, w043-eine-fuer-alle, w044-erben-lassen, w045-eigene-regel, w046-hintergrund-erbt-nicht, w047-ausverkauft]
        projekt: [w049-speisekarte-kaskade]
      - einfuehrung: css-farben
        uebungen: [w051-orange-mischen, w052-hex-lachs, w053-hex-kurz, w054-grautoene, w055-eisscholle, w056-blass, w057-glasfenster]
        projekt: [w059-speisekarte-hausfarben]
  - titel: Gestalten
    kapitel:
      - einfuehrung: css-schrift
        uebungen: [w061-groesser, w062-tafel, w063-dick-und-schraeg, w064-schriftfamilien, w065-mittig, w066-ausverkauft-streichen, w067-luftig]
        projekt: [w069-speisekarte-schrift]
      - einfuehrung: css-kastenmodell
        uebungen: [w071-schild, w072-polster, w073-rahmen, w074-abstand, w075-genau-300, w076-border-box, w077-mittig]
        projekt: [w079-speisekarte-kasten]
