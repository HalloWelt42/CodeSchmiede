[project]
name = "codeschmiede"
version = "0.1.0"
description = "Lokaler, gamifizierter Programmier-Trainer"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "watchfiles>=1.3.0",
    "httpx2>=2.16.0",
    # Anmeldung mit dem Kellerwolke-Konto; fester Commit, damit Docker jeden Stand neu baut (tools/appkern.sh)
    "appkern[web] @ https://github.com/HalloWelt42/appkern/archive/07ac14ace952927f733acebb044eaa65782a0fec.tar.gz",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codeschmiede = ["db/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
